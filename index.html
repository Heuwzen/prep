<script type="application/json" id="content">{"packs": [{"id": "marketing-seminar-c", "course": "Marketing", "title": "Seminar C: customers and competitors", "date": "2026-10-20T12:00:00+03:00", "place": "Room V, Kaunas Faculty", "part": "Customers and competitors", "lessons": [{"id": "big-picture", "title": "The big picture", "cards": [{"title": "Two circles around a company", "body": "Picture two circles around a company. The inner one is the micro-environment: the players close to it. The outer one is the macro-environment: big forces in society. Kotler, the textbook author your lecture followed, says both shape how well it wins and keeps customers.", "example": "Seminar B was the outer circle. Seminar C is the inner one."}, {"title": "Macro: the outer circle", "body": "The macro-environment is the big forces in society: population, the economy, nature, technology, politics and culture. Your group covered them in seminar B. You wrote the natural and socio-cultural parts.", "example": "Cold Kaunas winters shorten the battery life. That is a natural force."}, {"title": "Micro: the inner circle", "body": "The micro-environment is the players close to the company. Kotler calls them actors: the company itself, its partners and suppliers, the firms that help it sell, its competitors, its publics and its customers. Publics are groups like the media. Your course calls them contact audiences.", "example": "For your product: the official online seller, rival brands and the buyers."}, {"title": "Micro or macro? A quick test", "body": "Ask: is it a specific player around the product, like a buyer, a seller or a rival? Then it is micro. Is it a large force in society, like a law or the weather? Then it is macro.", "example": "A privacy law is macro. A rival that sells privacy is micro."}, {"title": "Your two elements", "body": "Your group split the micro actors. Your groupmates cover partners, suppliers and contact audiences. You cover customers and competitors: who buys this product, and who else is trying to win those same buyers."}, {"title": "Customers, in Kotler's terms", "body": "Customers are the buyers. Kotler sorts them into five markets: consumer, business, reseller, government and international. For Ray-Ban Meta the consumer market is the main one: ordinary people buying glasses for themselves.", "example": "When your script says “this market is growing very fast”, it means this consumer market."}, {"title": "Competitors, in Kotler's terms", "body": "Kotler says a company must give buyers more value than its competitors do, and hold a strong place in buyers' minds against them. So you ask: who else sells to the same buyers, at what price, and with what promise?", "example": "Even Realities' promise is privacy: “Camera-free. By design.”"}]}, {"id": "customers", "title": "Your customers", "cards": [{"title": "Mostly consumers", "body": "Your customers are mostly consumers, people buying for themselves. Resellers, like opticians, buy to sell again. Internationally, the glasses sell in many countries, but Lithuania is not on Meta's supported list. On business and government buyers, the research found almost nothing.", "example": "Your group counts resellers as partners, so they are your groupmates' part."}, {"title": "A market growing fast", "body": "In 2025 more than 7 million AI glasses from Ray-Ban and Oakley were sold. In the two years before that, it was only about 2 million. That jump is why you say the market is growing very fast.", "example": "“The two years before” means 2023 and 2024 added together. Oakley Meta only came out in 2025."}, {"title": "Keep Oakley next to the 7 million", "body": "The 7 million counts the whole line, Ray-Ban and Oakley together. It is not the Wayfarer alone. Saying “the Wayfarer sold 7 million” would be wrong, and a listener could catch it.", "example": "Asked how many were Wayfarers? The group found no source with that split."}, {"title": "Still early adopters", "body": "Sales grow fast, but owners are still a small share. A US survey found only about 5% of adults own smart glasses with a camera, of any brand. Early adopters are the buyers who try a new kind of product before most people do.", "example": "In the same survey, owning them is most common among men and people aged 30 to 44."}, {"title": "Why US data?", "body": "Someone may ask why you use US data. Your answer: the group found no Lithuanian survey on this, and the US one is recent, from August 2026. You already used the German survey in seminar B.", "example": "That German survey points the same way: about half of people there rule out wearing smart glasses."}, {"title": "What owners use most: audio", "body": "Meta says audio has been the most popular feature since day one. Audio means sound from small speakers in the frame, near your ears, like music and podcasts, with no earbuds. Meta gave this as its reason for a Ray-Ban version with no camera."}, {"title": "What owners worry about", "body": "A tech reviewer wrote that many owners love their glasses but worry about how others see them. Some said they would happily buy a pair without a camera, so they are less likely to be called a “creep”. The worry comes from the camera.", "example": "Backup fact: in a small sample of 103 owners in the same US report, one in five said someone reacted badly while they wore them in public."}]}, {"id": "competitors", "title": "Your competitors", "cards": [{"title": "Meta is the giant", "body": "Meta is the biggest smart glasses brand in the world. In the first half of 2026 it shipped 94% of all AI glasses without a screen. Shipped means sent out to be sold. Research companies say the rest is split among many small brands.", "example": "Keep “without a screen” next to the 94%. It counts Oakley too, not only the Wayfarer."}, {"title": "Three kinds of rivals", "body": "Direct rivals sell the same kind of product: other AI glasses, from cheap no-name ones to Even Realities. Meta's own other glasses compete too. Substitutes are different products that meet the same need, like plain sunglasses plus earbuds.", "example": "At the official seller, a plain Ray-Ban Wayfarer was on sale for about 175 euros. The newest smart one started at about 430."}, {"title": "The price sits in the middle", "body": "On price, Ray-Ban Meta sits in the middle. Cheap no-name AI glasses with a camera sit below it. AI glasses with a screen sit above it. On 16 Oct, the newest Wayfarer cost about 430 to 500 euros in Lithuania.", "example": "Below: under 80 euros on a Lithuanian website. Above: about 700 euros."}, {"title": "Meta competes with itself", "body": "The Wayfarer also competes with Meta's other glasses. The sporty Oakley models made up over 30% of Meta's shipments in the last three months of 2025. They sell in the same market, so a buyer who picks an Oakley pair may skip the Wayfarer.", "example": "Marketers call this cannibalisation."}, {"title": "A rival that sells privacy", "body": "Even Realities is a small brand that tries to win with privacy. Its newest glasses have a small screen but no camera. They come with the slogan “Camera-free. By design.” It turns the camera worry from your customers part into a selling point.", "example": "In Kotler's words, it positions itself against Meta in buyers' minds."}, {"title": "Why you end on privacy", "body": "Meta now sells a camera-free Ray-Ban too. But IDC, a research company, says Meta only added privacy steps after people got angry. It says this leaves room for a rival that builds privacy in from the start. The Wayfarer still has a camera.", "example": "Asked which privacy steps? The source only says they came after the backlash."}, {"title": "What about Apple and Google?", "body": "They are future rivals. Apple's glasses are only a report so far: shown in mid 2027 and on sale by the end of 2027. Samsung's glasses, built with Google, had no price when the group checked. Your part looks at rivals people can buy now.", "example": "A groupmate covered Apple and Google in seminar B, so you can point back to that."}]}, {"id": "lithuania", "title": "The Lithuania angle", "cards": [{"title": "Online only", "body": "In Lithuania, the group found no physical store that sells the glasses. As far as you know, they can only be ordered online. So a buyer here has no shop where they can try a pair on first.", "example": "Your script: “Here in Lithuania we could only find the glasses online.”"}, {"title": "Shipped from Italy", "body": "The official seller the group found has no shop in Lithuania. It sends every pair from its optician in Italy. Free delivery usually takes 9 to 15 days.", "example": "Pairs the seller must order from the maker take longer. If the maker has none, it can take 1 to 1.5 months or longer."}, {"title": "Meta AI is not supported here", "body": "Lithuania is not on Meta's list of supported countries, and Lithuanian is not one of Meta AI's languages. So officially, a buyer here does not get the AI assistant. You already said this in seminar B.", "example": "That is why your script says “As we said before”."}, {"title": "What still works", "body": "The seller here describes photos, video, music and calls. As far as we can tell, none of that is the AI assistant. Meta says audio has been the most popular feature since day one. So the product still makes sense here.", "example": "Meta has not published a Lithuania feature list, so say “as far as we found”."}, {"title": "Why this product at all?", "body": "Someone may ask why your group picked a product whose AI is not supported here. Your answer: it is the most popular smart glasses in the world, it is a very controversial one, and Lithuanians can still order it online.", "example": "“Controversial” points to privacy, which you covered in seminar B."}, {"title": "Camera-free options here?", "body": "Meta's Ray-Ban with no camera is not confirmed on sale in Lithuania. The official seller did not list it on 16 Oct. Even Realities' own online store does have a page for Lithuania with prices in euros.", "example": "Handy if someone asks whether privacy rivals matter in Lithuania."}]}, {"id": "product", "title": "Product basics", "cards": [{"title": "What it is", "body": "Ray-Ban Meta Wayfarer looks like classic Ray-Ban sunglasses. The frame carries a camera, microphones and small speakers near your ears, and it comes with an AI assistant. So it is eyewear and a small wearable computer in one.", "example": "The lenses can be sun, clear, polarised or prescription."}, {"title": "Who makes it", "body": "Two companies make it together. Meta supplies the AI, the software and the app. EssilorLuxottica, the company that owns Ray-Ban, designs, makes and sells the frames through its own stores and through opticians.", "example": "The sporty Oakley Meta glasses come from the same partnership."}, {"title": "What it does", "body": "It takes photos and videos hands-free, plays music and handles calls. Where Meta AI is supported, the wearer can ask it questions. In some countries it also translates speech and answers what they are looking at. Meta says the newest lasts up to 9 hours.", "example": "In Lithuania the seller describes the photos, video, music and calls. The AI part is not supported."}, {"title": "No screen", "body": "The Wayfarer has no screen inside the lens. Glasses with a screen are a separate, pricier kind. Meta's own screen glasses cost 899 euros and are not sold in Lithuania.", "example": "This is what “without a screen” next to your 94% means."}, {"title": "The recording light", "body": "A small light on the frame turns on whenever the glasses record, so people nearby can tell. It is the main privacy safeguard. You covered it in seminar B, including people who found ways to switch it off.", "example": "The light has been there since the first pair in 2021, and the newest model still has it."}, {"title": "The generations", "body": "Ray-Ban Stories came first, in 2021. The first Ray-Ban Meta followed in 2023, then Gen 2 in September 2025 and Gen 3 in September 2026. Some sources call the 2021 pair Gen 1, so always say the year.", "example": "Your script's price is for Gen 3. Still open in your group: Gen 2 or Gen 3 for the project."}, {"title": "Keep the sister models apart", "body": "The same partnership also makes sporty Oakley glasses, a Ray-Ban with no camera and glasses with a screen. Facts about those are not facts about the Wayfarer. Always say which model a number belongs to.", "example": "The 7 million includes Oakley, so never call it Wayfarer sales."}]}], "glossary": [{"term": "Micro-environment", "meaning": "The company and the players close to it: partners, suppliers, the firms that help it sell, competitors, publics and customers. Seminar C is about this layer."}, {"term": "Macro-environment", "meaning": "The big forces in society around a company: demographic, economic, natural, technological, political and cultural. Seminar B was about this layer."}, {"term": "Consumer market", "meaning": "Ordinary people buying for their own use. It is one of Kotler's five customer markets, and the main one for Ray-Ban Meta."}, {"term": "Early adopters", "meaning": "An early group of buyers who try a new kind of product before most people do. Your script says smart glasses buyers are still this group."}, {"term": "Market share", "meaning": "A brand's slice of one market. Always name the market: Meta's 94% covers only AI glasses without a screen."}, {"term": "Shipments", "meaning": "Units a maker sends out into the market. These are units sent to sellers, not always units bought by customers. Research companies count them to measure market share. Your 94% and “over 30%” are shares of shipments."}, {"term": "Substitute", "meaning": "A different kind of product that meets the same need. For some buyers, plain sunglasses plus wireless earbuds replace smart glasses."}, {"term": "Positioning", "meaning": "The clear place a brand wants to hold in buyers' minds against its rivals. Even Realities positions itself on privacy."}, {"term": "Competing with your own products", "meaning": "When a company's own products take buyers from each other. Marketers call it cannibalisation. A buyer who picks an Oakley Meta pair may skip the Wayfarer."}, {"term": "AI glasses without a screen", "meaning": "Smart glasses with AI, microphones and speakers (most have a camera too) but no display in the lens, like the Wayfarer. Camera-free audio glasses also count. Glasses with a screen show information in the lens and cost more."}, {"term": "Direct competitor", "meaning": "A brand that sells the same kind of product to the same buyers. For the Wayfarer, that means other AI glasses."}, {"term": "Contact audiences", "meaning": "Your course's name for Kotler's publics, groups that can affect the company, like the media. Your groupmates cover them."}, {"term": "Reseller", "meaning": "A shop or optician that buys products to sell them again. Kotler counts resellers as a customer market, and your group counts them as partners."}], "numbers": [{"value": "more than 7 million", "say": "more than seven million", "meaning": "AI glasses sold in 2025.", "scope": "The year 2025, worldwide. Ray-Ban and Oakley AI glasses together, never the Wayfarer alone. No Wayfarer-only number was found.", "source": "EssilorLuxottica 2025 results and CNBC, 11 Feb 2026"}, {"value": "about 2 million", "say": "about two million", "meaning": "AI glasses sold in the two years before 2025.", "scope": "2023 and 2024 added together. Oakley Meta did not exist yet, so this is the Ray-Ban Meta line only. The 7 million also includes Oakley.", "source": "CNBC, 11 Feb 2026"}, {"value": "about 5%", "say": "about five percent", "meaning": "US adults who own smart glasses with a camera.", "scope": "US adults only, August 2026. Camera smart glasses of any brand, not only Ray-Ban Meta. It is a share of people, not of the 7 million sales.", "source": "Security.org survey, Aug 2026"}, {"value": "30 to 44", "say": "thirty to forty-four", "meaning": "The age group where owning camera smart glasses is most common.", "scope": "Same US survey, all brands of camera smart glasses. Ownership is also highest among men.", "source": "Security.org survey, Aug 2026"}, {"value": "9 to 15 days", "say": "nine to fifteen days", "meaning": "How long free delivery usually takes from the official seller to Lithuania.", "scope": "Free delivery to a parcel locker on orders over 70 euros, from the official online seller, which ships from Italy. Pairs it must order from the maker take longer, and 1 to 1.5 months or longer if the maker's warehouse has none.", "source": "Estheroptica (official online seller), checked 16 Oct 2026"}, {"value": "94%", "say": "ninety-four percent", "meaning": "Meta's share of all AI glasses without a screen shipped worldwide.", "scope": "First half of 2026, worldwide, AI glasses without a screen only. All of Meta's glasses together, Oakley included, not the Wayfarer alone. For all smart glasses, Meta had 82% in the second half of 2025.", "source": "Counterpoint Research, 21 Sep 2026"}, {"value": "under 80 euros", "say": "under eighty euros", "meaning": "The price of cheap no-name AI glasses with a camera.", "scope": "Listings by other sellers on Varle.lt, a Lithuanian marketplace, on 16 Oct 2026. No-name brands, not Ray-Ban Meta.", "source": "Varle.lt, checked 16 Oct 2026"}, {"value": "about 430 to 500 euros", "say": "about four hundred and thirty to five hundred euros", "meaning": "What the newest Wayfarer cost in Lithuania when the group checked.", "scope": "Gen 3 Wayfarer at the official online seller on 16 Oct 2026: 426.55 euros (matte black) up to 502.55 euros (lenses that darken in the sun).", "source": "Estheroptica (official online seller), checked 16 Oct 2026"}, {"value": "about 700 euros", "say": "about seven hundred euros", "meaning": "An example starting price for AI glasses with a screen.", "scope": "Two rivals start at 699 euros: Even Realities' Even G2 and Rokid's screen glasses (Rokid's price is for Germany). Meta's own screen glasses cost 899 euros and are not sold in Lithuania. Other screen glasses cost more.", "source": "Even Realities' store, checked 16 Oct 2026, and heise online, 29 Apr 2026"}, {"value": "over 30%", "say": "over thirty percent", "meaning": "The share of all glasses Meta shipped that were sporty models like the Oakleys.", "scope": "Last three months of 2025. Sporty AI glasses, including the Oakley Meta HSTN and Vanguard, as a share of Meta's own shipments, not of the whole market.", "source": "Counterpoint Research, 27 Feb 2026"}], "plan": ["Learn the five lessons, one card at a time.", "Read your script aloud twice with the 3-minute timer.", "Do the quiz until every answer feels easy.", "Practise the questions: answer out loud, then reveal.", "Read the calm chapters once, slowly, before sleep.", "Before 12:00: read the Numbers list one last time."], "script": {"customers": [{"sentence": "This market is growing very fast.", "fact": "Sales of these AI glasses, Ray-Ban and Oakley together, jumped from about 2 million across 2023 and 2024 combined to more than 7 million in 2025. Meta also said in April 2026 that the number of people using its AI glasses every day had tripled in a year.", "source": "EssilorLuxottica 2025 results and CNBC, 11 Feb 2026. Meta earnings call, 29 Apr 2026.", "question": "Which market do you mean?", "answer": "The consumer market, so normal people buying the glasses for themselves. Out of Kotler's five customer markets, that's the main one for these glasses."}, {"sentence": "In 2025 more than 7 million AI glasses from Ray-Ban and Oakley were sold.", "fact": "EssilorLuxottica, Ray-Ban's owner and Meta's partner on these glasses, sold more than 7 million AI glasses in 2025. The number counts Ray-Ban Meta and Oakley Meta together, never the Wayfarer alone.", "source": "EssilorLuxottica 2025 results and CNBC, 11 Feb 2026", "question": "How many of those were Wayfarers?", "answer": "We couldn't find that anywhere. The company only gives one number for Ray-Ban and Oakley together, so there's no figure for the Wayfarer alone."}, {"sentence": "In the two years before that it was only about 2 million.", "fact": "About 2 million of these AI glasses were sold across 2023 and 2024 combined, not per year. That's why the jump to more than 7 million in 2025 is so big.", "source": "CNBC, 11 Feb 2026", "question": "Is that 2 million per year?", "answer": "No, that's both years together, 2023 and 2024. Then 2025 alone was more than 7 million."}, {"sentence": "But the buyers are still a small group of early adopters.", "fact": "Early adopters are the first, small group who buy something new before most people do. Only about 5% of US adults own camera smart glasses, so most people haven't bought them yet.", "source": "Security.org survey, Aug 2026 (US)", "question": "What do you mean by early adopters?", "answer": "The first people who buy a new product, before most people do. In Rogers' model of how new products spread, innovators and early adopters are the first 16% of people to adopt. With about 5% of US adults owning camera glasses, I'd say we're still there."}, {"sentence": "A survey in the US found that only about 5% of adults own smart glasses with a camera.", "fact": "A Security.org report from August 2026 found that about 5% of US adults own smart glasses with a built-in camera. It counts every brand, not only Ray-Ban Meta.", "source": "Security.org, Aug 2026. Bitkom (Germany), 21 Aug 2026.", "question": "Why did you use US data?", "answer": "We couldn't find a survey like that for Lithuania. The US one is recent, from August 2026, and it asks who owns camera glasses. We used the German survey in seminar B, and it points the same way: about half of people there rule out wearing them."}, {"sentence": "Owning them is most common among men and among people aged 30 to 44.", "fact": "In the same US survey, ownership was highest among men and among adults aged 30 to 44. It's about all camera smart glasses in the US, not Ray-Ban Meta buyers only.", "source": "Security.org, Aug 2026", "question": "Is it the same in Lithuania?", "answer": "We don't know. We couldn't find any survey of buyers in Lithuania, so the US survey is the best data we found."}, {"sentence": "When it comes to features, Meta says audio has been the most popular one since day one.", "fact": "Meta wrote that \"Audio has been our most popular feature since day one.\" Audio means sound from small speakers in the frame, near your ears, like music and podcasts, with no earbuds.", "source": "Meta announcement, 23 Sep 2026", "question": "Isn't that just Meta praising its own product?", "answer": "It is Meta's own claim. But they acted on it and launched a Ray-Ban version with no camera, with audio as their reason."}, {"sentence": "A tech reviewer wrote that a lot of owners love their glasses but worry about how others see them.", "fact": "An Engadget review said many owners \"loved their glasses, but were worried about how others might perceive them\". The reviewer heard this in interviews with Meta glasses users, so it is not a survey. In the same Security.org report, a small sample of 103 owners showed that, one in five had got a negative reaction from someone in public while wearing them. The sample is small.", "source": "Engadget, 13 Oct 2026. Security.org, Aug 2026.", "question": "Is that just one reviewer's opinion?", "answer": "It's one reviewer's report of what owners told her, so it's not a survey. But a small owner sample in the same US report points the same way: of about 100 owners asked, one in five said someone reacted badly while they wore them in public."}, {"sentence": "Some even said they would buy a pair without a camera so they wouldn't get called a ''creep''.", "fact": "The same review says some owners would happily buy a pair without cameras if it made them less likely to be labeled a \"creep\". The review was of Meta's new Ray-Ban glasses that have no camera.", "source": "Engadget, 13 Oct 2026", "question": "Did Meta do anything about that?", "answer": "In a way, yes. Meta now sells a Ray-Ban version with no camera, though Meta's own reason is that audio is the most popular feature."}, {"sentence": "Here in Lithuania we could only find the glasses online.", "fact": "The group's search found no physical store in Lithuania that sells these glasses, though some shop websites were hard to search. The main seller says on its website that it has no physical shop in Lithuania, and that activated glasses cannot be returned.", "source": "Group search, and estheroptica.lt, 16 Oct 2026", "question": "So can people try them on before buying?", "answer": "Not in a shop here, as far as we found. You order online and wait for delivery. And the seller says a pair can't be returned once it's activated."}, {"sentence": "The official seller we found sends every pair from Italy, and free delivery usually takes 9 to 15 days.", "fact": "The seller is Estheroptica, which calls itself an official Ray-Ban Meta seller and ships its pairs from its optician in Avezzano, Italy. Free delivery to a parcel locker, on orders over 70 euros, takes 9 to 15 days. Pairs it must order from the maker take longer, and 1 to 1.5 months or longer if the maker has none.", "source": "estheroptica.lt, 16 Oct 2026", "question": "Which seller is that?", "answer": "Estheroptica, an official Ray-Ban Meta seller. It has no shop in Lithuania and sends its pairs from Italy. Other online shops list the glasses too."}, {"sentence": "As we said before, Meta AI isn't supported here.", "fact": "Lithuania is not on Meta's own list of countries where its AI glasses are supported, and Lithuanian is not one of Meta AI's languages. The group already said this in seminar B, so here it only comes up briefly.", "source": "Meta Help Center, supported countries and languages, checked 16 Oct 2026", "question": "What exactly doesn't work here?", "answer": "The AI assistant, so asking it questions or having it describe what you're looking at. Lithuania isn't on Meta's list of supported countries, and Lithuanian isn't one of its languages."}, {"sentence": "But the camera and the audio work, so a Lithuanian buyer still gets the most popular feature.", "fact": "The seller here describes photos, video, music and calls. As far as we can tell, none of that is the AI assistant. Meta says audio is the most popular feature. No official feature list for Lithuania was found, and the group has not tested a pair here.", "source": "Meta, 23 Sep 2026. estheroptica.lt info page, 9 Dec 2025.", "question": "How do you know the camera and audio work without the AI?", "answer": "The seller here describes the glasses for photos, video, music and calls, and none of that is the AI assistant. To be fair, we didn't find an official feature list for Lithuania."}], "competitors": [{"sentence": "Meta is the biggest smart glasses brand in the whole world.", "fact": "Counterpoint Research tracks how many glasses each brand ships. Meta shipped 82% of all smart glasses worldwide in the second half of 2025. Counting all smart glasses, Meta went from over 60% in 2024 to 73% in the first half of 2025 and 82% in the second half, so its lead grew all through 2025. The 94% is a different count, so it stays out of this line.", "source": "Counterpoint Research, 26 Feb 2025, 12 Aug 2025 and 27 Feb 2026", "question": "Biggest by what, sales or money?", "answer": "By the number of glasses shipped, so how many pairs go out to be sold. Counting all smart glasses, Meta had 82% in the second half of 2025."}, {"sentence": "As a matter of fact they shipped 94% of all AI glasses without a screen in the first half of 2026.", "fact": "Counterpoint Research says that from January to June 2026, Meta shipped 94% of all AI glasses without a display worldwide. Glasses with a screen are not in this number.", "source": "Counterpoint Research, 21 Sep 2026", "question": "94% of what exactly?", "answer": "AI glasses without a screen, worldwide, in the first half of 2026. If you count all smart glasses, Meta had 82% in the second half of 2025."}, {"sentence": "All the other brands have very small shares.", "fact": "Counterpoint says \"Outside Meta, the market remains highly fragmented\", meaning it's split between many small brands. IDC found the next four brands after Meta each had under 4% from April to June 2026, in a different count that also includes headsets. Among glasses with a screen, a smaller group, Counterpoint says Chinese brands such as Rokid lead.", "source": "Counterpoint Research, 21 Sep 2026. IDC, 16 Sep 2026.", "question": "Which brands come after Meta?", "answer": "Brands like Xiaomi and Alibaba. In IDC's count, each of the next brands after Meta had under 4%, so nobody is close to Meta."}, {"sentence": "The price of Ray-Ban Meta is in the middle.", "fact": "This compares the Wayfarer with other AI glasses on price. Cheap no-name camera glasses sit below it, and AI glasses with a screen sit above it. Backup if asked about a rival at the same price: in Germany, Rokid sells AI glasses for 449 euros, and the German tech site heise calls them a Ray-Ban Meta rival on technology and price. Ray-Ban Meta Gen 2 started at 419 euros there.", "source": "varle.lt and estheroptica.lt, 16 Oct 2026. evenrealities.com. heise online, 29 Apr 2026.", "question": "In the middle compared to what?", "answer": "Compared to other AI glasses. No-name ones with a camera cost under 80 euros, the newest Wayfarer about 430 to 500, and AI glasses with a screen cost more, for example about 700."}, {"sentence": "You can find no-name AI glasses with a camera for under 80 euros on a Lithuanian website.", "fact": "Varle.lt, a Lithuanian online marketplace, listed AI glasses with a camera from small unknown brands for under 80 euros. Other sellers post their products there, so these are third-party listings.", "source": "varle.lt, 16 Oct 2026", "question": "Which website?", "answer": "Varle.lt. It's a Lithuanian marketplace where other sellers list products, and you can find AI camera glasses from unknown brands there for under 80 euros."}, {"sentence": "When we checked, the newest Wayfarer cost about 430 to 500 euros here.", "fact": "The newest Wayfarer is the Gen 3, out since 23 Sep 2026. On 16 Oct 2026 the official seller listed it from 426.55 to 502.55 euros, depending on the lenses.", "source": "estheroptica.lt, 16 Oct 2026", "question": "Why is there a price range?", "answer": "It depends on the lenses. The basic matte black one was about 427 euros, polarised lenses about 455, and lenses that darken in the sun about 503."}, {"sentence": "AI glasses with a screen cost more, for example about 700 euros.", "fact": "These glasses have a small display you see in the lens. Even Realities' Even G2 starts at 699 euros, and Meta's own glasses with a screen cost 899 euros.", "source": "evenrealities.com, Lithuania store page. Road to VR, 23 Sep 2026.", "question": "Can you buy Meta's own screen glasses here?", "answer": "No. They cost 899 euros, and in the EU they're only sold in France, Italy and Germany."}, {"sentence": "The Wayfarer has to compete with Meta's other glasses too.", "fact": "Meta sells other AI glasses besides the Wayfarer, like the sporty Oakley Meta models and a Ray-Ban version with no camera. A buyer who picks one of those may not buy a Wayfarer. In Lithuania the same seller lists Oakley Meta at 464.55 and 521.55 euros.", "source": "Meta announcement, 23 Sep 2026. Counterpoint Research, 27 Feb 2026. estheroptica.lt, 16 Oct 2026.", "question": "Why is Oakley a competitor if it's the same company?", "answer": "Because our product is the Wayfarer, not the whole company. Oakley Meta sits in the same market, and here the same seller sells it too, at similar prices. So a buyer who picks an Oakley pair may skip the Wayfarer."}, {"sentence": "The sporty Oakley models made up over 30% of the glasses Meta shipped in the last three months of 2025.", "fact": "Counterpoint Research says sporty AI glasses, including the Oakley Meta HSTN and Vanguard, together made up over 30% of everything Meta shipped from October to December 2025. Meta's own launch post says HSTN is pronounced “HOW-stuhn”.", "source": "Counterpoint Research, 27 Feb 2026. Meta Newsroom, 20 Jun 2025.", "question": "Which Oakley models?", "answer": "The Oakley Meta HSTN, which Meta says is pronounced “HOW-stuhn”, and the Oakley Meta Vanguard. Sporty glasses like these were over 30% of Meta's shipments in the last three months of 2025."}, {"sentence": "A small brand called Even Realities tries to win with privacy.", "fact": "Even Realities makes smart glasses with a small screen and no camera, and uses that as its selling point. Its website promises \"No recording and social friction\".", "source": "evenrealities.com, checked 16 Oct 2026", "question": "Can you buy their glasses in Lithuania?", "answer": "Yes, their online store has a page for Lithuania with prices in euros. Their newest glasses, the Even G2, start at 699 euros."}, {"sentence": "Their newest glasses come with the slogan ''Camera-free. By design.''", "fact": "The Even G2, launched in November 2025, is sold with the line \"Camera-free. By design.\" A German tech site says it has no speakers or camera, but it does have a small screen. It still has microphones, so say \"no camera\", not \"no recording\".", "source": "evenrealities.com. heise online, 13 Nov 2025.", "question": "Isn't a camera the whole point of smart glasses?", "answer": "Not for everyone. Meta itself says audio is the most popular feature. Even Realities sells having no camera as a plus, so nobody around you gets filmed."}, {"sentence": "Meta now also sells a Ray-Ban version with no camera.", "fact": "Ray-Ban Meta Audio has no camera, costs from 349 dollars, and has been shipping since 13 Oct 2026. Meta's stated reason is that audio is the most popular feature.", "source": "Meta announcement, 23 Sep 2026", "question": "Can you buy that one in Lithuania?", "answer": "Not that we could confirm. The Lithuanian seller didn't list it when we checked on 16 October."}, {"sentence": "But a research company says Meta only added privacy steps after people got angry.", "fact": "IDC, a market research company, wrote that Meta added its privacy steps only after a public backlash, when people got angry. It says this \"leaves room for a competitor willing to build privacy safeguards in before launch\".", "source": "IDC, 16 Sep 2026", "question": "Which privacy steps?", "answer": "The report doesn't name them, only that they came after the backlash. In seminar B we covered one later fix, Meta's July 2026 update for the recording light."}, {"sentence": "The Wayfarer itself still has a camera, so I think privacy is where competitors have a chance against Meta.", "fact": "This last line is your own opinion, built on two facts. The Wayfarer still has a camera, and IDC says Meta's late privacy steps leave room for a rival that builds privacy in from the start.", "source": "IDC, 16 Sep 2026", "question": "Meta sells a version with no camera now. Isn't that gap closed?", "answer": "Partly, but the Wayfarer we analyse still has a camera, and that's what people worry about. A brand that builds privacy in from the start can still use that against Meta."}]}, "quiz": [{"q": "What is the micro-environment?", "options": ["The big forces in society, like the economy and technology", "The actors close to the company, like its customers and competitors", "Only the departments inside the company", "The laws of the countries where it sells"], "answer": 1, "why": "Kotler calls the actors close to the company the micro-environment. The big forces in society are the macro-environment."}, {"q": "Which of these belongs to the macro-environment, not the micro?", "options": ["Customers", "Competitors", "Suppliers", "New technology, like AI"], "answer": 3, "why": "Technology is a big force in society, so it's macro. Customers, competitors and suppliers are actors close to the company."}, {"q": "Which of these is one of Kotler's five customer markets?", "options": ["Supplier market", "Reseller market", "Media market", "Competitor market"], "answer": 1, "why": "The five are consumer, business, reseller, government and international. Resellers buy to sell again, like opticians. Suppliers, competitors and the media are other micro actors, not customer markets."}, {"q": "What are early adopters?", "options": ["An early group who buy something new, before most people", "People who only buy once the price drops", "Shops that start selling a product first"], "answer": 0, "why": "Only about 5% of US adults own camera glasses, so the buyers are still this first small group."}, {"q": "The more than 7 million AI glasses sold in 2025 count...", "options": ["Only the Ray-Ban Meta Wayfarer", "Every smart glasses brand in the world", "Only glasses sold in Europe", "Ray-Ban Meta and Oakley Meta together"], "answer": 3, "why": "It's one number for Ray-Ban and Oakley together. We found no number for the Wayfarer alone."}, {"q": "In 2023 and 2024, about how many of these AI glasses were sold?", "options": ["About 2 million each year", "About 7 million in total", "About 2 million for both years together"], "answer": 2, "why": "About 2 million across both years combined. Then 2025 alone passed 7 million."}, {"q": "A US survey found that about what share of adults own smart glasses with a camera?", "options": ["About 5%", "About 40%", "About 70%"], "answer": 0, "why": "About 5% of US adults own camera glasses, of any brand. So most people have not bought a pair yet, which is why your script calls the buyers early adopters."}, {"q": "According to Meta, which feature has been the most popular since day one?", "options": ["The camera", "The AI assistant", "Audio", "Live translation"], "answer": 2, "why": "Meta wrote on 23 Sep 2026 that audio has been its most popular feature since day one."}, {"q": "Meta AI isn't supported in Lithuania. What does a buyer here still get?", "options": ["Nothing, the glasses need Meta AI to work", "The camera and the audio", "Live translation into Lithuanian"], "answer": 1, "why": "The seller describes photos, video, music and calls. As far as we can tell, none of that is the AI assistant, though no official feature list for Lithuania was found. So a buyer here gets audio, the most popular feature. Lithuanian isn't in live translation."}, {"q": "A new privacy law, and a rival brand that sells privacy. Which is micro and which is macro?", "options": ["Both are micro", "Both are macro", "The law is macro and the rival is micro", "The law is micro and the rival is macro"], "answer": 2, "why": "A law is a big force in society, so it is macro. A rival brand is a player close to the product, so it is micro."}, {"q": "What does Kotler say a company has to do against its competitors?", "options": ["Always sell at a lower price than every rival does", "Only sell in places where no rival sells yet", "Give more value and hold a stronger place in buyers' minds"], "answer": 2, "why": "Kotler says a company has to give buyers more value than its rivals and hold a stronger place in their minds. A lower price alone is not his answer."}, {"q": "What does market share mean?", "options": ["The part of all sales or shipments in a market that one brand has", "The price of a company's shares on the stock market", "How many countries a brand sells in"], "answer": 0, "why": "For example, Meta shipped 94% of all AI glasses without a screen in the first half of 2026."}, {"q": "What does Meta's 94% cover?", "options": ["All smart glasses, with or without a screen", "Only Ray-Ban Meta Wayfarers", "AI glasses without a screen, worldwide, first half of 2026", "All glasses sold in Europe in 2025"], "answer": 2, "why": "It counts only AI glasses without a screen. For all smart glasses, Meta had 82% in the second half of 2025."}, {"q": "What did the newest Wayfarer cost in Lithuania when the group checked?", "options": ["About 175 to 219 euros", "About 430 to 500 euros", "About 700 euros", "About 899 euros"], "answer": 1, "why": "About 430 to 500 euros, depending on the lenses. 175 to 219 euros was a plain Ray-Ban Wayfarer with no tech, and the higher prices are glasses with a screen."}, {"q": "The sporty Oakley models made up over 30% of Meta's shipments in the last three months of 2025. Why does that matter for the Wayfarer?", "options": ["Oakley is a rival company that beat Meta", "Meta's other glasses can take buyers the Wayfarer could have had", "It means the Wayfarer sold 30% more"], "answer": 1, "why": "That's a company competing with its own products. A buyer who picks an Oakley Meta pair may not buy a Wayfarer."}, {"q": "Which brand sells its glasses with the slogan \"Camera-free. By design.\"?", "options": ["Even Realities", "Meta, for its Ray-Ban with no camera", "Oakley"], "answer": 0, "why": "Even Realities sells its newest glasses as camera-free on purpose. Meta also sells a Ray-Ban with no camera, but the slogan is Even Realities'."}, {"q": "What did the research company IDC say about Meta and privacy?", "options": ["Meta built privacy in from the very start", "Meta's privacy steps closed the gap for good", "Meta added privacy steps only after a public backlash"], "answer": 2, "why": "IDC, 16 Sep 2026. That leaves room for a rival that builds privacy in before launch."}, {"q": "Which of these is the clearest substitute for Ray-Ban Meta, a different kind of product for the same need?", "options": ["Rokid's AI glasses", "Oakley Meta glasses", "No-name AI glasses with a camera", "A plain Ray-Ban Wayfarer plus wireless earbuds"], "answer": 3, "why": "A substitute meets the same need in a different way. Seminar B said many people still prefer normal sunglasses with earbuds."}], "questions": [{"q": "What do customers and competitors mean in Kotler's terms?", "who": "lecturer", "answer": "Both are actors in the micro-environment, close to the company. Customers are the buyers, in five markets: consumer, business, reseller, government and international. Competitors sell to the same buyers. Kotler says you have to give more value than they do and hold a stronger place in buyers' minds."}, {"q": "What's the difference between the micro and the macro environment?", "who": "lecturer", "answer": "The micro-environment is the actors close to the company, like its customers, competitors, suppliers and partners. The macro-environment is the bigger forces in society, like the economy, technology, nature, culture and politics. We did the macro side in seminar B, and now we're doing the micro side."}, {"q": "Who is the Wayfarer's biggest competitor?", "who": "classmate", "answer": "Among smart glasses, I'd say Meta's own. Sporty models like the Oakleys were over 30% of what Meta shipped in the last three months of 2025, and other brands are far behind. Outside smart glasses, it's what a groupmate said in seminar B: normal sunglasses plus earbuds."}, {"q": "Why did you use US data and not Lithuanian?", "who": "lecturer", "answer": "We couldn't find a survey like that for Lithuania. The US one is recent, from August 2026, and it asks who owns camera glasses. We used the German survey in seminar B, and it points the same way: about half of people there rule out wearing them."}, {"q": "How many of the 7 million were Wayfarers?", "who": "classmate", "answer": "We couldn't find that anywhere. Ray-Ban's owner only gives one number for Ray-Ban and Oakley together, so there's no number for the Wayfarer alone."}, {"q": "Why pick a product whose AI doesn't even work in Lithuania?", "who": "lecturer", "answer": "Because it's the most popular smart glasses in the world and a very controversial one, so there's a lot to analyse. Lithuanians can still order it online, and the seller here describes the camera, audio and calls, which don't need the AI. And audio is the most popular feature anyway, according to Meta."}, {"q": "What exactly does the 94% cover?", "who": "classmate", "answer": "It's AI glasses without a screen, worldwide, in the first half of 2026, counted by how many were shipped. It's from Counterpoint Research. If you count all smart glasses, Meta had 82% in the second half of 2025."}, {"q": "Why is Oakley a competitor if it's the same company?", "who": "classmate", "answer": "Because our product is the Wayfarer, not the whole company. Oakley Meta sits in the same market, and here the same seller sells it too, at similar prices. So a buyer who picks an Oakley pair may skip the Wayfarer."}, {"q": "Which brand sells privacy?", "who": "classmate", "answer": "Even Realities. Their Even G2 glasses have no camera at all, and they sell them with the slogan \"Camera-free. By design.\" Meta now sells a Ray-Ban version with no camera too."}, {"q": "What about Apple or Google?", "who": "classmate", "answer": "A groupmate covered them in seminar B as the big companies trying to build the next platform. When we checked, Apple's glasses were only a report, to be shown in mid 2027 and sold by the end of 2027. Samsung's glasses with Google's AI had no price yet. So for now they're a threat for the future."}, {"q": "Why do you think privacy is where competitors have a chance?", "who": "lecturer", "answer": "Because the Wayfarer still has a camera, and a lot of owners worry about how others see them. IDC also says Meta only added privacy steps after the backlash, which leaves room for a brand that builds privacy in from the start."}, {"q": "Do people actually use the glasses, or is it just hype?", "who": "classmate", "answer": "Sales say it's real. More than 7 million Ray-Ban and Oakley AI glasses were sold in 2025, against about 2 million in the two years before. Meta also says daily users tripled in a year, but that's their own claim, with no exact number."}, {"q": "Isn't the real competitor just normal sunglasses and earbuds?", "who": "lecturer", "answer": "That's a substitute, something different that meets the same need. A groupmate covered it in seminar B. At the same seller, a plain Ray-Ban Wayfarer was about 175 euros on sale, and the newest smart one about 430. So the smart one costs more than twice as much."}, {"q": "So what should Meta do about privacy?", "who": "lecturer", "answer": "Meta now sells a Ray-Ban with no camera, and IDC says that avoids the privacy worry. For new camera models, I think they should build privacy in from the start. So far they only added privacy steps after people got angry."}], "read": {"chapters": [{"title": "Micro and macro", "paragraphs": ["In seminar B your group looked at the macro-environment, the big forces in society around a product. Your own parts were the natural one (cold Kaunas winters, rain and the battery) and the socio-cultural one (privacy: how people in Germany and Britain feel about being filmed, Meta AI not working here, and the recording light).", "Seminar C moves in close. Kotler calls this the micro-environment, meaning the people and firms close to the company. They are the company itself, its partners, its suppliers, the middlemen who help it promote, sell and deliver its products, its competitors, its publics and its customers. Publics are any group that cares about the company or can affect whether it reaches its goals, such as the media.", "Your groupmates cover partners, suppliers and contact audiences. Your group’s element called “contact audiences” is probably the same idea as Kotler’s publics. A groupmate, citing a course textbook on Moodle, counts the middlemen as partners. You have customers and competitors. Seminar B named a few big rivals but gave no prices or market shares, so your part adds those for named rivals. If someone asks, say it is the groups outside the company that care about it, such as the media.", "Kotler sorts customers into five markets. They are consumers who buy for themselves, businesses, resellers who buy to sell again, governments, and buyers in other countries. For Ray-Ban Meta the consumer market is the main one, so your customers are mostly ordinary people.", "On competitors, Kotler says a company must give customers more value than its rivals do. It must also hold a stronger place in customers’ minds than they do. That place in the mind is called positioning, and you will see it again in the privacy part."]}, {"title": "The product", "paragraphs": ["The product is the Ray-Ban Meta Wayfarer, which looks like a normal pair of Ray-Ban Wayfarers. Its frame holds a camera, microphones and small open-ear speakers, and it comes with an AI assistant called Meta AI. You can take photos and videos hands-free, listen to music, take calls and ask the assistant questions.", "A recording light turns on when the glasses record. It is their main privacy safeguard, though some wearers found ways around it.", "Two companies make it together. Meta does the software, the AI and the app. EssilorLuxottica, the large eyewear group that owns Ray-Ban, designs and makes the frames and sells them through its own stores and through opticians. The same partnership makes the sporty Oakley Meta glasses.", "The first pair came out in 2021 as Ray-Ban Stories. In 2023 the next pair got the Meta name. Gen 2 came out in September 2025 and the newest, Gen 3, a year later. Meta says Gen 3’s battery lasts up to 9 hours, one hour more than Gen 2.", "When your script says “the newest Wayfarer”, it means Gen 3. On 18 October your group had not yet agreed whether it analyses Gen 2 or Gen 3."]}, {"title": "Your customers", "paragraphs": ["Your customers paragraph starts with the whole world and ends with one buyer in Lithuania. Its first number is sales in 2025, more than 7 million AI glasses.", "That number comes from EssilorLuxottica’s yearly results, published in February 2026. It counts Ray-Ban and Oakley together, so it is not the Wayfarer alone. The comparison, about 2 million in 2023 and 2024 together, comes from a CNBC news report on the same results.", "But the buyers are still a small group. A Security.org survey from August 2026 found that only about 5% of US adults own smart glasses with a camera, of any brand. Owning them was most common among men and among people aged 30 to 44. Marketers call people who buy a new product early, before most others do, early adopters.", "Next comes what buyers like most. In September 2026 Meta said that audio has been its most popular feature since day one. That is why it launched Ray-Ban Meta Audio, a version with no camera.", "Then comes what owners worry about. In October the tech site Engadget reviewed that same camera-free pair. Its reviewer had interviewed Meta glasses users earlier in the year. A lot of them said they loved their glasses but worried about how others might see them. Some said they would happily buy a pair without a camera if it made them less likely to be called a “creep”.", "If someone wants a number, one in five owners in the US survey got a negative reaction while wearing their glasses. That comes from only about 100 owners, with glasses of any brand."]}, {"title": "Lithuania", "paragraphs": ["Your customers paragraph ends here in Lithuania. Your group could only find the glasses online, not in a physical store. The official seller in your script is Estheroptica. It has no shop in Lithuania and sends every pair from its optician in Italy.", "Free delivery usually takes 9 to 15 days. If a model is not in the maker’s stock, it can take a month to a month and a half, or longer. Sellers belong to the partners element, which a groupmate covers, so say the seller’s name only if someone asks.", "Meta AI is not supported here. Lithuania is missing from Meta’s own list of supported countries, and Lithuanian is not one of the assistant’s languages. You covered this in seminar B, so your script says it only once.", "A Lithuanian buyer still gets the camera, the audio and calls. Audio is the feature Meta calls its most popular, so the product still makes sense here, even without the AI."]}, {"title": "Your competitors", "paragraphs": ["Meta is the biggest smart glasses brand in the world. Counterpoint, a research company, found that Meta shipped 94% of all AI glasses without a screen worldwide in the first half of 2026. Shipped means sent out by the makers to shops and buyers. It is not exactly the number sold to people, but it shows clearly who sells the most.", "That 94% is Meta’s market share for that one type of glasses. Counterpoint says that outside Meta the market is highly fragmented. IDC, another research company, lists RayNeo, Alibaba, XREAL and Xiaomi as the next brands, each under 4%, though it measures a wider group of glasses and headsets.", "Then your paragraph walks up the price ladder. At the bottom, Varle.lt, a Lithuanian marketplace website, lists no-name AI glasses with a camera for under 80 euros. In the middle, the newest Wayfarer cost about 430 to 500 euros on 16 October, on the official seller’s Lithuanian website. Higher up are AI glasses with a screen, which usually cost more. The Even G2, for example, starts at about 700 euros.", "The Wayfarer also competes with Meta’s other glasses. The two sporty Oakley Meta models made up over 30% of all the glasses Meta shipped in the last three months of 2025. That number is from Counterpoint too. Marketers call it cannibalisation when a company’s own products take sales from each other. The 30% shows how big Oakley has become, not how many buyers it took from the Wayfarer.", "The last step is privacy, which links back to the owners who worried about being called a creep. A small brand called Even Realities sells the Even G2 with the slogan “Camera-free. By design.” That is positioning. The brand tries to own a place in people’s minds as the smart glasses without a camera.", "Meta’s own camera-free pair, Ray-Ban Meta Audio, has been shipping since 13 October, from 349 US dollars. A week before Meta announced that pair, IDC, another research company, wrote that Meta added its privacy steps only after people got angry. In IDC’s words, that “leaves room for a competitor willing to build privacy safeguards in before launch”.", "The Wayfarer you are presenting still has a camera. That is why your paragraph ends with your own view, that privacy is where competitors have a chance against Meta."]}, {"title": "Questions you might get", "paragraphs": ["If someone asks why your survey is from the US, say that you found no Lithuanian survey. You already used the German one in your seminar B part.", "A classmate may ask why your group chose a product whose AI does not work here. Say that it is the most popular smart glasses in the world and a very controversial one, and Lithuanians can order it online. The camera and the audio still work too.", "Someone may ask why Oakley counts as a competitor when it comes from the same partnership. Oakley sells in the same market, so a buyer can pick an Oakley pair instead of a Wayfarer.", "If someone asks what the 94% covers, it is AI glasses without a screen, worldwide, in the first half of 2026. For all smart glasses, Counterpoint gives Meta 82% in the second half of 2025.", "If someone asks how many of the 7 million were Wayfarers, say that you found no public number for the Wayfarer alone. The figure covers Ray-Ban and Oakley together.", "If someone asks which privacy steps IDC meant, the report doesn’t name them. The closest fact you know is from your seminar B part. In July 2026 Meta added an update meant to shut the camera off when someone tampers with the recording light.", "Someone may say that Meta’s camera-free pair already solves the privacy problem. Say that it is a separate product, and the Wayfarer you present still has a camera. If they ask whether that pair is sold in Lithuania, say that you could not confirm it.", "If someone asks which brand sells privacy, it is Even Realities. Its slogan is “Camera-free. By design.”", "If someone mentions Meta’s own glasses with a screen, they are the Meta Ray-Ban Display. They cost 899 euros in France, Italy and Germany, and are not sold in Lithuania.", "If Apple or Google comes up, say that a groupmate covered them in seminar B. Apple has not announced its glasses, and reports say they will not go on sale before late 2027. Samsung’s glasses, made with Google, were announced for autumn 2026 in some markets, with no price in the news as of 16 October. Neither one is on sale in Lithuania.", "If the lecturer asks about Kotler’s terms, they come from the 21 September lecture on the marketing environment. Customers come in five markets, and consumers are the main one here. A company must give more value than its competitors and hold a stronger place in customers’ minds.", "If a question goes past what you know, say that you didn’t find it. Then give the closest fact you do know."]}, {"title": "Your three minutes", "paragraphs": ["Your part is two paragraphs, and read calmly they fill about two and a half to three minutes. The customers paragraph has four steps. It goes from growth to the few early adopters, then to what buyers love and what worries them, and ends with the buyer in Lithuania.", "The competitors paragraph also has four. It goes from Meta’s size up the price ladder, then to Meta against itself, and ends with privacy and your opinion.", "On your slides, keep the small words that say what a big number covers right next to it. Put “Ray-Ban + Oakley” next to the 7 million and “without a screen” next to the 94%.", "Your group presents on Tuesday at 12:00 in room V. Before then, read your two paragraphs aloud once and look over the questions again.", "If you remember only two things, make them these. Your customers are still a small group who love the audio and worry about the camera. Meta is far ahead of its rivals, and privacy is where they have a chance."]}], "minutes": 9}, "inspire": [{"title": "Seven million in one year", "fact": "EssilorLuxottica, Ray-Ban's owner, sold more than 7 million AI glasses in 2025. In 2023 and 2024 together it was about 2 million. The count covers Ray-Ban Meta and Oakley Meta, not the Wayfarer alone.", "why": "This is the proof that your customer market is growing very fast. Keep the scope next to the number, because a classmate may ask if all 7 million were Wayfarers.", "share": "In 2025 alone, more than 7 million Ray-Ban and Oakley AI glasses were sold. In the two years before, it was about 2 million.", "source": "CNBC on EssilorLuxottica's full-year results, 11 Feb 2026", "url": "https://www.cnbc.com/2026/02/11/ray-ban-maker-essilorluxottica-triples-sales-of-meta-ai-glasses.html"}, {"title": "Daily users tripled in a year", "fact": "In April 2026, Meta told investors that the number of people using its AI glasses every day had tripled in a year. Meta also called them one of the fastest growing kinds of consumer electronics ever.", "why": "Sales show people buying. Daily use shows people keeping the glasses on. It is Meta's own claim and it gives no exact number, so say “Meta says”.", "share": "Meta says the number of people wearing its AI glasses every day tripled in one year.", "source": "Meta Q1 2026 earnings call (Motley Fool transcript), 29 Apr 2026", "url": "https://www.fool.com/earnings/call-transcripts/2026/04/29/meta-meta-q1-2026-earnings-call-transcript/"}, {"title": "The best-seller in 60% of Ray-Ban stores", "fact": "In late 2024, the finance chief of EssilorLuxottica, Ray-Ban's owner, said Ray-Ban Meta was the best-selling product in 60% of Ray-Ban stores in Europe, the Middle East and Africa.", "why": "It shows the glasses reached ordinary shoppers in Europe, not only tech fans. It is an older figure about the 2023 model, with no split by country, so do not say it is true for Lithuania.", "share": "Back in 2024, Ray-Ban Meta was already the top seller in 60% of Ray-Ban stores across Europe, the Middle East and Africa.", "source": "UploadVR, quoting EssilorLuxottica's Q3 2024 earnings call, 20 Oct 2024", "url": "https://www.uploadvr.com/ray-ban-meta-glasses-top-selling-emea/"}, {"title": "Only 1 in 20 American adults owns a pair", "fact": "A US survey found that about 5% of adults own smart glasses with a camera. Ownership is highest among men and adults aged 30 to 44, and lowest among people 60 and older.", "why": "This backs your line that buyers are still a small group of early adopters, even with millions sold. It is a US survey about all camera smart glasses, not only Ray-Ban Meta.", "share": "A US survey says about 5% of adults own camera smart glasses, so most people have still not bought a pair.", "source": "Security.org smart glasses report, updated 13 Aug 2026", "url": "https://www.security.org/resources/smart-glasses-statistics-report/"}, {"title": "The early adopter curve", "fact": "Everett Rogers' model (1962) describes how new products spread. The first 2.5% of people to adopt are innovators and the next 13.5% are early adopters. Most people come later: the early majority, the late majority and the laggards.", "why": "It gives your “early adopters” sentence a name and a place on a curve. If smart glasses one day become normal, today's 5% in the US would sit inside that first 16%. That is your own reading, so say “I'd say”, not “studies show”.", "share": "In Rogers' model the first 2.5% of buyers are innovators and the next 13.5% early adopters. With about 5% of US adults owning camera glasses, I'd say smart glasses are still that early.", "source": "Corporate Finance Institute, Diffusion of Innovation (explains Rogers, 1962), 2 Jun 2020", "url": "https://corporatefinanceinstitute.com/resources/knowledge/other/diffusion-of-innovation/"}, {"title": "Google's own guide said “Glasshole”", "fact": "In February 2014, Google added a list of dos and don'ts for Google Glass wearers to its Glass website. The last one told them not to be creepy or rude and used the nickname “Glasshole”. Glass cost 1,500 dollars, and Google closed the Explorer program that sold Glass to early users in January 2015.", "why": "This is the history behind the privacy fear that today's buyers still feel. Glass looked like a gadget, while the Wayfarer looks like normal sunglasses.", "share": "Even Google's own guide for Glass used the word “Glasshole”. I'd say that social backlash is still the problem Meta has to solve.", "source": "The Register, 18 Feb 2014 (price and program closing: TechCrunch, 15 Jan 2015)", "url": "https://theregister.com/2014/02/18/google_glass_dos_and_donts"}, {"title": "Snap sold camera glasses from a vending machine", "fact": "In 2016 Snap sold its camera glasses, Spectacles, for 130 dollars from a yellow vending machine in California, and people queued to buy them. A light on the frames showed others when they were recording.", "why": "It is another early try at camera glasses, and it already had a recording light. Queuing to be among the first is early adopter behaviour.", "share": "Snap sold its camera glasses, Spectacles, in 2016 from a yellow vending machine for 130 dollars, and people queued for them.", "source": "NBC News, 11 Nov 2016", "url": "https://www.nbcnews.com/tech/tech-news/snap-using-vending-machines-its-new-camera-glasses-n682696"}, {"title": "Ray-Ban Stories came first, in 2021", "fact": "Ray-Ban Stories came out on 9 September 2021, made by Facebook (today's Meta) and EssilorLuxottica. They cost 299 dollars and had two small cameras and a built-in light that turns on when recording. Meta later called them its first-ever smart glasses.", "why": "Ray-Ban Meta, from 2023, was the second try at the same idea, and the recording light has been there from the start. Some sources call the 2021 pair “Gen 1” and others call the 2023 pair that, so say the year when you name a generation.", "share": "Before Ray-Ban Meta there were Ray-Ban Stories in 2021, for 299 dollars, with a light that shows when they record.", "source": "Meta Newsroom, 9 Sep 2021", "url": "https://about.fb.com/news/2021/09/introducing-ray-ban-stories-smart-glasses/"}, {"title": "EssilorLuxottica is a 2018 merger", "fact": "EssilorLuxottica was formed in October 2018, when the lens maker Essilor joined with Luxottica, which makes frames and owns brands like Ray-Ban and Oakley. Today it runs about 18,000 stores.", "why": "It explains why Meta needed a partner. Meta knows software and AI, and EssilorLuxottica brings the frames, the brands, the lenses and the shops. The partnership is your groupmates' part, so keep it to one sentence.", "share": "EssilorLuxottica is the company behind Ray-Ban and Oakley. It was formed in 2018 by joining a lens maker and a frame maker.", "source": "EssilorLuxottica press release, 1 Oct 2018 (store count: FY2025 results, 11 Feb 2026)", "url": "https://www.essilorluxottica.com/cap/content/112942/?_iframe=true"}, {"title": "Audio is Meta's most popular feature", "fact": "Meta says audio has been its most popular glasses feature since day one. It now sells Ray-Ban Meta Audio, audio-only glasses with no camera, from 349 dollars. They started shipping on 13 Oct 2026.", "why": "This backs your script line that a Lithuanian buyer still gets the most popular feature without Meta AI. It also shows that Meta now sells to people who do not want a camera.", "share": "Meta says audio is its most popular feature, and it now even sells Ray-Ban glasses with no camera at all.", "source": "Meta Newsroom, 23 Sep 2026 (no camera: Engadget, 13 Oct 2026)", "url": "https://about.fb.com/news/2026/09/introducing-ray-ban-meta-audio-glasses-new-styles-plus-muse/"}, {"title": "Owners fear being called a “creep”", "fact": "A tech reviewer at Engadget had interviewed Meta glasses owners earlier in the year. A lot of them loved their glasses but worried how others saw them. Some said they would happily buy a pair without cameras if it made them less likely to be labelled a “creep”.", "why": "It shows what customers value and what they fear, in their own words. It is one reviewer's report of what owners said, not a survey, so say “a reviewer wrote”.", "share": "A tech reviewer found that owners love the glasses, but some said they would happily buy a pair without a camera so people would be less likely to call them a creep.", "source": "Engadget, 13 Oct 2026", "url": "https://www.engadget.com/2285337/ray-ban-meta-audio-glasses-review/"}, {"title": "Meta ships 94 of every 100 AI glasses without a screen", "fact": "In the first half of 2026, Meta had 94% of global shipments of AI glasses without a display. Counterpoint says the rest is split among many small brands.", "why": "It is the core of your competitors paragraph. Always say “without a screen” next to 94%. Counting all smart glasses, Meta went from over 60% in 2024 to 82% in the second half of 2025, so its lead is growing. That is a different count, so never say Meta went from 82% to 94%.", "share": "Out of every 100 AI glasses without a screen shipped in early 2026, 94 were Meta's.", "source": "Counterpoint Research, 21 Sep 2026", "url": "https://counterpointresearch.com/en/insights/global-ai-glasses-shipments-surge-263-percent-yoy-with-display-less-ai-glasses"}, {"title": "A research company sees room for a privacy rival", "fact": "IDC says Meta added its privacy steps only after a public backlash, and that this leaves room for a rival that builds privacy in from the start. In IDC's count, which also includes headsets, the next four brands after Meta each held under 4% in April to June 2026.", "why": "This is where your closing opinion comes from, that privacy is where competitors have a chance. The source is a research company's view, and it does not say which steps Meta took. Do not add details it does not give.", "share": "IDC, a research company, says Meta added privacy steps only after people got angry, and that leaves room for a rival that builds privacy in from the start.", "source": "IDC blog, 16 Sep 2026", "url": "https://www.idc.com/resource-center/blog/smart-glasses-growth-cools-to-35-as-meta-doubles-down-on-distribution/"}, {"title": "A rival whose selling point is no camera", "fact": "Even Realities sells its newest glasses with the slogan “Camera-free. By design.” Its website also promises “No recording and social friction.” The glasses have a small screen but no camera.", "why": "This is a real rival turning privacy into its selling point. In Kotler's words, it positions itself against Meta in buyers' minds. It is a small brand and its Even G2 starts at 699 euros, so do not call it a big threat.", "share": "Even Realities answers the creep problem with a slogan: “Camera-free. By design.”", "source": "Even Realities website, checked 19 Oct 2026", "url": "https://www.evenrealities.com/smart-glasses"}, {"title": "Meta competes with its own Oakley glasses", "fact": "Sporty AI glasses, including the Oakley Meta HSTN and Vanguard, made up over 30% of everything Meta shipped in the last three months of 2025. So more than 3 in every 10 pairs Meta shipped were sporty models like these.", "why": "It answers the likely question about why Oakley counts as a competitor when it is the same company. Oakley sells in the same market, so a buyer who picks an Oakley pair may skip the Wayfarer.", "share": "Over 30% of the glasses Meta shipped in the last three months of 2025 were sporty models like the Oakleys, so the Wayfarer competes with Meta's own models.", "source": "Counterpoint Research, 27 Feb 2026", "url": "https://counterpointresearch.com/en/insights/Global-Smart-Glasses-Shipments-Grew-139-Percent-YoY-in-H2-2025"}, {"title": "No shop in Lithuania, every pair comes from Italy", "fact": "An official Ray-Ban Meta seller with a Lithuanian website says it has no physical shop in Lithuania. It ships its pairs from its optician in Italy. Free delivery to a parcel locker takes 9 to 15 days on orders over 70 euros, and longer if the pair must be ordered from the maker. At the same seller, a plain Ray-Ban Wayfarer was on sale for about 175 euros, and the newest smart one started at about 430.", "why": "It makes the Lithuanian buyer concrete. A buyer here orders online and waits, and the smart pair costs more than twice the plain one's sale price.", "share": "A Lithuanian buyer orders online, because the official seller we found has no shop in Lithuania and ships from Italy. Free delivery takes 9 to 15 days, and longer if the pair has to be ordered from the maker.", "source": "Estheroptica.lt, checked 19 Oct 2026. Label \"Oficialus Ray-Ban Meta pardavėjas\"", "url": "https://www.estheroptica.lt/ray-ban-meta/"}, {"title": "A 1952 shape with a computer inside", "fact": "The Wayfarer shape was designed in 1952 at Bausch & Lomb, Ray-Ban's owner at the time. Today the same shape carries a camera, microphones, speakers and an AI assistant.", "why": "For a design student this is a good angle. Google Glass looked like a gadget and got mocked. The Wayfarer looks like normal sunglasses, so the technology hides in a famous old shape.", "share": "The Wayfarer shape is from 1952, and now it hides a camera, speakers and an AI assistant.", "source": "US design patent D169,995, filed 22 Jul 1952", "url": "https://patents.google.com/patent/USD169995S/en"}]}]}</script>
<script>
(function(){
'use strict';
/* ---------- core: helpers, storage, content ---------- */
var $=function(id){return document.getElementById(id)};
var qs=function(s,r){return (r||document).querySelector(s)};
var qsa=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function T(s){return esc(s).replace(/\b(Ray-Ban|\d+-[A-Za-z]+)\b/g,'<span class="nw">$1</span>')}
function cap(s){s=String(s||'');return s.charAt(0).toUpperCase()+s.slice(1)}
function ic(n,c){return '<svg class="ic'+(c?' '+c:'')+'" aria-hidden="true"><use href="#i-'+n+'"/></svg>'}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function pad(n){return (n<10?'0':'')+n}
function plural(n,w,ws){return n+' '+(n===1?w:(ws||w+'s'))}
function mmss(sec){sec=Math.max(0,Math.round(sec));return Math.floor(sec/60)+':'+pad(sec%60)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function rm(){return !!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)}
function later(fn,ms){return setTimeout(fn,ms)}
function reflow(el){void el.offsetHeight}

/* ---------- storage (always in memory, localStorage optional) ---------- */
var store=null,storeOK=true;
try{store=window.localStorage;store.setItem('prep.v1.t','1');store.removeItem('prep.v1.t')}catch(e){store=null;storeOK=false}
function rd(k){if(!store)return null;try{var v=store.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function wr(k,v){if(!store)return;try{store.setItem(k,JSON.stringify(v))}catch(e){storeOK=false}}

function obj(v){return v&&typeof v==='object'&&!Array.isArray(v)?v:{}}
var G=obj(rd('prep.v1.global'));
G.days=obj(G.days);G.best=+G.best||0;G.goal=[5,10,15,20].indexOf(G.goal)>=0?G.goal:10;
if(G.sound===undefined)G.sound=true;
G.hints=obj(G.hints);
function saveG(){wr('prep.v1.global',G)}
var PSm={};
function PS(p){
  if(!PSm[p.id]){
    var d=obj(rd('prep.v1.pack.'+p.id));
    d.lessons=obj(d.lessons);d.chapters=obj(d.chapters);d.runs=Array.isArray(d.runs)?d.runs:[];d.why=obj(d.why);
    d.quiz=obj(d.quiz);d.quiz.best=+d.quiz.best||0;d.quiz.history=Array.isArray(d.quiz.history)?d.quiz.history:[];
    d.qa=obj(d.qa);d.qa.status=obj(d.qa.status);d.shown=+d.shown||0;
    PSm[p.id]=d;
  }
  return PSm[p.id];
}
function saveP(p){wr('prep.v1.pack.'+p.id,PSm[p.id])}

/* ---------- content ---------- */
var packs=[],bad=false;
try{
  var cj=JSON.parse($('content').textContent);
  packs=((cj&&cj.packs)||[]).filter(function(p){return p&&p.id}).map(normPack);
  if(!packs.length)bad=true;
}catch(e){bad=true}
/* Render only from normalised content: bad or missing parts are dropped, never thrown on. */
function normPack(p){
  p.lessons=(p.lessons||[]).filter(function(l){return l&&Array.isArray(l.cards)&&l.cards.length}).map(function(l,i){l.id=l.id||'lesson-'+i;return l});
  var s=p.script&&typeof p.script==='object'?p.script:{};
  Object.keys(s).forEach(function(k){
    var v=s[k];
    if(typeof v==='string')v=v.match(/[^.!?]+[.!?]+\S*\s*/g)||[v];
    s[k]=(Array.isArray(v)?v:[]).map(function(x){return typeof x==='string'?{sentence:x.trim()}:x}).filter(function(x){return x&&x.sentence});
  });
  p.script=s;
  p.quiz=(p.quiz||[]).filter(function(q){return q&&Array.isArray(q.options)&&q.options.length>1&&q.options[q.answer]!=null});
  p.questions=(p.questions||[]).filter(function(q){return q&&q.q&&q.answer});
  p.inspire=Array.isArray(p.inspire)?p.inspire.filter(function(f){return f&&f.fact}):[];
  p.glossary=(p.glossary||[]).filter(function(w){return w&&w.term});
  p.numbers=(p.numbers||[]).filter(function(n){return n&&n.value});
  return p;
}
function L_(p){return p.lessons||[]}
function chaptersOf(p){var r=p.read;if(!r)return[];if(Array.isArray(r))return r;return r.chapters||[]}
function quizOf(p){return p.quiz||[]}
function qaOf(p){return p.questions||[]}
function numsOf(p){return p.numbers||[]}
function wordsOf(p){return p.glossary||[]}
function scriptParts(p){var s=p.script||{},o=[];Object.keys(s).forEach(function(k){if(s[k]&&s[k].length)o.push({key:k,list:s[k]})});return o}
function sentsOf(p){var o=[];scriptParts(p).forEach(function(pt){pt.list.forEach(function(s,i){o.push({part:pt.key,i:i,n:pt.list.length,s:s})})});return o}
function factsOf(p){var l=p.inspire;return Array.isArray(l)?l:[]}

/* ---------- time ---------- */
var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dayKey(ts){return fmtKey(new Date(ts-4*3600000))}
function shiftKey(k,n){var a=k.split('-');return fmtKey(new Date(+a[0],+a[1]-1,+a[2]+n))}
function keyDow(k){var a=k.split('-');return (new Date(+a[0],+a[1]-1,+a[2]).getDay()+6)%7}
function offMin(p){var m=/([+-])(\d\d):(\d\d)$/.exec(p.date||'');return m?(m[1]==='-'?-1:1)*(+m[2]*60+ +m[3]):0}
function startOf(p){return new Date(p.date).getTime()}
function wall(p,ts){return new Date(ts+offMin(p)*60000)}
function fmtWhen(p){var d=wall(p,startOf(p));return DAYS[d.getUTCDay()]+' '+d.getUTCDate()+' '+MONTHS[d.getUTCMonth()]+', '+pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())}
function fmtDate(p){var d=wall(p,startOf(p));return DAYS[d.getUTCDay()]+' '+d.getUTCDate()+' '+MONTHS[d.getUTCMonth()]}
function isUpcoming(p){return Date.now()<startOf(p)+2*3600000}
function shortTitle(p){var t=String(p.title||'');var i=t.indexOf(':');return i>0?t.slice(0,i):t}
function sinceStart(ts){var d=new Date(ts);return d}
function fmtRound(ts){
  var d=new Date(ts),n=new Date(),hm=pad(d.getHours())+':'+pad(d.getMinutes());
  if(fmtKey(d)===fmtKey(n))return 'Today, '+hm;
  return DAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()]+', '+hm;
}

/* ---------- selected pack ---------- */
var cur=null;
function pickInitialPack(){
  var sel=rd('prep.v1.selected'),saved=null;
  packs.forEach(function(p){if(p.id===sel)saved=p});
  var up=packs.filter(isUpcoming).sort(function(a,b){return startOf(a)-startOf(b)});
  var past=packs.filter(function(p){return !isUpcoming(p)}).sort(function(a,b){return startOf(b)-startOf(a)});
  if(saved&&isUpcoming(saved))return saved;
  if(up.length)return up[0];
  return saved||past[0]||packs[0];
}
function setSelected(p){cur=p;wr('prep.v1.selected',p.id)}

/* ---------- readiness ---------- */
function lessonsDone(p){var ps=PS(p);return L_(p).filter(function(l){return ps.lessons[l.id]&&ps.lessons[l.id].done}).length}
function chaptersRead(p){var ps=PS(p);return chaptersOf(p).filter(function(c,i){return ps.chapters[i]}).length}
function qaGot(p){var ps=PS(p);return qaOf(p).filter(function(q,i){return ps.qa.status[i]==='got'}).length}
function readyParts(p){
  var ps=PS(p),a=[];
  if(L_(p).length)a.push({k:'lessons',label:'Lessons',w:3,n:lessonsDone(p),d:L_(p).length});
  if(chaptersOf(p).length)a.push({k:'chapters',label:'Chapters',w:1,n:chaptersRead(p),d:chaptersOf(p).length});
  if(sentsOf(p).length)a.push({k:'runs',label:'Practice runs',w:2,n:Math.min(2,ps.runs.length),d:2});
  if(sentsOf(p).length)a.push({k:'why',label:'Sentences you checked',w:2,n:Math.min(Object.keys(ps.why||{}).length,sentsOf(p).length),d:sentsOf(p).length});
  if(numsOf(p).length)a.push({k:'numbers',label:'Numbers gone over',w:1,n:ps.numbersDone?1:0,d:1});
  if(quizOf(p).length)a.push({k:'quiz',label:'Quiz, best round',w:2,n:Math.min(ps.quiz.best,quizOf(p).length),d:quizOf(p).length});

function inferDo(t){

  for(var i=0;i<m.length;i++)if(t.indexOf(m[i][0])>=0)return m[i][1];

function buildPath(p){
  var ps=PS(p),plan=(p.plan||[]).map(function(x){return typeof x==='string'?{text:x,do:inferDo(x)}:{text:x.text,do:typeof x.do==='string'?x.do:inferDo(x.text)}});
  var seenDo={};
  plan.forEach(function(s){if(s.do&&seenDo[s.do])s.do='';else if(s.do)seenDo[s.do]=true});
  /* every kind of content the pack has gets a place on the path, in a fixed order, even if the plan text misses it */
  var ORDER=['lessons','read','script','quiz','questions','numbers'],
    HAVE={lessons:L_(p).length,read:chaptersOf(p).length,script:sentsOf(p).length,quiz:quizOf(p).length,questions:qaOf(p).length,numbers:numsOf(p).length},
    DEF={lessons:'Learn the lessons, one card at a time.',read:'Read the chapters at your own pace.',script:'Read your script aloud with the timer.',quiz:'Do the quiz.',questions:'Practise the questions out loud.',numbers:'Go over the numbers.'};
  ORDER.forEach(function(k,oi){
    if(!HAVE[k]||plan.some(function(s){return s.do===k}))return;
    var at=plan.length;
