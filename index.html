y the seller’s name only if someone asks.", "Meta AI is not supported here. Lithuania is missing from Meta’s own list of supported countries, and Lithuanian is not one of the assistant’s languages. You covered this in seminar B, so your script says it only once.", "A Lithuanian buyer still gets the camera, the audio and calls. Audio is the feature Meta calls its most popular, so the product still makes sense here, even without the AI."]}, {"title": "Your competitors", "paragraphs": ["Meta is the biggest smart glasses brand in the world. Counterpoint, a research company, found that Meta shipped 94% of all AI glasses without a screen worldwide in the first half of 2026. Shipped means sent out by the makers to shops and buyers. It is not exactly the number sold to people, but it shows clearly who sells the most.", "That 94% is Meta’s market share for that one type of glasses. Counterpoint says that outside Meta the market is highly fragmented. IDC, another research company, lists RayNeo, Alibaba, XREAL and Xiaomi as the next brands, each under 4%, though it measures a wider group of glasses and headsets.", "Then your paragraph walks up the price ladder. At the bottom, Varle.lt, a Lithuanian marketplace website, lists no-name AI glasses with a camera for under 80 euros. In the middle, the newest Wayfarer cost about 430 to 500 euros on 16 October, on the official seller’s Lithuanian website. Higher up are AI glasses with a screen, which usually cost more. The Even G2, for example, starts at about 700 euros.", "The Wayfarer also competes with Meta’s other glasses. The two sporty Oakley Meta models made up over 30% of all the glasses Meta shipped in the last three months of 2025. That number is from Counterpoint too. Marketers call it cannibalisation when a company’s own products take sales from each other. The 30% shows how big Oakley has become, not how many buyers it took from the Wayfarer.", "The last step is privacy, which links back to the owners who worried about being called a creep. A small brand called Even Realities sells the Even G2 with the slogan “Camera-free. By design.” That is positioning. The brand tries to own a place in people’s minds as the smart glasses without a camera.", "Meta’s own camera-free pair, Ray-Ban Meta Audio, has been shipping since 13 October, from 349 US dollars. A week before Meta announced that pair, IDC, another research company, wrote that Meta added its privacy steps only after people got angry. In IDC’s words, that “leaves room for a competitor willing to build privacy safeguards in before launch”.", "The Wayfarer you are presenting still has a camera. That is why your paragraph ends with your own view, that privacy is where competitors have a chance against Meta."]}, {"title": "Questions you might get", "paragraphs": ["If someone asks why your survey is from the US, say that you found no Lithuanian survey. You already used the German one in your seminar B part.", "A classmate may ask why your group chose a product whose AI does not work here. Say that it is the most popular smart glasses in the world and a very controversial one, and Lithuanians can order it online. The camera and the audio still work too.", "Someone may ask why Oakley counts as a competitor when it comes from the same partnership. Oakley sells in the same market, so a buyer can pick an Oakley pair instead of a Wayfarer.", "If someone asks what the 94% covers, it is AI glasses without a screen, worldwide, in the first half of 2026. For all smart glasses, Counterpoint gives Meta 82% in the second half of 2025.", "If someone asks how many of the 7 million were Wayfarers, say that you found no public number for the Wayfarer alone. The figure covers Ray-Ban and Oakley together.", "If someone asks which privacy steps IDC meant, the report doesn’t name them. The closest fact you know is from your seminar B part. In July 2026 Meta added an update meant to shut the camera off when someone tampers with the recording light.", "Someone may say that Meta’s camera-free pair already solves the privacy problem. Say that it is a separate product, and the Wayfarer you present still has a camera. If they ask whether that pair is sold in Lithuania, say that you could not confirm it.", "If someone asks which brand sells privacy, it is Even Realities. Its slogan is “Camera-free. By design.”", "If someone mentions Meta’s own glasses with a screen, they are the Meta Ray-Ban Display. They cost 899 euros in France, Italy and Germany, and are not sold in Lithuania.", "If Apple or Google comes up, say that a groupmate covered them in seminar B. Apple has not announced its glasses, and reports say they will not go on sale before late 2027. Samsung’s glasses, made with Google, were announced for autumn 2026 in some markets, with no price in the news as of 16 October. Neither one is on sale in Lithuania.", "If the lecturer asks about Kotler’s terms, they come from the 21 September lecture on the marketing environment. Customers come in five markets, and consumers are the main one here. A company must give more value than its competitors and hold a stronger place in customers’ minds.", "If a question goes past what you know, say that you didn’t find it. Then give the closest fact you do know."]}, {"title": "Your three minutes", "paragraphs": ["Your part is two paragraphs, and read calmly they fill about two and a half to three minutes. The customers paragraph has four steps. It goes from growth to the few early adopters, then to what buyers love and what worries them, and ends with the buyer in Lithuania.", "The competitors paragraph also has four. It goes from Meta’s size up the price ladder, then to Meta against itself, and ends with privacy and your opinion.", "On your slides, keep the small words that say what a big number covers right next to it. Put “Ray-Ban + Oakley” next to the 7 million and “without a screen” next to the 94%.", "Your group presents on Tuesday at 12:00 in room V. Before then, read your two paragraphs aloud once and look over the questions again.", "If you remember only two things, make them these. Your customers are still a small group who love the audio and worry about the camera. Meta is far ahead of its rivals, and privacy is where they have a chance."]}], "minutes": 9}, "inspire": [{"title": "Seven million in one year", "fact": "EssilorLuxottica, Ray-Ban's owner, sold more than 7 million AI glasses in 2025. In 2023 and 2024 together it was about 2 million. The count covers Ray-Ban Meta and Oakley Meta, not the Wayfarer alone.", "why": "This is the proof that your customer market is growing very fast. Keep the scope next to the number, because a classmate may ask if all 7 million were Wayfarers.", "share": "In 2025 alone, more than 7 million Ray-Ban and Oakley AI glasses were sold. In the two years before, it was about 2 million.", "source": "CNBC on EssilorLuxottica's full-year results, 11 Feb 2026", "url": "https://www.cnbc.com/2026/02/11/ray-ban-maker-essilorluxottica-triples-sales-of-meta-ai-glasses.html"}, {"title": "Daily users tripled in a year", "fact": "In April 2026, Meta told investors that the number of people using its AI glasses every day had tripled in a year. Meta also called them one of the fastest growing kinds of consumer electronics ever.", "why": "Sales show people buying. Daily use shows people keeping the glasses on. It is Meta's own claim and it gives no exact number, so say “Meta says”.", "share": "Meta says the number of people wearing its AI glasses every day tripled in one year.", "source": "Meta Q1 2026 earnings call (Motley Fool transcript), 29 Apr 2026", "url": "https://www.fool.com/earnings/call-transcripts/2026/04/29/meta-meta-q1-2026-earnings-call-transcript/"}, {"title": "The best-seller in 60% of Ray-Ban stores", "fact": "In late 2024, the finance chief of EssilorLuxottica, Ray-Ban's owner, said Ray-Ban Meta was the best-selling product in 60% of Ray-Ban stores in Europe, the Middle East and Africa.", "why": "It shows the glasses reached ordinary shoppers in Europe, not only tech fans. It is an older figure about the 2023 model, with no split by country, so do not say it is true for Lithuania.", "share": "Back in 2024, Ray-Ban Meta was already the top seller in 60% of Ray-Ban stores across Europe, the Middle East and Africa.", "source": "UploadVR, quoting EssilorLuxottica's Q3 2024 earnings call, 20 Oct 2024", "url": "https://www.uploadvr.com/ray-ban-meta-glasses-top-selling-emea/"}, {"title": "Only 1 in 20 American adults owns a pair", "fact": "A US survey found that about 5% of adults own smart glasses with a camera. Ownership is highest among men and adults aged 30 to 44, and lowest among people 60 and older.", "why": "This backs your line that buyers are still a small group of early adopters, even with millions sold. It is a US survey about all camera smart glasses, not only Ray-Ban Meta.", "share": "A US survey says about 5% of adults own camera smart glasses, so most people have still not bought a pair.", "source": "Security.org smart glasses report, updated 13 Aug 2026", "url": "https://www.security.org/resources/smart-glasses-statistics-report/"}, {"title": "The early adopter curve", "fact": "Everett Rogers' model (1962) describes how new products spread. The first 2.5% of people to adopt are innovators and the next 13.5% are early adopters. Most people come later: the early majority, the late majority and the laggards.", "why": "It gives your “early adopters” sentence a name and a place on a curve. If smart glasses one day become normal, today's 5% in the US would sit inside that first 16%. That is your own reading, so say “I'd say”, not “studies show”.", "share": "In Rogers' model the first 2.5% of buyers are innovators and the next 13.5% early adopters. With about 5% of US adults owning camera glasses, I'd say smart glasses are still that early.", "source": "Corporate Finance Institute, Diffusion of Innovation (explains Rogers, 1962), 2 Jun 2020", "url": "https://corporatefinanceinstitute.com/resources/knowledge/other/diffusion-of-innovation/"}, {"title": "Google's own guide said “Glasshole”", "fact": "In February 2014, Google added a list of dos and don'ts for Google Glass wearers to its Glass website. The last one told them not to be creepy or rude and used the nickname “Glasshole”. Glass cost 1,500 dollars, and Google closed the Explorer program that sold Glass to early users in January 2015.", "why": "This is the history behind the privacy fear that today's buyers still feel. Glass looked like a gadget, while the Wayfarer looks like normal sunglasses.", "share": "Even Google's own guide for Glass used the word “Glasshole”. I'd say that social backlash is still the problem Meta has to solve.", "source": "The Register, 18 Feb 2014 (price and program closing: TechCrunch, 15 Jan 2015)", "url": "https://theregister.com/2014/02/18/google_glass_dos_and_donts"}, {"title": "Snap sold camera glasses from a vending machine", "fact": "In 2016 Snap sold its camera glasses, Spectacles, for 130 dollars from a yellow vending machine in California, and people queued to buy them. A light on the frames showed others when they were recording.", "why": "It is another early try at camera glasses, and it already had a recording light. Queuing to be among the first is early adopter behaviour.", "share": "Snap sold its camera glasses, Spectacles, in 2016 from a yellow vending machine for 130 dollars, and people queued for them.", "source": "NBC News, 11 Nov 2016", "url": "https://www.nbcnews.com/tech/tech-news/snap-using-vending-machines-its-new-camera-glasses-n682696"}, {"title": "Ray-Ban Stories came first, in 2021", "fact": "Ray-Ban Stories came out on 9 September 2021, made by Facebook (today's Meta) and EssilorLuxottica. They cost 299 dollars and had two small cameras and a built-in light that turns on when recording. Meta later called them its first-ever smart glasses.", "why": "Ray-Ban Meta, from 2023, was the second try at the same idea, and the recording light has been there from the start. Some sources call the 2021 pair “Gen 1” and others call the 2023 pair that, so say the year when you name a generation.", "share": "Before Ray-Ban Meta there were Ray-Ban Stories in 2021, for 299 dollars, with a light that shows when they record.", "source": "Meta Newsroom, 9 Sep 2021", "url": "https://about.fb.com/news/2021/09/introducing-ray-ban-stories-smart-glasses/"}, {"title": "EssilorLuxottica is a 2018 merger", "fact": "EssilorLuxottica was formed in October 2018, when the lens maker Essilor joined with Luxottica, which makes frames and owns brands like Ray-Ban and Oakley. Today it runs about 18,000 stores.", "why": "It explains why Meta needed a partner. Meta knows software and AI, and EssilorLuxottica brings the frames, the brands, the lenses and the shops. The partnership is your groupmates' part, so keep it to one sentence.", "share": "EssilorLuxottica is the company behind Ray-Ban and Oakley. It was formed in 2018 by joining a lens maker and a frame maker.", "source": "EssilorLuxottica press release, 1 Oct 2018 (store count: FY2025 results, 11 Feb 2026)", "url": "https://www.essilorluxottica.com/cap/content/112942/?_iframe=true"}, {"title": "Audio is Meta's most popular feature", "fact": "Meta says audio has been its most popular glasses feature since day one. It now sells Ray-Ban Meta Audio, audio-only glasses with no camera, from 349 dollars. They started shipping on 13 Oct 2026.", "why": "This backs your script line that a Lithuanian buyer still gets the most popular feature without Meta AI. It also shows that Meta now sells to people who do not want a camera.", "share": "Meta says audio is its most popular feature, and it now even sells Ray-Ban glasses with no camera at all.", "source": "Meta Newsroom, 23 Sep 2026 (no camera: Engadget, 13 Oct 2026)", "url": "https://about.fb.com/news/2026/09/introducing-ray-ban-meta-audio-glasses-new-styles-plus-muse/"}, {"title": "Owners fear being called a “creep”", "fact": "A tech reviewer at Engadget had interviewed Meta glasses owners earlier in the year. A lot of them loved their glasses but worried how others saw them. Some said they would happily buy a pair without cameras if it made them less likely to be labelled a “creep”.", "why": "It shows what customers value and what they fear, in their own words. It is one reviewer's report of what owners said, not a survey, so say “a reviewer wrote”.", "share": "A tech reviewer found that owners love the glasses, but some said they would happily buy a pair without a camera so people would be less likely to call them a creep.", "source": "Engadget, 13 Oct 2026", "url": "https://www.engadget.com/2285337/ray-ban-meta-audio-glasses-review/"}, {"title": "Meta ships 94 of every 100 AI glasses without a screen", "fact": "In the first half of 2026, Meta had 94% of global shipments of AI glasses without a display. Counterpoint says the rest is split among many small brands.", "why": "It is the core of your competitors paragraph. Always say “without a screen” next to 94%. Counting all smart glasses, Meta went from over 60% in 2024 to 82% in the second half of 2025, so its lead is growing. That is a different count, so never say Meta went from 82% to 94%.", "share": "Out of every 100 AI glasses without a screen shipped in early 2026, 94 were Meta's.", "source": "Counterpoint Research, 21 Sep 2026", "url": "https://counterpointresearch.com/en/insights/global-ai-glasses-shipments-surge-263-percent-yoy-with-display-less-ai-glasses"}, {"title": "A research company sees room for a privacy rival", "fact": "IDC says Meta added its privacy steps only after a public backlash, and that this leaves room for a rival that builds privacy in from the start. In IDC's count, which also includes headsets, the next four brands after Meta each held under 4% in April to June 2026.", "why": "This is where your closing opinion comes from, that privacy is where competitors have a chance. The source is a research company's view, and it does not say which steps Meta took. Do not add details it does not give.", "share": "IDC, a research company, says Meta added privacy steps only after people got angry, and that leaves room for a rival that builds privacy in from the start.", "source": "IDC blog, 16 Sep 2026", "url": "https://www.idc.com/resource-center/blog/smart-glasses-growth-cools-to-35-as-meta-doubles-down-on-distribution/"}, {"title": "A rival whose selling point is no camera", "fact": "Even Realities sells its newest glasses with the slogan “Camera-free. By design.” Its website also promises “No recording and social friction.” The glasses have a small screen but no camera.", "why": "This is a real rival turning privacy into its selling point. In Kotler's words, it positions itself against Meta in buyers' minds. It is a small brand and its Even G2 starts at 699 euros, so do not call it a big threat.", "share": "Even Realities answers the creep problem with a slogan: “Camera-free. By design.”", "source": "Even Realities website, checked 19 Oct 2026", "url": "https://www.evenrealities.com/smart-glasses"}, {"title": "Meta competes with its own Oakley glasses", "fact": "Sporty AI glasses, including the Oakley Meta HSTN and Vanguard, made up over 30% of everything Meta shipped in the last three months of 2025. So more than 3 in every 10 pairs Meta shipped were sporty models like these.", "why": "It answers the likely question about why Oakley counts as a competitor when it is the same company. Oakley sells in the same market, so a buyer who picks an Oakley pair may skip the Wayfarer.", "share": "Over 30% of the glasses Meta shipped in the last three months of 2025 were sporty models like the Oakleys, so the Wayfarer competes with Meta's own models.", "source": "Counterpoint Research, 27 Feb 2026", "url": "https://counterpointresearch.com/en/insights/Global-Smart-Glasses-Shipments-Grew-139-Percent-YoY-in-H2-2025"}, {"title": "No shop in Lithuania, every pair comes from Italy", "fact": "An official Ray-Ban Meta seller with a Lithuanian website says it has no physical shop in Lithuania. It ships its pairs from its optician in Italy. Free delivery to a parcel locker takes 9 to 15 days on orders over 70 euros, and longer if the pair must be ordered from the maker. At the same seller, a plain Ray-Ban Wayfarer was on sale for about 175 euros, and the newest smart one started at about 430.", "why": "It makes the Lithuanian buyer concrete. A buyer here orders online and waits, and the smart pair costs more than twice the plain one's sale price.", "share": "A Lithuanian buyer orders online, because the official seller we found has no shop in Lithuania and ships from Italy. Free delivery takes 9 to 15 days, and longer if the pair has to be ordered from the maker.", "source": "Estheroptica.lt, checked 19 Oct 2026. Label \"Oficialus Ray-Ban Meta pardavėjas\"", "url": "https://www.estheroptica.lt/ray-ban-meta/"}, {"title": "A 1952 shape with a computer inside", "fact": "The Wayfarer shape was designed in 1952 at Bausch & Lomb, Ray-Ban's owner at the time. Today the same shape carries a camera, microphones, speakers and an AI assistant.", "why": "For a design student this is a good angle. Google Glass looked like a gadget and got mocked. The Wayfarer looks like normal sunglasses, so the technology hides in a famous old shape.", "share": "The Wayfarer shape is from 1952, and now it hides a camera, speakers and an AI assistant.", "source": "US design patent D169,995, filed 22 Jul 1952", "url": "https://patents.google.com/patent/USD169995S/en"}]}, {"id": "gcn-midterm", "kind": "exam", "course": "Global Communication", "title": "Midterm: Lectures 1 to 3", "date": "2026-10-20T17:15:00+03:00", "place": "Online, VU Moodle, 60 minutes", "part": "Lectures 1 to 3", "lessons": [{"id": "l1-csr", "title": "CSR, ethics and stakeholders", "cards": [{"title": "Learning goals 1 to 4", "body": "The chapter has seven learning goals. Goal 1: obligations to global stakeholders (shareholders, workers, communities and governments, all at once). Goal 2: human rights abroad, where expectations for MNCs have risen sharply in recent decades. Goal 3: CSR and codes of ethics as strategy. Goal 4: practical guidance for a manager when ethical standards differ across cultures.", "example": "Goal 3: CSR is a real competitive factor, not just good PR.", "src": "L1 s2"}, {"title": "Learning goals 5 to 7", "body": "Goal 5: companies must give back to their host countries to keep their “social license to operate”. Goal 6: sustainability has to be built into long-term strategy, not treated as an afterthought. Goal 7: China is the comparative case study.", "example": "China: huge opportunity, hard human-rights questions.", "src": "L1 s3"}, {"title": "Opening profile: Primark", "body": "The lecture opens with Primark and the true cost of fast fashion. The slides show photos only. One photo shows garment workers in Bangladesh holding signs. The other shows protesters outside a Primark store holding signs. The slides give no further details.", "example": "Signs: “I made your clothes”, “Primark's shame”, “Never again”.", "src": "L1 s4-5"}, {"title": "CSR and ethics", "body": "CSR is a company regulating itself: going beyond the legal minimum, voluntarily. It means actively monitoring your own compliance with laws, ethics and social norms. Ethics is the decisions and interactions of individuals. CSR decisions are bigger: made at a higher level, and affecting far more people.", "example": "2003: the UN drafted its first CSR guidelines for multinational corporations.", "src": "L1 s6"}, {"title": "The CSR dilemma", "body": "CSR weighs the benefit against the harm MNCs create, especially in developing countries. The big question is how much a firm should care about the social effects of its decisions. One extreme: profit is the MNC's only goal. The other extreme: MNCs should anticipate and solve social needs. Most real firms sit in between, and that position shifts under pressure.", "example": "“We only owe you profit” versus “we should actively solve social problems”.", "src": "L1 s7-8"}, {"title": "Core CSR issues", "body": "The core CSR issues are poverty, environment, consumer rights and worker safety. These issues are now mapped onto the UN's 17 SDGs. The SDGs come back later in the lecture, on slides 45 and 46.", "example": "Four core issues: poverty, environment, consumer rights, worker safety.", "src": "L1 s8"}, {"title": "MNC stakeholders", "body": "Home-country stakeholders: owners, employees, customers, unions, suppliers, strategic allies, distributors, society in general, community, economy, government. Host-country stakeholders: economy, community, employees, host government, consumers, suppliers, strategic allies, distributors. Global stakeholders: global interdependence and standard of living, global environment and ecology, sustainable resources, population's standard of living.", "example": "Diagram: the MNC in the middle, home and host stakeholders around it, global stakeholders around both.", "src": "L1 s9"}, {"title": "International CSR is harder", "body": "International CSR is harder than domestic CSR: more stakeholders, more conflicts of interest. Managers must weigh home-country rights against host-country rights, and the answer is rarely clean. Del Monte's pineapple farms in Kenya bring export earnings but take up scarce farmland.", "example": "Pakistan soccer balls: pay a living wage and risk hunger for families who lose the work, or keep wages low and risk child labour.", "src": "L1 s10"}, {"title": "Global consensus or variation", "body": "“Global Corporate Culture” is the idea that business norms are converging worldwide. In practice the US and Europe still diverge, rooted in different histories and philosophies. The US approach is clear, universal rules: “do business right” and treat everyone by the same standard. The EU approach is broader social aims: environment, shared values, relationships.", "example": "The 2024 Forced Labour Regulation reflects the EU's tougher, systemic tradition.", "src": "L1 s11"}, {"title": "Dealing with confusion", "body": "The slide gives three ways to deal with confusion about cross-cultural dilemmas. First, engage stakeholders (and sometimes NGOs) in a dialog. Second, establish principles and procedures for difficult issues. Third, adjust reward systems to reflect the company's commitment to CSR.", "example": "Difficult issues named: labor standards for suppliers, environmental reporting, human rights.", "src": "L1 s12"}]}, {"id": "l1-codes", "title": "Codes of conduct", "cards": [{"title": "Three approaches to ethics", "body": "The slide gives three approaches for a code of morality and ethics. Moral universalism: a moral standard accepted by all cultures. Ethnocentric approach: apply the morality of the home country, regardless of the host country's system of ethics. Ethical relativism: adopt the local moral code of whatever country the firm operates in.", "example": "Moral universalism is marked “preferable”. Ethical relativism is marked “conflict”.", "src": "L1 s13"}, {"title": "Three industry codes", "body": "Sweatshop Code of Conduct (Clinton-era, 1990s): bans forced labour and discrimination, sets minimum wage and safety rules. Responsible Business Alliance (formerly the Electronic Industry Code of Conduct): a whole industry self-regulating; bans child and forced labour and excessive overtime, requires supplier audits. Social Accountability 8000 (SA8000): an ISO-style, certifiable labour standard.", "example": "Sweatshop Code: Nike, Reebok, Walmart, Liz Claiborne. RBA: HP, Dell, IBM, Intel and 12+ more. SA8000: Avon, Sainsbury's.", "src": "L1 s14"}, {"title": "UN Global Compact", "body": "The UN Global Compact aims to mobilize a global movement of sustainable companies and stakeholders. It supports companies to do business responsibly by aligning strategies and operations with 10 Principles on four areas: human rights, labour, environment and anti-corruption. It also pushes action to advance the SDGs, with an emphasis on collaboration and innovation.", "example": "23,000+ business participants in 160+ countries (2025, 25th anniversary).", "src": "L1 s15"}, {"title": "Global Compact principles", "body": "Slide 16 is titled “10 principles” but lists nine bullets. They are: respect of human rights; the right to collective bargaining; elimination of forced labour; abolition of child labour; elimination of discrimination in employment; a precautionary approach to environmental challenges; greater environmental responsibility; diffusion of environmentally friendly technologies; work against corruption in all its forms.", "example": "Four areas from slide 15: human rights, labour, environment, anti-corruption.", "src": "L1 s15-16"}, {"title": "Getz's five codes", "body": "Getz's integrated international codes of conduct combine five sources. One: International Chamber of Commerce Guidelines for International Investments. Two: The OECD Guidelines for Multinational Enterprises. Three: ILO Tripartite Declaration of Principles Concerning Multinational Enterprises and Social Policy. Four: UN Code of Conduct of Transnational Corporations. Five: UN Universal Declaration for Human Rights.", "example": "Author to remember: Getz.", "src": "L1 s17"}, {"title": "Three areas of the codes", "body": "The codes cover three areas. MNC and Host Governments: economic and development policies, law and regulations, political involvement. MNC and Public: technology transfer, environmental protection. MNC and Persons: consumer protection, employment practices, human rights.", "example": "Slides 19 to 25 detail seven of the eight sub-areas. Human rights has no detail slide.", "src": "L1 s18"}, {"title": "Host government: economic policy", "body": "Economic and development policies. Investments should conform to the host country's economic and social development. They should help resolve balance of payments and exchange rate difficulties, ensure local equity participation, and not dominate capital markets. Taxes are paid to host governments, the tax base is not modified, raw materials come from local sources, and profits are reinvested in host countries.", "example": "Eight points in total, from local development to reinvesting profits.", "src": "L1 s19"}, {"title": "Host government: law and politics", "body": "Law and regulations: the MNC obeys the laws of the country where it operates, respects its right to control natural resources and to regulate, uses international dispute settlement including arbitration, and resolves expropriation disputes under host-country law. Political involvement: no improper involvement in local politics, no bribes to any public servant, no interference in intergovernmental relations.", "example": "Political involvement: should not pay bribes to any public servant.", "src": "L1 s20-21"}, {"title": "Public and consumers", "body": "Technology transfer: cooperate with governments to build technological capacity of developing countries, develop technologies for local needs, do R&D with local resources and personnel. Environmental protection: respect host-country environmental law, cooperate with governments and IO on standards, supply information on environmental impacts. Consumer protection: respect consumer law, protect safety and health by disclosure, proper labelling and accurate advertising.", "example": "Three areas here: technology transfer, environmental protection, consumer protection.", "src": "L1 s22-24"}, {"title": "Employment practices", "body": "Employment practices: cooperate with governments to create jobs in particular localities; try to increase employment opportunities and standards in host countries; give advance notice of plant closures and mitigate effects; provide standards equal to or better than local ones; pay at minimum basic living wages; keep the highest safety and health standards and give adequate information about work-related hazards.", "example": "Two anchors: advance notice of plant closures, basic living wages.", "src": "L1 s25"}]}, {"id": "l1-bribery", "title": "China, bribery and corruption", "cards": [{"title": "Why China attracts business", "body": "The case study is business in China (slide title: “Comparative Management in Focus: Business in China”). The slide lists four attractions: a skilled workforce, 1.4B consumers, an EV and green-tech hub, and the 2nd-largest economy.", "example": "1.4B consumers and the 2nd-largest economy.", "src": "L1 s26"}, {"title": "China: human rights issues", "body": "The slide has two columns. Challenges: potentially rampant violation of workers' rights; repression of free speech; difficulty monitoring and correcting human rights violations. Issues in China, as named: Nike, Xinjiang cotton bans and forced-labour import laws, Shein, H&M, Apple. The slide does not pair each name with a challenge.", "example": "Names on the slide: Nike, Shein, H&M, Apple.", "src": "L1 s27"}, {"title": "Business ethics varies", "body": "International business ethics is the business conduct or morals of MNCs in their relationship with individuals and entities. Ethics vary based on the cultural value system in each country or society. So practices considered illegal in some countries are accepted ways of doing business in others.", "example": "Slide 28: illegal in one country, an accepted way of doing business in another.", "src": "L1 s28"}, {"title": "Moral philosophy of societies", "body": "Exhibit 2-3 comes from Robertson and Crittenden (2003). It is a flow. Economic ideology (capitalism versus socialism) and culture (Western versus Eastern) lead to a dominant moral philosophy. That leads to ethical or unethical societal norms, which lead to individual behavior. Three groups of moderators act on the flow.", "example": "Macro: natural resources, GDP per capita, government form, stability. Societal: language, religion, traditions. Firm: culture, policies, profit motive.", "src": "L1 s29"}, {"title": "To bribe or not to bribe", "body": "The slide gives three situations. Paying mail carriers in Mexico to prevent them from “losing” mail. Paying $100 to get a computer picked up, not left on a rainy dock. Gift-giving to bond social ties.", "example": "Slide title: “To Bribe or NOT to Bribe?”", "src": "L1 s30"}, {"title": "Questionable payments", "body": "Questionable payments are political payments, extortion, bribes or “grease money” to speed up routine transactions. In some cultures bribery is treated as normal, and gift-giving is common and expected. Key difference: gift-giving is open; bribery is secret and transactional. Bribery of officials is illegal everywhere, regardless of local custom.", "example": "The dilemma: stick to your own standard and risk losing business, or match local practice and risk the law.", "src": "L1 s31"}, {"title": "FCPA and the OECD convention", "body": "The FCPA (US Foreign Corrupt Practices Act) bans bribing foreign officials to win business. Penalties include heavy fines and prison. 2025 update: Trump paused FCPA enforcement (Feb to Jun 2025); the DOJ reopened it in June 2025, refocused on bribery tied to cartels and organised crime. Even “universal” rules can shift with politics.", "example": "OECD Anti-Bribery Convention: signed by 36+ countries, hard to enforce without a formal complaint.", "src": "L1 s32"}, {"title": "CPI: least corrupt", "body": "The slide is titled Global Corruption Barometer (CPI). Its footnote says Transparency International's 2025 CPI, the Corruption Perceptions Index. Scores run 0 to 100, and a higher score means less corrupt. Least corrupt in 2025: Denmark 89, Finland 88, Singapore 84, New Zealand 81, Norway 81, Sweden 80, Switzerland 80, Netherlands 78, Germany 77.", "example": "Denmark is at the top with 89.", "src": "L1 s33"}, {"title": "CPI: most corrupt and facts", "body": "Most corrupt in 2025: South Sudan 8, Somalia 9, Venezuela 10, Syria 12, Yemen 13, Equatorial Guinea 13. In the 2025 CPI, 182 countries were scored 0 to 100. The global average fell to a record-low 42.", "example": "Lithuania scores 65 (rank 28). The US scored 64 (rank 29, its lowest ever).", "src": "L1 s33"}, {"title": "Policies for ethical behaviour", "body": "Four policies help MNCs deal with ethical behaviour: develop a worldwide code of ethics; build ethical policies into strategy development; plan regular assessment of the company's ethical posture; if ethical problems cannot be resolved, withdraw from that market. Questionable behavior can be a “slippery slope”.", "example": "A small bribe, a matter of personal ethics, can over time become truly negligent and perhaps criminal.", "src": "L1 s34"}]}, {"id": "l1-interdep", "title": "Interdependence and sustainability", "cards": [{"title": "Criticisms 1 to 3", "body": "Common criticisms of MNC subsidiary activities, part one. One: MNCs raise capital locally, which can push up interest rates for domestic firms. Two: subsidiaries are usually majority- or fully-owned by the parent, so host-country people have little real control. Three: MNCs reserve senior managerial and technical roles for expatriates, slowing local talent development.", "example": "Criticism 3: senior roles go to expatriates.", "src": "L1 s35"}, {"title": "Criticisms 4 to 9", "body": "Four: technology is not always adapted to local conditions. Five: R&D stays at headquarters, limiting technology transfer. Six: can fuel demand for luxury goods over essential goods. Seven: often enters by buying an existing firm. Eight: can dominate whole industries, raising demand for scarce resources and inflation. Nine: answers only to home-country shareholders and government.", "example": "Criticism 9: not accountable to the host nation's own development plans.", "src": "L1 s36-37"}, {"title": "Benefits and costs to hosts", "body": "Managing the subsidiary and host-country relationship goes beyond CSR. Benefits: outside capital, foreign-exchange earnings, technology, infrastructure development, new jobs, local management development. Costs: competition for capital, increased interest rates, inappropriate technology, development investment exceeding benefits, limited skills development, few managerial jobs for locals.", "example": "“MNCs must learn to accommodate the needs of other organizations and countries.”", "src": "L1 s38-39"}, {"title": "Nationalism, protectionism, governmentalism", "body": "Three host-country stances. Under nationalism, public opinion favours national goals and is against foreign influences. Under protectionism, the host partly or fully closes borders to withstand foreign products, using tariff and nontariff barriers. Under governmentalism, the government uses policy-setting to favour national interests, not market forces.", "example": "Protectionism uses tariff and nontariff barriers.", "src": "L1 s40"}, {"title": "Exporting the risk", "body": "Developed countries export growing volumes of hazardous waste and banned chemicals to developing ones. Monsanto (acquired by Bayer in 2018) sold pesticides abroad that were banned in the US. The twist: produce grown with those pesticides is often re-imported as food, so “exporting the risk” does not fully protect the exporting country.", "example": "The slide: the US exports roughly 200 million lbs of pesticides a year that are banned for use at home.", "src": "L1 s41"}, {"title": "Industrial ecology", "body": "Industrial ecology views an industrial system together with its surrounding environment, to optimise the total materials cycle from virgin material to ultimate disposal. To deal with ecological interdependence, strategic planning integrates three things: looking for alternative raw materials, developing new methods of recycling, and expanding use of by-products.", "example": "Three steps: alternative raw materials, new recycling methods, more use of by-products.", "src": "L1 s42"}, {"title": "Sustainability and development", "body": "Sustainability means meeting today's needs without compromising tomorrow's resources. Its three pillars, the “Triple Bottom Line”: Economic + Social + Environmental. It also includes future generations, biodiversity, human rights, transparency, education. Sustainable development became the main guiding principle after the Rio conference of 1992, and respects the limited capacity of an ecosystem to absorb human impact.", "example": "Rio conference, 1992.", "src": "L1 s43-44"}, {"title": "Agenda 2030 and the SDGs", "body": "In September 2015, 193 countries adopted the 2030 Agenda for Sustainable Development. Its goal is balanced economic, social and environmental development that will “leave no one behind”. It has 17 SDGs with measurable targets. The slide adds a 2026 reality check: with 4 years left, fewer than 1 in 5 targets are on track.", "example": "SDG examples: no poverty, zero hunger, climate action. The full list of 17 is in the glossary.", "src": "L1 s45-46"}, {"title": "Recommendations for MNCs", "body": "For MNCs in developing countries: do no intentional harm (including ecosystem integrity and consumer safety); produce more good than harm; contribute to host-country development; respect employees' human rights; respect local culture and work with it if it does not violate ethical norms; pay a fair share of taxes; cooperate with local government on just background institutions.", "example": "Seven recommendations in total.", "src": "L1 s47"}, {"title": "Final remarks", "body": "Three closing points. One: managing interdependence means weighing ecological, economic and social impact together, not one after the other. Two: the core tension is low prices versus environmental and social responsibility. Three: there is no single global standard, because environmental and health policy still varies widely by country.", "example": "Core tension: low prices versus environmental and social responsibility.", "src": "L1 s48"}]}, {"id": "l2-nature", "title": "What culture is", "cards": [{"title": "Chapter learning goals", "body": "The chapter sets six goals. Understand how culture affects international management, including communication and negotiations. Distinguish the major dimensions of cultural difference. See why managers need cultural intelligence in host countries. Recognize critical value differences. Build a working cultural profile of a society. Understand how culture and the Internet interact.", "example": "Goal 5: a cultural profile is an aid to expected attitudes toward work, communication and negotiations.", "src": "L2 s2-3"}, {"title": "Opening profile: Saudi Arabia", "body": "The lecture opens with Saudi Arabian culture. Saudi Arabia covers most of the Arabian peninsula. Its neighbours are all Arab and predominantly Islamic. Women outnumber men in universities and own 20 percent of all businesses. About 77 percent of the total workforce is still foreign-born.", "example": "Women are now about 35 percent of the Saudi workforce, up from just 17 percent in 2017.", "src": "L2 s4-5"}, {"title": "Huntington: clash of civilizations", "body": "S. P. Huntington argued that the main source of conflict in the new world will be cultural, not ideological or economic. Nation states stay powerful, but the main conflicts will be between nations and groups of different civilizations. The fault lines between civilizations will be the battle lines of the future.", "example": "The map (s7) labels Western, Orthodox, Islamic, Sinic, Hindu, Japanese, Latin American and African, plus smaller areas such as Buddhist.", "src": "L2 s6-8"}, {"title": "What culture is", "body": "Culture is acquired knowledge that people use to interpret experience and generate social behavior. It does three things. It forms values, it creates attitudes, and it influences behavior.", "example": "Three effects of culture: forms values, creates attitudes, influences behavior.", "src": "L2 s9"}, {"title": "Six characteristics of culture", "body": "Culture is learned, shared, transgenerational, symbolic, patterned and adaptive. Learned means people acquire it from their society. Shared means members of a group hold it in common. Transgenerational means it passes from one generation to the next.", "example": "The six words: learned, shared, transgenerational, symbolic, patterned, adaptive.", "src": "L2 s10"}, {"title": "Values in culture", "body": "Values are basic convictions that people have about what is right and wrong, good and bad, important and unimportant. People learn them from the culture in which they are educated, and they influence behavior. Differences in cultural values may result in varying management practices.", "example": "Three pairs on the slide: right and wrong, good and bad, important and unimportant.", "src": "L2 s11"}, {"title": "Culture and organizations", "body": "At the level of organizations, culture is a set of shared values, understandings, assumptions and goals. People learn it from earlier generations. Present members of a society impose it. It is passed on to succeeding generations.", "example": "Three steps: learned from earlier generations, imposed by present members, passed on to succeeding generations.", "src": "L2 s12"}, {"title": "Schein's culture triangle", "body": "Edgar Schein's model has three levels. Artefacts and symbols are visible: logos, architecture, structure, processes, corporate clothing. Espoused values are standards, values and rules of conduct, and how strategies and philosophies are made public. Basic underlying assumptions are deeply embedded, self-evident and unconscious, and hard to recognize from within.", "example": "Problems could arise when managers' ideas are not in line with the basic assumptions of the organization.", "src": "L2 s13-14"}, {"title": "Schein's model on society", "body": "Schein's model also works for a whole society. The top level is the explicit artifacts and products of the society. The middle level is the norms and values that guide the society. The deepest level is the implicit, basic assumptions that guide people's behavior.", "example": "Organization level: artefacts, espoused values, assumptions. Society level: products, norms and values, implicit assumptions.", "src": "L2 s15"}, {"title": "The onion model", "body": "Schein's model is also called the onion model. The outer layer is easy to adapt and change. The deeper the layer, the harder it is to adjust. Assumptions sit in the core and values around the core. Between artefacts and values there may be a layer of heroes: admired people who play or played an important role.", "example": "Artefacts and symbols sit in the outer layers and can be changed most easily.", "src": "L2 s16"}, {"title": "Cultural sensitivity", "body": "Cultural sensitivity, also called cultural empathy, is an awareness of and an honest caring about another individual's culture. The learning goals say managers need cultural intelligence to interact successfully in host countries.", "example": "Two parts: awareness of the culture, and honest caring about it.", "src": "L2 s17, s2"}]}, {"id": "l2-orgs", "title": "Culture, organisations and subsystems", "cards": [{"title": "Organizational culture", "body": "Organizational culture exists within and interacts with societal culture. It varies a great deal from one organization, company, institution or group to another. It represents the expectations, norms and goals held in common by members of that group.", "example": "It functions like societal culture, but varies a great deal within a single societal culture.", "src": "L2 s18-19"}, {"title": "The convergence debate", "body": "How far culture affects organizational processes is a subject of debate. Some say convergence is making management styles more similar to one another. They name industrialization and worldwide coordination as the reasons. Convergence is the shifting of individual management styles to become similar.", "example": "Reasons given for convergence: industrialization and worldwide coordination.", "src": "L2 s18, s21"}, {"title": "Organizations respond to society", "body": "Organizational culture is at least partly a function of societal culture and must respond to it. The airline KLM extended its travel benefits to any couple who formally registered as living together. McDonald's gives more training in Russia than in the US.", "example": "McDonald's reason: Russians are less familiar with working within a capitalist system.", "src": "L2 s19"}, {"title": "Culture's effect on processes", "body": "The slide compares US assumptions with alternatives. Individual influences future, or life is preordained: planning and scheduling. Environment is changeable, or people adjust to it: morale and productivity. Hard work leads to success, or wisdom and luck are also needed: motivation and rewards. Employment can be ended, or is for a lifetime: promotions and recruitment.", "example": "Employment for a lifetime, instead of employment that can be ended, affects promotions and recruitment.", "src": "L2 s20"}, {"title": "Self-reference criterion", "body": "The self-reference criterion is the subconscious reference point of one's own cultural values. Many people in the world understand and relate to others only in terms of their own cultures. The slide's printed example, worded unclearly, mentions Japanese workers who interrupt conversation with Americans when there are problems.", "example": "Key word: subconscious. The reference point is your own culture's values.", "src": "L2 s21"}, {"title": "Parochialism and ethnocentrism", "body": "Parochialism occurs when, for example, a Frenchman expects those from another country to fall automatically into patterns of behavior common in France. Ethnocentrism is the attitude of those who assume that their ways of doing things are best, no matter where or under what conditions they are applied.", "example": "A Camay soap commercial (P&G, US) backfired in Japan; Japanese viewers saw the man's behavior as bad manners.", "src": "L2 s21"}, {"title": "Subcultures and stereotyping", "body": "Many countries comprise diverse subcultures whose members conform only in varying degrees to the national character. Stereotyping here means a cultural profile that develops tentative expectations, some cultural context, as a backdrop to managing in a specific international setting.", "example": "Canada is the slide's example of subcultures. Distinct ethnic groups in China have their own customs and dialects.", "src": "L2 s22, s26"}, {"title": "Cultural subsystems 1 to 4", "body": "Kinship guides family relationships: the nuclear family in the US, the extended family in some other countries. Education influences expectations of workers and choices about recruitment, staffing, training and leadership. The economic system influences sourcing, distribution, incentives and reparation of capital. The government and political system imposes constraints on organizations.", "example": "Four of seven: kinship, education, economic system, government and political system.", "src": "L2 s23-24"}, {"title": "Cultural subsystems 5 to 7", "body": "Religion commonly underlies moral and economic norms. A country's system of health affects employee productivity, expectations and attitudes toward physical fitness. Workers' attitudes about recreation can affect their work behavior and their perception of the role of work in their lives.", "example": "Seven in total: kinship, education, economic, political, religion, health, recreation.", "src": "L2 s23, s25"}, {"title": "Cultural values and profiles", "body": "Values determine how individuals probably will act in given circumstances. They are communicated via the seven subsystems and passed down through generations. Contingency management requires managers to adapt to the local environment. Value dimensions and cultural profiles give only an approximation of national character.", "example": "Americans tend to think of the Chinese as culturally homogenous, but ethnic groups in China differ.", "src": "L2 s26"}]}, {"id": "l2-models", "title": "Hall, Kluckhohn and Strodtbeck, Lewis, Gesteland, Schwartz", "cards": [{"title": "Models of culture: the list", "body": "Slide 27 lists attempts to assess cultural differences. Edward Hall, The silent language (1959). Kluckhohn and Strodtbeck (1961). Richard D. Lewis, When Cultures Collide (1996). Richard Gesteland (1996). Geert Hofstede (1997 edition). Trompenaars and Hampden-Turner, Riding the Waves of Culture (1997). S. Schwartz (2009). The GLOBE project (2007 book).", "example": "Eight attempts: Hall, Kluckhohn and Strodtbeck, Lewis, Gesteland, Hofstede, Trompenaars, Schwartz, GLOBE.", "src": "L2 s27"}, {"title": "Hall: three big differences", "body": "Edward T. Hall names the most important differences between cultures. First, proxemics: the amount of space people feel they must set between themselves and others, with high contact and low contact. Second, high context and low context. Third, polychronic versus monochronic time.", "example": "Zones: intimate 0.45 m (1.5 ft), personal 1.2 m (4 ft), social 3.6 m (12 ft), public 7.6 m (25 ft).", "src": "L2 s29-30"}, {"title": "High and low context", "body": "Low context: explicit messages, little attention to the status of the person, task oriented. High context: not just the message is important, relation oriented. From most high-context: Japanese, Arabic, Latin American, Italian, English, French, North American, Scandinavian (except Finland), German, Swiss-German.", "example": "Japanese is most high-context on the slide. Swiss-German is least high-context.", "src": "L2 s31-32"}, {"title": "Monochronic people", "body": "Monochronic people do one thing at a time and concentrate on the job. They take time commitments seriously and are committed to the job. They adhere religiously to plans. They worry about not disturbing others, and about privacy. They seldom borrow or lend. They are accustomed to short-term relationships.", "example": "Opposite pair: monochronic people seldom borrow or lend; polychronic people borrow and lend often and easily.", "src": "L2 s33"}, {"title": "Polychronic people", "body": "Polychronic people do many things at once and are highly distractible, subject to interruptions. They consider an objective to be achieved, if possible. They are committed to people and human relationships. They change plans often and easily. They are concerned with those closely related. They borrow and lend often and easily, and tend to build lifetime relationships.", "example": "Monochronic: committed to the job. Polychronic: committed to people and human relationships.", "src": "L2 s33"}, {"title": "Kluckhohn and Strodtbeck 1 to 3", "body": "Kluckhohn and Strodtbeck (1961) ask six questions. Nature of people: good (changeable or unchangeable), evil, or a mixture of good and evil. Relationship to nature: dominant, in harmony, or subjugation. Relationship to other people: lineal (hierarchical), collateral (collectivist), or individualist.", "example": "Book: Variations in Value Orientations (Peterson, New York, 1961).", "src": "L2 s34-35"}, {"title": "Kluckhohn and Strodtbeck 4 to 6", "body": "The other three questions. Modality of human activity: doing, being, or containing. Temporal focus of human activity: future, present, or past. Conception of space: private, public, or mixed.", "example": "Time appears as the temporal focus: future, present or past.", "src": "L2 s36"}, {"title": "Lewis: linear-active", "body": "Richard D. Lewis (When Cultures Collide) sorts cultures into three categories. Linear-active: talks half the time, does one thing at a time, plans ahead step by step, polite but direct, partly conceals feelings, confronts with logic, dislikes losing face, rarely interrupts, job-oriented, sticks to facts, truth before diplomacy.", "example": "Triangle corner: Germany and Switzerland. Blue on the key: cold, factual, decisive planners.", "src": "L2 s37-39"}, {"title": "Lewis: multi-active", "body": "Multi-active: talks most of the time, does several things at once, plans grand outline only, emotional, displays feelings, confronts emotionally, has good excuses, often interrupts, people-oriented, feelings before facts, flexible truth.", "example": "Triangle corner: Hispanic America. Red on the key: warm, emotional, loquacious, impulsive.", "src": "L2 s38-39"}, {"title": "Lewis: reactive", "body": "Reactive: listens most of the time, reacts to partner's action, looks at general principles, polite and indirect, conceals feelings, never confronts, must not lose face, does not interrupt, very people-oriented, statements are promises, diplomacy over truth.", "example": "Triangle corner: Vietnam. Yellow on the key: courteous, amiable, accommodating, compromiser, good listener.", "src": "L2 s38-39"}, {"title": "Lewis triangle: countries", "body": "Countries sit between the corners. Linear-active to multi-active side: U.S.A., Netherlands and Norway, Australia and Denmark, Belgium, France, Russia, Italy, Spain and Portugal. Multi-active to reactive side: Africans, Arabs, Iran and Turkey, India, Indonesia and Philippines, Korea, China. Base: U.K., Sweden, Finland, Canada, Singapore, Hong Kong, Japan.", "example": "Canada sits in the middle of the base, between linear-active and reactive.", "src": "L2 s39"}, {"title": "Gesteland's cultural groups", "body": "Richard Gesteland sorts cultures into Cultural Groups (A-G). He uses four features: deal focus or relationship focus, formal or unformal, polychronic or monochronic, and reserved or expressive. His book is Cross-cultural business behaviour (Copenhagen Business School Press).", "example": "Four pairs: deal/relationship, formal/unformal, polychronic/monochronic, reserved/expressive.", "src": "L2 s40, s27"}, {"title": "Schwartz: seven value types", "body": "Shalom H. Schwartz's model is a circle of seven value types. Harmony: unity with nature, world at peace. Embeddedness: social order, obedience, respect for tradition. Hierarchy: authority, humble. Mastery: ambition, daring. Affective autonomy: pleasure, exciting life. Intellectual autonomy: broadmindedness, curiosity. Egalitarianism: social justice, equality.", "example": "Source: Culture matters: National value cultures, sources and consequences (2009).", "src": "L2 s41, s27"}, {"title": "Schwartz: results by region", "body": "South American cultures clustered in the middle of the model. English speaking countries highly valued Mastery, with higher values on Hierarchy than on Egalitarianism. Western Europe was mainly around Egalitarianism and Intellectual Autonomy. Eastern Europe also favoured Egalitarianism, a little more towards Embeddedness. In the Middle East and most of Asia, Embeddedness and Hierarchy dominated.", "example": "Middle East and most of Asia: Embeddedness and Hierarchy dominate.", "src": "L2 s42"}]}, {"id": "l2-hofstede", "title": "Hofstede's six dimensions", "cards": [{"title": "Hofstede and the IBM research", "body": "Geert Hofstede developed a theory to measure cultural differences. His problem was how to quantify culture. He defined culture in six dimensions, based on research at IBM: power distance, individualism, uncertainty avoidance, masculinity, long-term orientation, indulgence. The research covered 116,000 people in 50 countries, all in one firm, so read the results with caution.", "example": "He found four dimensions first. Long-term orientation and indulgence were added later.", "src": "L2 s43-45"}, {"title": "Power distance", "body": "Power distance is a society's acceptance of unequal power distribution. In high power distance cultures, formal authority and hierarchy are very respected, so leadership tends to be autocratic and centralized. In low power distance cultures, superiors and subordinates are more likely to see one another as equals, leading to more cooperation.", "example": "Older table (s48): Malaysia 100 is first; Denmark 18 and Israel 13 are near the bottom.", "src": "L2 s47-48"}, {"title": "Uncertainty avoidance", "body": "Uncertainty avoidance is the extent to which people feel threatened by ambiguous situations. High: strict laws, closely followed procedures, low-risk decisions, non-aggressive employees, lifetime employment common. Low: more comfortable with ambiguity, less formal and structured activities, managers take more risks, employees have more job mobility.", "example": "Older table (s49): Greece 100 and Portugal 99 are high; Singapore 8 is the lowest listed.", "src": "L2 s47, s49"}, {"title": "Individualism and collectivism", "body": "Individualism is the tendency to look after yourself and your immediate family only and to neglect the needs of society. Democracy, individual initiative and achievement are valued. Collectivism entails tight social frameworks, emotional dependence on the organization and strong belief in group decisions. Higher individualism goes with higher GNPs and freer political systems.", "example": "Older table (s52): US 90 is first, UK 89 third; Colombia 13 is the lowest listed.", "src": "L2 s51-52"}, {"title": "Masculinity and femininity", "body": "Masculinity is the degree to which traditionally masculine values prevail: assertiveness, materialism, lack of concern for others. Femininity emphasizes concern for others, relationships and quality of life. More feminine cultures tend to have less work-family conflict, less job stress, more women in high-level jobs and a reduced need for assertiveness.", "example": "Older table (s53): Japan 95 is first; Norway 8 is the lowest listed.", "src": "L2 s51, s53"}, {"title": "Long-term orientation", "body": "Every society keeps some links with its past while dealing with the present and future. Societies prioritise these goals differently. Low scorers are normative: they prefer time-honoured traditions and norms and view societal change with suspicion. High scorers are pragmatic: they encourage modern education to prepare for the future.", "example": "Low score: normative, suspicious of change. High score: pragmatic, modern education.", "src": "L2 s55"}, {"title": "Indulgence and restraint", "body": "Indulgence is defined as the extent to which people try to control their desires and impulses, based on the way they were raised. Relatively weak control is called Indulgence. Relatively strong control is called Restraint. Cultures can be described as Indulgent or Restrained.", "example": "Weak control of desires: Indulgence. Strong control: Restraint.", "src": "L2 s55, s57"}, {"title": "Older tables: PDI and UAI", "body": "Slides 48 to 56 use older scores. Power distance (PDI): Malaysia 100, Arab countries 80, Japan 54, UK 35, Denmark 18, Israel 13; Lithuania 42 is written beside Jamaica. Uncertainty avoidance (UAI): Greece 100, Japan 92, Germany 65 (Lithuania 65 beside it), USA 46, Sweden 29, Singapore 8. China 30 is in brackets by Sweden.", "example": "Lithuania's PDI 42 and UAI 65 match the newer chart on slide 58.", "src": "L2 s48-49"}, {"title": "Older tables: IDV and MAS", "body": "Individualism (IDV): US 90, UK 89, Canada 80, Japan 46, China 20, Colombia 13; Lithuania 60 is written beside Finland. Masculinity (MAS): Japan 95, Austria 79, China 66, US 62, Denmark 16, Norway 8; Lithuania is printed as -19 beside Denmark. The true score on the newer chart is 19.", "example": "Lithuania on the newer chart: individualism 60 and masculinity 19.", "src": "L2 s52-53, s58"}, {"title": "Older table: long-term orientation", "body": "The LTO table has older scores: China 100, Hong Kong 96, Taiwan 87, Japan 80 (Lithuania 82 beside it), South Korea 75, Germany 31, US 29, UK 25, Pakistan 00. Do not mix it with the newer chart on slide 58, where China is 87, Japan 88, Lithuania 82 and US 26.", "example": "Use the newer chart (s58) for the China, Japan, Lithuania, US comparison.", "src": "L2 s56, s58"}, {"title": "The four-country chart", "body": "The Hofstede Insights chart compares China, Japan, Lithuania and US. Power distance: 80, 54, 42, 40. Individualism: 20, 46, 60, 91. Masculinity: 66, 95, 19, 62. Uncertainty avoidance: 30, 92, 65, 46. Long-term orientation: 87, 88, 82, 26. Indulgence: 24, 42, 16, 68.", "example": "Read each list in the order China, Japan, Lithuania, US. Slide 57 is only a world map of indulgence.", "src": "L2 s58, s57"}]}, {"id": "l2-tromp-globe", "title": "Trompenaars and GLOBE", "cards": [{"title": "Trompenaars: seven dimensions", "body": "Trompenaars and Hampden-Turner (Riding the Waves of Culture, 1997) give seven dimensions or dilemmas. Universalism vs particularism: obligations. Neutral vs emotional: emotions in relationship. Specific vs diffuse: privacy in relationship. Achievement vs ascription: source of power and status. Sequential vs synchronic. Internal vs external control. Individualism vs collectivism (communitarianism).", "example": "Seven dimensions; the first four come with a short label (obligations, emotions, privacy, status).", "src": "L2 s59"}, {"title": "Obligation and emotion", "body": "Universalistic cultures apply rules and systems objectively, without consideration of individual circumstances. Particularistic cultures put more emphasis on relationships and apply rules more subjectively. Affective or emotional cultures tend to express emotions openly, whereas neutral cultures do not.", "example": "Obligations are measured as universalism vs particularism.", "src": "L2 s60"}, {"title": "Privacy, power and status", "body": "People in specific cultures compartmentalize their work and private lives, and they are more open and direct. In diffuse cultures work spills over into personal relationships. In achievement-oriented cultures personal achievement is the source of status and influence. In ascription-oriented cultures status and influence come from society: class, age, gender, etc.", "example": "Ascription: class, age and gender give status. Achievement: your own results do.", "src": "L2 s62"}, {"title": "Trompenaars: country rows", "body": "Obligation, universalistic to particularistic: US, GER, SWE, UK, IT, FRA, JPN, SPA, SIN. Privacy in relationship, specific to diffuse: UK, US, FRA, GER, ITA, JPN, SWE, SPA, CHI. The rows for emotional orientation and source of power and status carry a copy-error label, so skip them.", "example": "Left ends: US (universalistic) and UK (specific). Right ends: SIN (particularistic) and CHI (diffuse).", "src": "L2 s61, s63"}, {"title": "The GLOBE project", "body": "GLOBE is the Global Leadership and Organizational Behavior Effectiveness Research Program. Robert J. House (Wharton) founded it in 1991. It uses questionnaires to create cultural dimensions and assess average values per country. It focuses on leadership behavior, is more in-depth, and separates desired from as-is preferences and organizational from societal values.", "example": "Founded 1991 by Robert J. House (Wharton).", "src": "L2 s64"}, {"title": "GLOBE's nine dimensions", "body": "The nine dimensions: uncertainty avoidance; power distance; collectivism I, social collectivism; collectivism II, in-group collectivism; gender egalitarianism; assertiveness; future orientation; performance orientation; humane orientation.", "example": "The s71 table calls two of them collectivism/societal and gender differentiation.", "src": "L2 s65, s71"}, {"title": "GLOBE and Hofstede", "body": "GLOBE results correspond generally with those of Hofstede and Trompenaars. GLOBE differs from Hofstede because many more researchers with varied perspectives were involved, while Hofstede worked alone. GLOBE studied many companies, Hofstede only IBM. GLOBE gives a current overview of general stereotypes that can be analyzed further.", "example": "Slides 67-68 add Hofstede codes: assertiveness (INDV), performance orientation (MAS), future orientation (LTO), humane orientation (FEM).", "src": "L2 s66-68, s45"}, {"title": "Assertiveness and performance", "body": "Assertiveness is how much people are expected to be tough, confrontational and competitive versus modest and tender. Low assertiveness countries have sympathy for the weak and stress loyalty and solidarity. Performance orientation is the importance of performance improvement and excellence. Low performance orientation countries put priority on tradition, loyalty, family and background, and associate competition with defeat.", "example": "Low assertiveness: Sweden, New Zealand. Low performance orientation: Russia, Argentina.", "src": "L2 s67, s69, s71"}, {"title": "Future and humane orientation", "body": "Future orientation is the level of importance a society attaches to future oriented behaviors such as planning and investing in the future. Humane orientation is the extent to which a society encourages and rewards people for being fair, altruistic, generous, caring and kind.", "example": "Low future orientation: Russia, Argentina. Low humane orientation: Germany, Spain.", "src": "L2 s68, s70-71"}, {"title": "GLOBE country results", "body": "Slide 71 lists highest and lowest countries per dimension. Power distance: highest Russia and Spain, lowest Denmark and Netherlands. Uncertainty avoidance: highest Austria and Denmark, lowest Russia and Hungary. Collectivism/societal: highest Denmark and Singapore, lowest Greece and Hungary. In-group collectivism: highest Egypt and China, lowest Denmark and Netherlands. Gender differentiation: highest South Korea and Egypt, lowest Sweden and Denmark.", "example": "Slides 69-70 and 71 disagree on some high lists, so trust the low lists on the assertiveness, performance and future cards.", "src": "L2 s69-71"}, {"title": "The ten GLOBE clusters", "body": "The ten clusters are Anglo, Latin America, Latin Europe, Eastern Europe, Germanic Europe, Nordic Europe, Sub-Sahara Africa, Arab, Southern Asia and Confucian Asia. The slide is Exhibit 3-4, Geographic Culture Clusters. The next two cards list the countries as the slide shows them.", "example": "Source: GLOBE data, Gupta, Hanges and Dorfman (2002).", "src": "L2 s73"}, {"title": "Cluster members, part 1", "body": "Anglo: Australia, Canada, England, Ireland, New Zealand, South Africa, United States. Latin America: Argentina, Bolivia, Brazil, Colombia, Costa Rica, Ecuador, El Salvador, Guatemala, Mexico, Venezuela. Latin Europe: France, Israel, Italy, Portugal, Spain, Switzerland (French speaking). Eastern Europe: Albania, Georgia, Greece, Hungary, Kazakhstan, Poland, Russia, Slovenia.", "example": "Israel sits in Latin Europe on this slide, and Greece and Russia in Eastern Europe.", "src": "L2 s73"}, {"title": "Cluster members, part 2", "body": "Germanic Europe: Austria, Germany, Netherlands, Switzerland (German speaking). Nordic Europe: Denmark, Finland, Sweden. Sub-Sahara Africa: Nigeria, Zambia, Malawi, South Africa, Namibia, Zimbabwe (Black spots). Arab: Egypt, Kuwait, Morocco, Qatar, Turkey. Southern Asia: India, Indonesia, Iran, Philippines, Malaysia, Thailand. Confucian Asia: China, Hong Kong, Japan, Singapore, Taiwan, South Korea.", "example": "Turkey is in the Arab cluster. Japan is in Confucian Asia.", "src": "L2 s73"}, {"title": "Radar chart and overlapping models", "body": "Slide 72 compares managerial perspectives in the US and Brazil on a radar chart, to show GLOBE can compare country profiles. Slide 74 shows the six models overlap on themes: power and status, group and individuals, relationship with environment, time, individual and social control, and other. Time appears in five of the six models.", "example": "GLOBE has the most dimensions on relationship with environment (3).", "src": "L2 s72, s74"}]}, {"id": "l2-practice", "title": "Values in practice and the three cases", "cards": [{"title": "Four critical value differences", "body": "Four operational value differences matter for managers. Time: differences in temporal values. Change: control and pace of change. Material factors: physical goods and status symbols versus aesthetics and the spiritual side. Individualism: me or I versus we.", "example": "Four items: time, change, material factors, individualism.", "src": "L2 s75"}, {"title": "Time and change", "body": "To Americans, time is money and schedules are strictly kept. In Latin America the word for tomorrow means sometime in the future. Western people generally believe an individual can control the future and manipulate events. Many non-Western societies believe in destiny or the will of their God, and tend to be passive and hostile toward change.", "example": "A Chinese worker may read a change to power machinery as dissatisfaction with his father's way of life.", "src": "L2 s76"}, {"title": "Material focus and individualism", "body": "Americans tend to value physical goods and status symbols. Many non-Westerners worship nature as their religious belief and value the aesthetic and spiritual side instead. In the US, individual achievement takes precedence, with a focus on I. In countries like China there is more emphasis on conformity and cooperation.", "example": "US: focus on I. China: conformity and cooperation.", "src": "L2 s76"}, {"title": "The Internet and culture", "body": "98 percent of Korean homes have high-speed Internet service. Technology is changing culture, especially associations, education and the economy. Culture also changes how technology is used. The US collects a great deal of consumer information. In Sweden and many other European countries the government closely monitors the use and sharing of consumer data.", "example": "The Swedish airline example shows privacy protection and suggests some degree of uncertainty avoidance.", "src": "L2 s77"}, {"title": "Japan: comparative management", "body": "Japan: wa, meaning peace and harmony. A mix of authoritarian and humanism in the workplace. Emphasis on participative management, consensus and duty. Open expression and conflict are discouraged.", "example": "Wa links to the Tom Forrest case: open conflict in a meeting breaks harmony.", "src": "L2 s78"}, {"title": "Germany: comparative management", "body": "Germany: preference for rules and order, and privacy. Dislike of inefficiency and tardiness. Assertive, but not aggressive. Organizations are centralized but still favor consensus decision making.", "example": "Dislike of inefficiency and tardiness fits the Fred Wagner case in Frankfurt.", "src": "L2 s78"}, {"title": "South Korea: comparative management", "body": "South Korea: respect for family, authority, formality and class. People are demonstrative, friendly, aggressive and hard-working. Connections are vital for business, and most contracts are oral. Honest criticism is rare.", "example": "Most contracts are oral; connections are vital.", "src": "L2 s79"}, {"title": "Latin America: comparative management", "body": "Latin America is not homogenous, but has common similarities. It is being-oriented compared with doing-oriented. Work and private lives are more closely integrated. It is very important to maintain harmony and save face.", "example": "Harmony and saving face are very important; work and private lives are closely integrated.", "src": "L2 s79"}, {"title": "Saudi Arabia: management style", "body": "The slide links three roots to three styles. Tribalism leads to paternalism and nepotism. Close friendships lead to person-orientation and Theory Y. Honor and shame lead to conflict avoidance and positive reinforcement.", "example": "Honor and shame lead to conflict avoidance and positive reinforcement.", "src": "L2 s80"}, {"title": "Chinese family business", "body": "Small, family businesses predominate. Guanxi connections matter. People are put ahead of business. Organizations do not include middle management.", "example": "Four features: family businesses, guanxi, people before business, no middle management.", "src": "L2 s81"}, {"title": "The three cases", "body": "Three cases ask what went wrong. Bill Nugent waited for a Saudi official and met small talk. Tom Forrest defended a plan in a Japanese meeting and the joint venture ended. Fred Wagner opened a Frankfurt presentation with humorous anecdotes and lost the distributor. Link each to the culture's slide concepts.", "example": "Questions on the slides: how might you help Bill; how could you help Tom; what went wrong for Fred.", "src": "L2 s82-86"}]}, {"id": "l3-process", "title": "The communication process", "cards": [{"title": "Five learning goals", "body": "The lecture has five goals. Recognize the cultural variables in the communication process and what causes 'noise'. Be aware of differences in non-verbal behaviors, context and attitudes. Understand Western-Arab communications. Be aware of the impact of IT and AI on cross-border communications. Learn how to manage cross-cultural communications.", "example": "Goal 1 asks what factors can cause 'noise' in the communication process.", "src": "L3 s2"}, {"title": "Opening profile: Google", "body": "Google Street View was frozen in Germany for 12 years (2011 to 2023) after about 244,000 households asked for their homes to be blurred. EU regulators (now the European Data Protection Board, under GDPR) keep challenging US tech data practices. The slide says there is a big difference in the culture of privacy between the US and Europe.", "example": "Meta was fined 1.2 billion euros in 2023. TikTok was fined 530 million euros in 2025.", "src": "L3 s3-4"}, {"title": "Why communication matters", "body": "The opening profile shows that communication is a critical factor in cross-cultural management issues. This is true most of all for interpersonal issues. The slide names four: motivation, leadership, group interactions and negotiation.", "example": "The case is titled Google's Internet Communication clash.", "src": "L3 s4"}, {"title": "The communication process", "body": "Exhibit 4-1 has three parts. The sender encodes meaning, the medium carries the message, and the receiver decodes the meaning. Noise acts on all three parts. Culture is the source that feeds the noise. Feedback runs from the receiver back to the sender.", "example": "Sender, medium, receiver: noise on all three, feedback back to the sender.", "src": "L3 s5"}, {"title": "Cultural noise", "body": "Intercultural communication occurs when a member of one culture sends a message to a member of another culture. The message holds the meaning the encoder intended. But the decoder's culture becomes part of the meaning when he or she interprets it.", "example": "The decoder's culture ends up becoming part of the meaning.", "src": "L3 s7"}, {"title": "Attribution", "body": "Attribution is the process in which people look for an explanation of another person's behavior. When someone does not understand another, he or she usually blames the confusion on the other's 'stupidity or craziness'. In the Greek case, each side explains the same behavior through its own culture.", "example": "Greek says 'I don't know. How long should it take?' and the American thinks: He refuses to take responsibility.", "src": "L3 s6-7"}, {"title": "Trust and effective communication", "body": "Effective communication depends on informal understandings among the parties, based on the trust developed between them. When trust exists, there is implicit understanding, cultural differences may be overlooked, and problems are dealt with more easily. The meaning of trust and how it is developed vary across societies. Some cultures have a greater propensity to trust.", "example": "Trust creates implicit understanding inside communication.", "src": "L3 s8"}, {"title": "World Values Survey on trust", "body": "The World Values Survey (WVS) studied 90,000 people in 45 societies. Nordic countries rated highest on believing that most people can be trusted. Brazil, Turkey, Romania, Slovenia and Latvia had the lowest trust in people. Business can rest on long-standing or on arm's length relationships.", "example": "High propensity to trust (s10): Nordic countries, China, Canada, United States, Britain. Low: Brazil, Turkey, Romania, Slovenia and Latvia.", "src": "L3 s9-10"}, {"title": "Three guidelines to build trust", "body": "The slide gives three guidelines for cultivating trust. Create a clear and calculated basis for mutual benefit. Improve predictability by striving to resolve conflicts and keeping communication open. Develop mutual bonding through regular socializing and friendly contacts.", "example": "Mutual bonding comes from regular socializing and friendly contacts.", "src": "L3 s9"}, {"title": "GLOBE and communication style", "body": "GLOBE shows which style fits which culture. High performance orientation (US, Switzerland, Germany): direct, explicit, objective information. Low performance orientation (Russia, Greece, Portugal): more indirect approach. Low assertiveness (Sweden, Nordic countries): friendly, two-way discourse. High humane orientation (Ireland, Indonesia, Philippines): avoid conflict, be supportive.", "example": "Sweden is the low-assertiveness example on s11. Ireland is the high humane orientation example.", "src": "L3 s11-12"}]}, {"id": "l3-variables", "title": "Cultural variables and language", "cards": [{"title": "The list of cultural variables", "body": "Cultural variables affect communication via a person's perceptions. The list: attitudes, social organization, thought patterns, roles, language (spoken and written), non verbal communication, and time. Non verbal communication covers kinesic behavior, paralanguage, proxemics and object language. The effects of these variables are interdependent.", "example": "The effects are interdependent: one variable cannot be read alone.", "src": "L3 s13"}, {"title": "Attitudes and stereotyping", "body": "Attitudes underlie our behavior, communication and interpretation. Ethnocentric attitudes are a particular source of noise. Stereotyping occurs when a person assumes that every member of a society or subculture has the same characteristics. Astute managers deal with people as individuals.", "example": "The s14 pic
