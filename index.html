ture for attitudes shows stereotyping.", "src": "L3 s14-15"}, {"title": "Social organization", "body": "The kinds of social organizations we belong to can influence our perceptions. Examples of social organizations are one's nation, tribe, religious sect or profession.", "example": "The s14 picture example is the United Auto Workers (UAW).", "src": "L3 s14-15"}, {"title": "Thought patterns", "body": "The logical progression of reasoning varies widely across cultures. We cannot assume others use the same reasoning processes.", "example": "A Canadian in Thailand assumed double lines on the road meant 'no passing', just as in Canada.", "src": "L3 s15"}, {"title": "Roles", "body": "Cultures differ in what they consider the role of a manager. They also differ on who should make decisions and who has responsibility for what.", "example": "The s16 picture for roles reads: decision making and responsibility.", "src": "L3 s16-17"}, {"title": "Language problems", "body": "When two people do not share a language, problems come from not understanding local idioms, failing to understand body language, or poor translation. Even where people share a language, problems can arise. Managers often deal with workforces that speak a variety of languages, even within a single country.", "example": "Cause named on the slide: increasing diversity.", "src": "L3 s17"}, {"title": "Politeness and 'yes'", "body": "When many Asians say 'yes', it often means only that they have heard you and are too polite to disagree. Politeness and a desire to say only what the listener wants to hear create noise in the communication process in much of the world.", "example": "The s16 picture is titled: when 'yes' doesn't mean 'yes'.", "src": "L3 s16-17, s19"}, {"title": "Language carries culture", "body": "Britain and the US are two nations separated by a common language. Language also conveys cultural and social understanding from one generation to another. The slide's examples: 6000 Arabic words for camels and their parts, and 50 or more classifications of snow used by Inuit peoples. Sometimes how something is said matters more than what is said.", "example": "Inuit peoples of Canada and Greenland: 50 or more classifications of snow.", "src": "L3 s18"}, {"title": "Translation problems", "body": "Translation can be problematic as well. The slide's example is Pepsi. Come Alive with Pepsi was translated into German as Come out of the grave.", "example": "The s16 picture shows 'come out of the grave with Pepsi'.", "src": "L3 s16, s18"}, {"title": "Expressive and instrumental", "body": "Expressive communicators make communication personal by showing emotions openly or using emotional appeals to persuade. Instrumental communicators put emphasis on the content of the communication, not on personal expression.", "example": "Expressive: Russia, Hungary, Poland. Instrumental: Slovenia, Lithuania, Czech Republic.", "src": "L3 s19"}]}, {"id": "l3-nonverbal", "title": "Nonverbal, time and context", "cards": [{"title": "Nonverbal communication", "body": "Nonverbal communication is behavior that communicates without words, though it is often accompanied by words. Nonverbal cues are often said to carry 65-93% of interpreted meaning (a debated estimate). Minor variations in body language, speech rhythms and punctuality often cause mistrust and misperception among cross-cultural parties.", "example": "The slide quotes: 'A picture is worth a thousand words.'", "src": "L3 s20"}, {"title": "Four media of nonverbal", "body": "Kinesic behavior is communication through body movements. Proxemics is the influence of proximity and space on communication, both personal space and office layout. Paralanguage is how something is said rather than the content. Object language (material culture) is communication through material artifacts.", "example": "Oculesics is the slide's example of kinesic behavior.", "src": "L3 s21, s27"}, {"title": "Proxemics and contact", "body": "High-contact cultures stand close, touch a great deal and want a 'close' sensory involvement: South America, Arabs, South Europe. Low-contact cultures have a 'distant' style of body language: North America, Asia, North Europe. Japanese are less haptic (touching) and traditionally bow.", "example": "Handshakes are common with foreigners, says the slide, although Japanese traditionally bow.", "src": "L3 s21, s25"}, {"title": "Space, power and climate", "body": "Space communicates power in the US and Germany. French executives show their central position by working in the middle of subordinates. Cooler climates and individualistic cultures: low-contact, low context, monochronic, linear active. Warmer climates and collectivistic cultures: high-contact, high context, polychronic, multi active.", "example": "US executives may have large, private corner offices.", "src": "L3 s25"}, {"title": "Paralanguage and silence", "body": "Paralanguage is how something is said, not the content. It includes rate of speech, tone and inflection of voice, other noises, laughing, yawning and silence. The Chinese tend to spend about 30 seconds thinking before they speak. Americans are comfortable with only 10 to 15 seconds of silence.", "example": "Americans break the silence and offend the Chinese by interrupting his or her chain of thoughts.", "src": "L3 s26"}, {"title": "Three gesture pictures", "body": "Slides 22 to 24 show three pictures: sticking out the tongue, widening of the eyes, and scratching ears and cheeks. The slides do not print the meanings. The classic reading for Chinese culture, not printed on the slide: tongue means surprise, wide eyes mean anger (politely expressed), scratching ears and cheeks means happiness.", "example": "Classic reading, not on the slide: scratching ears and cheeks shows happiness.", "src": "L3 s22-24"}, {"title": "Monochronic and polychronic", "body": "Monochronic cultures (Switzerland, Germany, United States): time is linear and is spent, saved, made up or wasted. People do one thing at a time and are used to short-term relationships. Polychronic cultures (Latin Americans, Arabs): time is nonlinear, many things happen at once, and people matter more than material things.", "example": "Polychronic people may change plans often, hold open meetings and move around.", "src": "L3 s27-28"}, {"title": "Forms of nonverbal communication", "body": "The slide lists eleven forms: facial expression; body posture; gestures with hands, arms, head; interpersonal distance (proxemics); touching and body contact; eye contact; clothing, cosmetics, hairstyle, jewelry; paralanguage (voice pitch, rate of speech, silence); color symbolism; attitude towards time and its use; food symbolism and social use of meals.", "example": "Paralanguage and proxemics appear here as forms, in brackets.", "src": "L3 s29"}, {"title": "High and low context", "body": "Context incorporates many cultural variables and affects the meaning of an interaction. High-context cultures (Asia, Middle East, Africa, Mediterranean): thoughts are not explicit, you read between the lines, style is indirect. Low-context cultures (Germany, Switzerland, US, Scandinavia): media are explicit, thoughts are put in words, style is straight.", "example": "Germans expect detailed information before a decision. Arabs base decisions more on knowledge of the people involved.", "src": "L3 s30"}, {"title": "The context chart", "body": "Exhibit 4-4 (based on Hall and Hall, 1990, and Rosch, 1987) runs from high context (implicit) to low context (explicit). The order: Japan, Middle East, Latin America, Africa, Mediterranean, England, France, North America, Scandinavia, Germany, Switzerland.", "example": "Japan is at the high-context end. Switzerland is at the low-context end.", "src": "L3 s31"}]}, {"id": "l3-manage", "title": "Asians, Arabs, channels and good practice", "cards": [{"title": "Poker face and silence", "body": "Americans put more emphasis on talking, and Asians more on listening. So Asian speakers send subtle cues, and the 'poker face' and 'idiotic smile' seem to Americans to conceal real feelings. To Americans silence is discontinuity. To Asians it is part of communication. Asians may find Americans overly talkative.", "example": "Slide s32 sets the 'Oriental poker face' against the 'American mask of confidence'.", "src": "L3 s32-33"}, {"title": "Arab communication style", "body": "Arabs use loud speech for dramatic effect. Communication is built on friendship, honor and hospitality. Arabs are high-contact communicators, and time is the key in the communication process. Arab culture is one of emotional extremes, shown in flowery language with many adjectives and words for exaggeration.", "example": "The distance Americans prefer can make them seem suspicious and cold to Arabs.", "src": "L3 s34-35"}, {"title": "Arabs: business and time", "body": "Arabs tend to do business with people, not with the organization. Protect the honor of others, do not decline hospitality, expect talk to move from social to business topics and back, and do not criticize in front of others. Arabs are polychronic and believe something happens only if Allah wills it.", "example": "So placing deadlines on activities is inappropriate, and many interruptions should be expected.", "src": "L3 s35"}, {"title": "Suggestions for Arab business", "body": "Five suggestions. Be patient: take the time needed to build relationship and trust. Relationships matter more than the task at hand. Avoid expressing doubts and criticism when others are present. Adapt to the norms of body language. Expect many interruptions in meetings, delays in schedules and changes in plans.", "example": "Relationships matter more than the task at hand.", "src": "L3 s36"}, {"title": "Communication channels", "body": "Channel variables matter for understanding the message: information systems, speed of information flow and use, and informal sources. In the US managers delegate, so information flows from staff to manager. In South America decision-making is centralized, so information flows from the manager downward. Japanese ringi systems decide by consensus.", "example": "High-context: information spreads very rapidly. Low-context: it is focused and controlled and does not flow as freely.", "src": "L3 s37-38"}, {"title": "Japan versus the US", "body": "Americans have a wide public self and give open access to informal sources. The Japanese keep a strong barrier between public and private selves. Japanese ningensei stresses saving and giving face, reciprocity and an underlying distrust of words. Americans are explicit, direct, task oriented and confrontational (adversarial).", "example": "Americans like email, Slack, Teams. The French prefer slower written media, with several exchanges of letters.", "src": "L3 s38-39"}, {"title": "IT: going global, acting local", "body": "Global reach does not necessarily mean global business. The Web is interpersonal but may require greater cultural sensitivity. Technology makes it easy to reach markets, yet companies must adapt e-commerce to local idiosyncrasies. The impersonal web must be adapted to local cultures to build relationships and customer loyalty.", "example": "English is used on ~50% of websites, yet only about 1 in 4 internet users speaks it.", "src": "L3 s40"}, {"title": "Five steps to manage", "body": "One: develop cultural sensitivity, anticipate the receiver's meaning. Two: careful encoding, use words, pictures and gestures, avoid slang and idioms. Three: selective transmission, build relationships, face-to-face if possible. Four: careful decoding of feedback, ask multiple parties. Five: follow-up actions, through action and inaction.", "example": "Without face-to-face, phone calls and teleconferencing may beat email. Contracts are hard: cultures differ on what a contract is.", "src": "L3 s41-43"}, {"title": "Openness and resilience", "body": "Facilitating intercultural communication needs openness and resilience. Openness: open-mindedness, tolerance for ambiguity, extrovertedness. Resilience: internal locus of control, persistence, tolerance for ambiguity, resourcefulness. The three aspects of adaptive change: increased functional fitness, psychological health, intercultural identity.", "example": "Tolerance for ambiguity appears under both openness and resilience.", "src": "L3 s44-45"}, {"title": "Seven effective behaviors", "body": "Behaviors associated with intercultural communication effectiveness: respect, interactive posture, orientation to knowledge, empathy, interaction management, tolerance for ambiguity, and other-oriented role behavior.", "example": "Tolerance for ambiguity is also on the s44 lists of openness and resilience.", "src": "L3 s46"}]}], "glossary": [{"term": "CSR", "meaning": "Corporate social responsibility: a company regulating itself voluntarily, going beyond the legal minimum, and actively monitoring its own compliance with laws, ethics and social norms.", "src": "L1 s6"}, {"term": "Ethics (in this lecture)", "meaning": "The decisions and interactions of individuals. CSR decisions are bigger: made at a higher level and affecting far more people.", "src": "L1 s6"}, {"term": "Social license to operate", "meaning": "What a company keeps by giving back to its host countries (learning goal 5).", "src": "L1 s3"}, {"term": "Moral universalism", "meaning": "A moral standard accepted by all cultures. The slide marks it “preferable”.", "src": "L1 s13"}, {"term": "Ethnocentric approach", "meaning": "Applying the morality used in the home country, regardless of the host country's system of ethics.", "src": "L1 s13"}, {"term": "Ethical relativism", "meaning": "Adopting the local moral code of whatever country the firm operates in. The slide marks it “conflict”.", "src": "L1 s13"}, {"term": "Voluntary industry codes", "meaning": "Where governments have not agreed on binding global rules, industry steps in with voluntary but reputation-critical codes. Examples: Sweatshop Code of Conduct, Responsible Business Alliance, SA8000.", "src": "L1 s14"}, {"term": "Moderators (Robertson and Crittenden)", "meaning": "Macro-level: natural resources, GDP per capita, form of government, political stability. Societal: language, religion, historic traditions. Firm-specific: corporate culture, policies, profit motive.", "src": "L1 s29"}, {"term": "Questionable payments", "meaning": "Political payments, extortion, bribes, or “grease money” to speed up routine transactions.", "src": "L1 s31"}, {"term": "FCPA", "meaning": "US Foreign Corrupt Practices Act. Bans bribing foreign officials to win business. Penalties include heavy fines and prison.", "src": "L1 s32"}, {"term": "Corruption Perceptions Index (CPI)", "meaning": "Transparency International's score from 0 to 100; a higher score means less corrupt. The slide titles it Global Corruption Barometer.", "src": "L1 s33"}, {"term": "Nationalism, protectionism, governmentalism", "meaning": "Nationalism: public opinion favours national goals. Protectionism: partial or full closing of borders with tariff and nontariff barriers. Governmentalism: government policy favours national interests, not market forces.", "src": "L1 s40"}, {"term": "Industrial ecology", "meaning": "Viewing an industrial system together with its environment, to optimise the total materials cycle from virgin material to ultimate disposal.", "src": "L1 s42"}, {"term": "Triple Bottom Line", "meaning": "The three pillars of sustainability: Economic + Social + Environmental.", "src": "L1 s43"}, {"term": "Sustainable development", "meaning": "Development that meets the needs of the current generation without compromising the ability of future generations to meet their own needs.", "src": "L1 s44"}, {"term": "SDGs 1 to 6", "meaning": "1 No poverty, 2 Zero hunger, 3 Good health and well-being, 4 Quality education, 5 Gender equality, 6 Clean water and sanitation.", "src": "L1 s46"}, {"term": "SDGs 7 to 12", "meaning": "7 Affordable and clean energy, 8 Decent work and economic growth, 9 Industry, innovation and infrastructure, 10 Reduced inequalities, 11 Sustainable cities and communities, 12 Responsible consumption and production.", "src": "L1 s46"}, {"term": "SDGs 13 to 17", "meaning": "13 Climate action, 14 Life below water, 15 Life on land, 16 Peace, justice and strong institutions, 17 Partnerships for the goals.", "src": "L1 s46"}, {"term": "Culture", "meaning": "Acquired knowledge that people use to interpret experience and generate social behavior. It forms values, creates attitudes and influences behavior.", "src": "L2 s9"}, {"term": "Six characteristics of culture", "meaning": "Culture is learned, shared, transgenerational, symbolic, patterned and adaptive.", "src": "L2 s10"}, {"term": "Values", "meaning": "Basic convictions about right and wrong, good and bad, important and unimportant. Learned from the culture where a person is educated, and they influence behavior.", "src": "L2 s11"}, {"term": "Schein's three levels", "meaning": "Artefacts and symbols (visible, outer), espoused values (middle), basic underlying assumptions (deepest, unconscious, hard to recognize from within). Also called the onion model.", "src": "L2 s13-16"}, {"term": "Cultural sensitivity", "meaning": "Also cultural empathy: an awareness of and an honest caring about another individual's culture.", "src": "L2 s17"}, {"term": "Convergence", "meaning": "The shifting of individual management styles to become similar to one another, said to come from industrialization and worldwide coordination.", "src": "L2 s18, s21"}, {"term": "Self-reference criterion", "meaning": "The subconscious reference point of one's own cultural values. People understand others only in terms of their own cultures.", "src": "L2 s21"}, {"term": "Parochialism", "meaning": "Expecting people from another country to fall automatically into patterns of behavior common in your own country, as a Frenchman does with France.", "src": "L2 s21"}, {"term": "Ethnocentrism", "meaning": "The attitude of assuming that your own ways of doing things are best, no matter where or under what conditions they are applied.", "src": "L2 s21"}, {"term": "Stereotyping", "meaning": "Lecture 2: A cultural profile that develops tentative expectations, some cultural context, as a backdrop to managing in a specific international setting. Lecture 3: Assuming that every member of a society or subculture has the same characteristics. Astute managers deal with people as individuals.", "src": "L2 s22, L3 s15"}, {"term": "Proxemics", "meaning": "Lecture 2: Hall's term for the amount of space people feel they must set between themselves and others. Zones: intimate 0.45 m, personal 1.2 m, social 3.6 m, public 7.6 m. Lecture 3: The influence of proximity and space on communication: both personal space and office space or layout.", "src": "L2 s29-30, L3 s21, s25"}, {"term": "High context and low context", "meaning": "High context: not just the message matters, relation oriented, information implicitly received. Low context: explicit messages, task oriented, information explicitly conveyed.", "src": "L2 s31-32"}, {"term": "Monochronic and polychronic", "meaning": "Monochronic people do one thing at a time and stick to plans. Polychronic people do many things at once, change plans easily and put people first.", "src": "L2 s33"}, {"term": "Linear-active, multi-active, reactive", "meaning": "Lewis's three categories: linear-active (plans step by step, sticks to facts), multi-active (emotional, people-oriented), reactive (listens, never confronts, must not lose face).", "src": "L2 s38"}, {"term": "Power distance", "meaning": "A society's acceptance of unequal power distribution. High: authority and hierarchy respected, autocratic leaders. Low: superiors and subordinates see one another as equals.", "src": "L2 s47"}, {"term": "Uncertainty avoidance", "meaning": "How far people feel threatened by ambiguous situations. High: strict laws, closely followed procedures, low-risk decisions. Low: comfortable with ambiguity, more risks, more job mobility.", "src": "L2 s47"}, {"term": "Individualism and collectivism", "meaning": "Individualism: looking after yourself and your immediate family only. Collectivism: tight social frameworks, emotional dependence on the organization, strong belief in group decisions.", "src": "L2 s51"}, {"term": "Masculinity and femininity", "meaning": "Masculinity: assertiveness, materialism, lack of concern for others prevail. Femininity: concern for others, relationships and quality of life.", "src": "L2 s51"}, {"term": "Long-term orientation", "meaning": "Keeping links with the past while facing the present and future. Low scorers are normative (traditions, suspicious of change). High scorers are pragmatic (modern education).", "src": "L2 s55"}, {"term": "Indulgence and restraint", "meaning": "The extent to which people try to control desires and impulses. Relatively weak control is Indulgence. Relatively strong control is Restraint.", "src": "L2 s55"}, {"term": "Universalistic and particularistic", "meaning": "Universalistic cultures apply rules and systems objectively, whatever the circumstances. Particularistic cultures stress relationships and apply rules more subjectively.", "src": "L2 s60"}, {"term": "Affective and neutral", "meaning": "Trompenaars: affective or emotional cultures express emotions openly. Neutral cultures do not.", "src": "L2 s60"}, {"term": "Specific, diffuse, achievement, ascription", "meaning": "Specific: work and private life kept apart. Diffuse: work spills over into personal life. Achievement: status from personal results. Ascription: status from class, age, gender.", "src": "L2 s62"}, {"term": "GLOBE", "meaning": "Global Leadership and Organizational Behavior Effectiveness Research Program, founded in 1991 by Robert J. House (Wharton). It uses questionnaires and focuses on leadership behavior.", "src": "L2 s64"}, {"term": "Encoding and decoding", "meaning": "The sender encodes meaning into a message. The receiver decodes the meaning. The medium carries the message between them.", "src": "L3 s5"}, {"term": "Cultural noise", "meaning": "What disturbs a message across cultures. The decoder's culture becomes part of the meaning when he or she interprets the message sent by the encoder.", "src": "L3 s7"}, {"term": "Attribution", "meaning": "The process in which people look for an explanation of another person's behavior.", "src": "L3 s7"}, {"term": "Ethnocentric attitudes", "meaning": "A particular source of noise in communication. They are one of the attitudes that underlie behavior, communication and interpretation.", "src": "L3 s15"}, {"term": "Expressive communicators", "meaning": "People who make communication personal by showing emotions openly or using emotional appeals to persuade. Examples: Russia, Hungary, Poland.", "src": "L3 s19"}, {"term": "Instrumental communicators", "meaning": "People who put emphasis on the content of the communication, not personal expression. Examples: Slovenia, Lithuania, Czech Republic.", "src": "L3 s19"}, {"term": "Kinesic behavior", "meaning": "Communication through body movements. Oculesics (eye behavior) is the slide's example.", "src": "L3 s21"}, {"term": "Paralanguage", "meaning": "How something is said rather than the content: rate of speech, tone and inflection of voice, other noises, laughing, yawning and silence.", "src": "L3 s21, s26"}, {"term": "Object language", "meaning": "Also called material culture: the way we communicate through material artifacts.", "src": "L3 s27"}, {"term": "High-contact and low-contact cultures", "meaning": "High-contact cultures stand close and touch a lot (South America, Arabs, South Europe). Low-contact cultures have a distant body language style (North America, Asia, North Europe). Haptic means touching.", "src": "L3 s21, s25"}, {"term": "Monochronic culture", "meaning": "Time is experienced as linear: spent, saved, made up or wasted. People do one thing at a time. Examples: Switzerland, Germany, United States.", "src": "L3 s27-28"}, {"term": "Polychronic culture", "meaning": "Time is nonlinear. People tolerate many things at once and stress involvement with people. Examples: Latin Americans, Arabs.", "src": "L3 s27-28"}, {"term": "High-context culture", "meaning": "Feelings and thoughts are not said openly. You read between the lines, and style is indirect. Examples: Asia, Middle East, Africa, Mediterranean.", "src": "L3 s30"}, {"term": "Low-context culture", "meaning": "Feelings and thoughts are put into words and information is explicit. Style is straight. Examples: Germany, Switzerland, US, Scandinavia.", "src": "L3 s30"}, {"term": "Ningensei", "meaning": "The Japanese communication style that emphasizes saving and giving face, reciprocity, and an underlying distrust of words and analytic logic.", "src": "L3 s39"}, {"term": "Ringi system", "meaning": "Japanese information and decision system in which decision making is consensual.", "src": "L3 s38"}], "numbers": [{"value": "23,000+", "say": "twenty-three thousand plus", "meaning": "Business participants in the UN Global Compact.", "scope": "2025, 25th anniversary, in 160+ countries", "source": "Lecture 1, slide 15", "src": "L1 s15"}, {"value": "160+", "say": "one hundred sixty plus", "meaning": "Countries with UN Global Compact business participants.", "scope": "2025, 25th anniversary; the same slide gives 23,000+ participants", "source": "Lecture 1, slide 15", "src": "L1 s15"}, {"value": "17", "say": "seventeen", "meaning": "Sustainable Development Goals (SDGs) in the 2030 Agenda, with measurable targets.", "scope": "Agenda 2030, adopted September 2015", "source": "Lecture 1, slide 45", "src": "L1 s45-46"}, {"value": "193", "say": "one hundred ninety-three", "meaning": "Countries that adopted the 2030 Agenda for Sustainable Development.", "scope": "September 2015", "source": "Lecture 1, slide 45", "src": "L1 s45"}, {"value": "1992", "say": "nineteen ninety-two", "meaning": "The Rio conference, after which sustainable development became the main guiding principle.", "scope": "Rio conference, then sustainable development became the main guiding principle (slide 44)", "source": "Lecture 1, slide 44", "src": "L1 s44"}, {"value": "2003", "say": "two thousand three", "meaning": "Year the UN drafted its first CSR guidelines for multinational corporations.", "scope": "UN guidelines for MNCs", "source": "Lecture 1, slide 6", "src": "L1 s6"}, {"value": "1.4B", "say": "one point four billion", "meaning": "Consumers in China, listed as an attraction of doing business there.", "scope": "China, slide 26", "source": "Lecture 1, slide 26", "src": "L1 s26"}, {"value": "89", "say": "eighty-nine", "meaning": "Denmark's score, the highest (least corrupt) on the slide.", "scope": "Corruption Perceptions Index, 2025, scale 0 to 100", "source": "Lecture 1, slide 33", "src": "L1 s33"}, {"value": "42", "say": "forty-two", "meaning": "The global average CPI score, a record low.", "scope": "2025 CPI, 182 countries scored 0 to 100", "source": "Lecture 1, slide 33", "src": "L1 s33"}, {"value": "65", "say": "sixty-five", "meaning": "Lithuania's CPI score, rank 28. The US scored 64, rank 29.", "scope": "2025 CPI, 182 countries scored 0 to 100", "source": "Lecture 1, slide 33", "src": "L1 s33"}, {"value": "116,000 people in 50 countries", "say": "one hundred sixteen thousand people in fifty countries", "meaning": "The size of Hofstede's research.", "scope": "Hofstede's research, all conducted in a single firm, IBM; the slide says interpret with caution", "source": "Lecture 2, slide 45", "src": "L2 s45"}, {"value": "6", "say": "six", "meaning": "The number of Hofstede's cultural dimensions.", "scope": "Power distance, individualism, uncertainty avoidance, masculinity, long-term orientation, indulgence; four were found first", "source": "Lecture 2, slide 44", "src": "L2 s44-45"}, {"value": "1991", "say": "nineteen ninety-one", "meaning": "The year the GLOBE project was founded.", "scope": "By Robert J. House (Wharton)", "source": "Lecture 2, slide 64", "src": "L2 s64"}, {"value": "9", "say": "nine", "meaning": "The number of GLOBE dimensions.", "scope": "GLOBE Project, slide 65", "source": "Lecture 2, slide 65", "src": "L2 s65"}, {"value": "10", "say": "ten", "meaning": "The number of GLOBE geographic culture clusters.", "scope": "GLOBE data, Gupta, Hanges and Dorfman (2002)", "source": "Lecture 2, slide 73", "src": "L2 s73"}, {"value": "7", "say": "seven", "meaning": "The number of Trompenaars dimensions, and also of cultural subsystems and Schwartz value types.", "scope": "Trompenaars and Hampden-Turner: 7 dimensions (s59); 7 subsystems (s24-26); Schwartz: 7 value types (s41)", "source": "Lecture 2, slides 59, 24-26 and 41", "src": "L2 s59, s24-26, s41"}, {"value": "77 percent", "say": "seventy-seven percent", "meaning": "Share of the total workforce that is still foreign-born.", "scope": "Saudi Arabia, as the slide states it", "source": "Lecture 2, slide 5", "src": "L2 s5"}, {"value": "35 percent (up from 17 percent in 2017)", "say": "thirty-five percent, up from seventeen percent in two thousand seventeen", "meaning": "Women's share of the Saudi workforce now, and in 2017.", "scope": "Saudi Arabia, as the slide states it", "source": "Lecture 2, slide 5", "src": "L2 s5"}, {"value": "20 percent", "say": "twenty percent", "meaning": "Share of all businesses that Saudi women own.", "scope": "Saudi Arabia, as the slide states it", "source": "Lecture 2, slide 5", "src": "L2 s5"}, {"value": "98 percent", "say": "ninety-eight percent", "meaning": "Share of Korean homes with high-speed Internet service.", "scope": "South Korea, as the slide states it", "source": "Lecture 2, slide 77", "src": "L2 s77"}, {"value": "0.45 m, 1.2 m, 3.6 m, 7.6 m", "say": "zero point four five, one point two, three point six, seven point six metres", "meaning": "Hall's proxemics zones: intimate, personal, social, public.", "scope": "Up to 1.5 ft, 4 ft, 12 ft, 25 ft", "source": "Lecture 2, slide 30", "src": "L2 s30"}, {"value": "Lithuania 42, 60, 19, 65, 82, 16", "say": "Lithuania: forty-two, sixty, nineteen, sixty-five, eighty-two, sixteen", "meaning": "Lithuania's scores on power distance, individualism, masculinity, uncertainty avoidance, long-term orientation, indulgence.", "scope": "Hofstede Insights chart for China, Japan, Lithuania, US", "source": "Lecture 2, slide 58", "src": "L2 s58"}, {"value": "12 years", "say": "twelve years", "meaning": "How long Google Street View was frozen in Germany.", "scope": "Germany, 2011 to 2023, as the slide states", "source": "Lecture 3, slide 4", "src": "L3 s4"}, {"value": "~244,000", "say": "about two hundred forty-four thousand", "meaning": "Households that asked for their homes to be blurred.", "scope": "Germany, before Street View was frozen, as the slide states", "source": "Lecture 3, slide 4", "src": "L3 s4"}, {"value": "1.2 billion euros", "say": "one point two billion euros", "meaning": "The fine on Meta.", "scope": "2023, EU regulators, as the slide states", "source": "Lecture 3, slide 4", "src": "L3 s4"}, {"value": "530 million euros", "say": "five hundred thirty million euros", "meaning": "The fine on TikTok.", "scope": "2025, EU regulators, as the slide states", "source": "Lecture 3, slide 4", "src": "L3 s4"}, {"value": "90,000 people in 45 societies", "say": "ninety thousand people in forty-five societies", "meaning": "The size of the World Values Survey (WVS) research on trust.", "scope": "WVS, trust in people, as the slide states", "source": "Lecture 3, slide 9", "src": "L3 s9"}, {"value": "65-93%", "say": "sixty-five to ninety-three percent", "meaning": "The share of interpreted meaning that nonverbal cues are often said to carry.", "scope": "The slide marks it as a debated estimate", "source": "Lecture 3, slide 20", "src": "L3 s20"}, {"value": "30 seconds", "say": "thirty seconds", "meaning": "How long the Chinese tend to think before they speak.", "scope": "Chinese tendency, paralanguage slide", "source": "Lecture 3, slide 26", "src": "L3 s26"}, {"value": "10 to 15 seconds", "say": "ten to fifteen seconds", "meaning": "How much silence Americans are comfortable with.", "scope": "Americans, paralanguage slide", "source": "Lecture 3, slide 26", "src": "L3 s26"}, {"value": "~50% and 1 in 4", "say": "about fifty percent, and about one in four", "meaning": "English is used on about 50% of websites, yet only about 1 in 4 internet users speaks it.", "scope": "Websites and internet users, as the slide states", "source": "Lecture 3, slide 40", "src": "L3 s40"}], "plan": ["Read the calm chapters first, one lecture at a time.", "Learn the lessons, one card at a time.", "Do the quiz one lecture at a time, then all of it.", "Practise the open questions: answer, then reveal.", "Before 17:15: go over the numbers once."], "script": {}, "quiz": [{"q": "What is CSR, according to the lecture?", "options": ["A company obeying only the laws of its home country", "A government forcing firms to report their social impact", "A company regulating itself voluntarily, going beyond the legal minimum", "The decisions and interactions of individual employees"], "answer": 2, "why": "Slide 6 defines CSR as voluntary self-regulation beyond the legal minimum. The last option is the slide's definition of ethics, not CSR.", "src": "L1 s6", "lec": 1}, {"q": "In which year did the UN draft its first CSR guidelines for multinational corporations?", "options": ["2003", "1992", "2015", "2024"], "answer": 0, "why": "Slide 6 gives 2003. 1992 is the Rio conference (slide 44) and 2015 is the 2030 Agenda (slide 45).", "src": "L1 s6", "lec": 1}, {"q": "How do CSR decisions differ from ethics, according to slide 6?", "options": ["They are made only by individual employees", "They are required by law in every country", "They affect fewer people but are more personal", "They are made at a higher level and affect far more people"], "answer": 3, "why": "Slide 6: ethics is decisions of individuals, while CSR decisions are bigger. The first wrong option describes ethics.", "src": "L1 s6", "lec": 1}, {"q": "A manager applies her home country's morality in the host country, whatever the local system of ethics. Which approach is this?", "options": ["Moral universalism", "Ethnocentric approach", "Ethical relativism", "Governmentalism"], "answer": 1, "why": "Slide 13: the ethnocentric approach applies home-country morality regardless of the host system. Ethical relativism is the opposite, adopting the local code.", "src": "L1 s13", "lec": 1}, {"q": "A firm adopts the local moral code of whatever country it operates in. Which approach is this?", "options": ["Moral universalism", "Ethical relativism", "Ethnocentric approach", "Industrial ecology"], "answer": 1, "why": "Slide 13 defines ethical relativism as adopting the local moral code. The ethnocentric approach keeps the home-country code.", "src": "L1 s13", "lec": 1}, {"q": "Which of the three approaches on slide 13 is marked “preferable”?", "options": ["Ethnocentric approach", "Ethical relativism", "Social license to operate", "Moral universalism"], "answer": 3, "why": "Slide 13 marks moral universalism as preferable and ethical relativism as “conflict”.", "src": "L1 s13", "lec": 1}, {"q": "What does the Del Monte example in Kenya show?", "options": ["Pineapple farms bring export earnings but take up scarce farmland", "Stitching soccer balls forces a choice between living wages and child labour", "Pesticides banned at home come back as imported food", "Paying mail carriers keeps goods moving"], "answer": 0, "why": "Slide 10: Del Monte brings export earnings but takes scarce farmland. The soccer ball case is the separate Pakistan example on the same slide.", "src": "L1 s10", "lec": 1}, {"q": "Which describes the EU approach to business ethics on slide 11?", "options": ["Clear, universal rules: treat everyone by the same standard", "Profit is the only goal of the firm", "Broader social aims: environment, shared values, relationships", "Business norms have fully converged with the US"], "answer": 2, "why": "Slide 11 gives the EU broader social aims. Clear universal rules are the US approach.", "src": "L1 s11", "lec": 1}, {"q": "Which is one of the three ways to deal with confusion about cross-cultural dilemmas?", "options": ["Reserving senior roles for expatriates", "Entering markets by buying existing firms", "Letting each subsidiary set its own rules", "Adjusting reward systems to reflect the company's commitment to CSR"], "answer": 3, "why": "Slide 12 lists dialog with stakeholders, principles and procedures, and adjusted reward systems. The first two wrong options are criticisms of MNCs from slides 35 and 36.", "src": "L1 s12", "lec": 1}, {"q": "Which code was formerly called the Electronic Industry Code of Conduct?", "options": ["Sweatshop Code of Conduct", "Responsible Business Alliance", "Social Accountability 8000", "UN Global Compact"], "answer": 1, "why": "Slide 14: the Responsible Business Alliance was formerly the Electronic Industry Code of Conduct. The Sweatshop Code is a separate Clinton-era code.", "src": "L1 s14", "lec": 1}, {"q": "Which code is an ISO-style, certifiable labour standard?", "options": ["Sweatshop Code of Conduct", "Responsible Business Alliance", "Social Accountability 8000 (SA8000)", "Getz's integrated codes"], "answer": 2, "why": "Slide 14 describes SA8000 as an ISO-style, certifiable labour standard. The Responsible Business Alliance is an industry self-regulating, with supplier audits.", "src": "L1 s14", "lec": 1}, {"q": "Which is one of the four areas of the UN Global Compact principles?", "options": ["Anti-corruption", "Taxation", "Consumer protection", "Political involvement"], "answer": 0, "why": "Slide 15: human rights, labour, environment and anti-corruption. Consumer protection is an area of the international codes on slide 18, not of the Global Compact.", "src": "L1 s15", "lec": 1}, {"q": "Who is named on the slides for the integrated international codes of conduct (ICC, OECD, ILO, UN)?", "options": ["Getz", "Robertson and Crittenden", "Hofstede", "Huntington"], "answer": 0, "why": "Slide 17 is titled Getz's integrated International Codes of Conduct. Robertson and Crittenden belong to the moral philosophy exhibit on slide 29.", "src": "L1 s17", "lec": 1}, {"q": "Which is one of the five sources in Getz's integrated codes?", "options": ["The OECD Anti-Bribery Convention", "The UN Global Compact", "The OECD Guidelines for Multinational Enterprises", "Social Accountability 8000"], "answer": 2, "why": "Slide 17 lists the OECD Guidelines for Multinational Enterprises. The Anti-Bribery Convention is a different OECD document, on slide 32.", "src": "L1 s17", "lec": 1}, {"q": "Under which of the three code areas does “environmental protection” belong?", "options": ["MNC and Host Governments", "MNC and Public", "MNC and Persons", "MNC and Owners"], "answer": 1, "why": "Slide 18 puts technology transfer and environmental protection under MNC and Public. MNC and Owners is not an area on the slide.", "src": "L1 s18", "lec": 1}, {"q": "Which expectation is listed under employment practices?", "options": ["Ensure local equity participation", "Use local resources and personnel for R&D", "Refrain from improper involvement in local politics", "Give advance notice of plant closures and mitigate effects"], "answer": 3, "why": "Slide 25 lists advance notice of plant closures. Local equity participation is under economic policy (slide 19), and local R&D is under technology transfer (slide 22).", "src": "L1 s25", "lec": 1}, {"q": "Which expectation is listed under economic and development policies for MNC and host government?", "options": ["Supply information on environmental impacts", "Reinvest profits in host countries", "Provide proper labelling and accurate advertising", "Refrain from interfering in intergovernmental relations"], "answer": 1, "why": "Slide 19 includes reinvesting profits in host countries. Information on environmental impacts is under environmental protection (slide 23).", "src": "L1 s19", "lec": 1}, {"q": "Which is listed as an attraction of doing business in China?", "options": ["An EV and green-tech hub", "The largest economy in the world", "The lowest wages in Asia", "Few rules on worker safety"], "answer": 0, "why": "Slide 26 lists a skilled workforce, 1.4B consumers, an EV and green-tech hub, and the 2nd-largest economy. China is not called the largest economy.", "src": "L1 s26", "lec": 1}, {"q": "What is the key difference between gift-giving and bribery on slide 31?", "options": ["Gift-giving is illegal everywhere; bribery is legal in some cultures", "Gift-giving needs a formal complaint; bribery does not", "Gift-giving is paid in cash; bribery is paid in goods", "Gift-giving is open; bribery is secret and transactional"], "answer": 3, "why": "Slide 31 states that gift-giving is open and bribery is secret and transactional. Bribery of officials is illegal everywhere.", "src": "L1 s31", "lec": 1}, {"q": "Which law bans bribing foreign officials to win business, with heavy fines and prison?", "options": ["The OECD Anti-Bribery Convention", "The 2024 Forced Labour Regulation", "The FCPA (US Foreign Corrupt Practices Act)", "The UN Global Compact"], "answer": 2, "why": "Slide 32 describes the FCPA this way. The OECD convention is an agreement signed by countries and is hard to enforce without a formal complaint.", "src": "L1 s32", "lec": 1}, {"q": "What does the 2025 FCPA update on slide 32 remind us of?", "options": ["The FCPA was repealed in 2025", "The OECD convention replaced the FCPA", "Even “universal” rules can shift with politics", "Bribery is legal when tied to cartels"], "answer": 2, "why": "Slide 32: enforcement was paused from February to June 2025, then reopened by the DOJ. It was paused, not repealed.", "src": "L1 s32", "lec": 1}, {"q": "Which country has the highest score (least corrupt) on the 2025 CPI slide?", "options": ["Finland", "Singapore", "New Zealand", "Denmark"], "answer": 3, "why": "Slide 33 lists Denmark with 89. Finland is next with 88.", "src": "L1 s33", "lec": 1}, {"q": "Which country has the lowest score (most corrupt) on the 2025 CPI slide?", "options": ["South Sudan", "Somalia", "Venezuela", "Syria"], "answer": 0, "why": "Slide 33 lists South Sudan with 8. Somalia is next with 9.", "src": "L1 s33", "lec": 1}, {"q": "What score does Lithuania have on the 2025 CPI, according to slide 33?", "options": ["64", "65", "78", "89"], "answer": 1, "why": "Slide 33: Lithuania scores 65 (rank 28). 64 is the US score (rank 29).", "src": "L1 s33", "lec": 1}, {"q": "What should an MNC do, according to slide 34, if ethical problems cannot be resolved?", "options": ["Match the local practice", "Send more expatriate managers", "Ask the host government to change its law", "Withdraw from that market"], "answer": 3, "why": "Slide 34 lists withdrawal from that market as the last policy. Matching local practice is the risk side of the dilemma on slide 31.", "src": "L1 s34", "lec": 1}, {"q": "Which is a common criticism of MNC subsidiary activities?", "options": ["R&D stays at headquarters, limiting genuine technology transfer", "They share ownership equally with local people", "They lower interest rates for domestic firms", "They reserve junior roles for expatriates"], "answer": 0, "why": "Slide 36, criticism 5. On slide 35, MNCs raise interest rates and reserve senior (not junior) roles for expatriates.", "src": "L1 s35-36", "lec": 1}, {"q": "A host country partly or fully closes its borders, using tariff and nontariff barriers, to withstand foreign products. Which concept is this?", "options": ["Nationalism", "Protectionism", "Governmentalism", "Ethical relativism"], "answer": 1, "why": "Slide 40 defines protectionism this way. Nationalism is public opinion against foreign influences, with no border measures.", "src": "L1 s40", "lec": 1}, {"q": "What are the three pillars of the “Triple Bottom Line”?", "options": ["Economic, political and legal", "Social, cultural and technological", "Economic, social and environmental", "Profit, people and policy"], "answer": 2, "why": "Slide 43 gives Economic + Social + Environmental.", "src": "L1 s43", "lec": 1}, {"q": "Which author argued that the great divisions among humankind will be cultural, and called this the clash of civilizations?", "options": ["Edward T. Hall", "Geert Hofstede", "S. P. Huntington", "Edgar Schein"], "answer": 2, "why": "Huntington wrote The Clash of Civilizations (s6). Hall wrote on proxemics and context, and Schein on culture levels, not on conflict between civilizations.", "src": "L2 s6", "lec": 2}, {"q": "Which of these is NOT one of the six characteristics of culture on the slides?", "options": ["Competitive", "Symbolic", "Patterned", "Transgenerational"], "answer": 0, "why": "The six are learned, shared, transgenerational, symbolic, patterned and adaptive (s10). Competitive is not among them.", "src": "L2 s10", "lec": 2}, {"q": "Which level of Schein's model is deeply embedded, self-evident and unconscious, and hard to recognize from within?", "options": ["Artefacts and symbols", "Espoused values", "Heroes", "Basic underlying assumptions"], "answer": 3, "why": "The deepest level is the basic underlying assumptions (s14, s16). Espoused values are the standards and rules an organization makes public.", "src": "L2 s14, s16", "lec": 2}, {"q": "A manager shows awareness of and honest caring about another individual's culture. Which concept is this?", "options": ["Stereotyping", "Cultural sensitivity", "Convergence", "Ethnocentrism"], "answer": 1, "why": "The slide defines cultural sensitivity, or cultural empathy, as awareness plus honest caring (s17). Stereotyping is a tentative profile, not caring.", "src": "L2 s17", "lec": 2}, {"q": "In the Saudi opening profile, about what share of the total workforce is still foreign-born?", "options": ["35 percent", "77 percent", "20 percent", "17 percent"], "answer": 1, "why": "The slide says about 77 percent is foreign-born (s5). 35 percent is women's share of the workforce, and 17 percent was their share in 2017.", "src": "L2 s5", "lec": 2}, {"q": "Individual management styles shift to become similar to one another, through industrialization and worldwide coordination. What is this called?", "options": ["Parochialism", "Stereotyping", "Contingency management", "Convergence"], "answer": 3, "why": "Convergence is the shifting of management styles to become similar (s18, s21). Contingency management means adapting to the local environment (s26).", "src": "L2 s18, s21", "lec": 2}, {"q": "What is the subconscious reference point of one's own cultural values called?", "options": ["Self-reference criterion", "Espoused values", "Cultural sensitivity", "Subculture"], "answer": 0, "why": "The self-reference criterion is the subconscious reference point of one's own cultural values (s21). Espoused values are a Schein level.", "src": "L2 s21", "lec": 2}, {"q": "A Frenchman expects people from another country to fall automatically into patterns of behavior common in France. Which term does the slide use?", "options": ["Ethnocentrism", "Convergence", "Parochialism", "Stereotyping"], "answer": 2, "why": "The slide gives this as the example of parochialism (s21). Ethnocentrism is the attitude that your own ways are best, which the example does not say.", "src": "L2 s21", "lec": 2}, {"q": "A Camay soap commercial (P&G, US) backfired in Japan. Which attitude does the slide link to this example?", "options": ["Convergence", "Cultural sensitivity", "Contingency management", "Ethnocentrism"], "answer": 3, "why": "The slide places the Camay example under ethnocentrism: Japanese viewers saw the man's behavior as bad manners (s21). Cultural sensitivity is awareness and caring about another culture, which the example does not show.", "src": "L2 s21", "lec": 2}, {"q": "Which of these is NOT one of the seven cultural subsystems?", "options": ["Kinship", "Language", "Recreation", "Health system"], "answer": 1, "why": "The seven are kinship, education, economic, political, religion, health and recreation (s24-25). Language is not a subsystem on the slides.", "src": "L2 s24-25", "lec": 2}, {"q": "On the GLOBE results table (slide 71), which two countries have the highest power distance?", "options": ["Denmark and Netherlands", "England and France", "Russia and Spain", "Austria and Denmark"], "answer": 2, "why": "Slide 71 lists Russia and Spain as highest on power distance. Denmark and Netherlands are the lowest, and England and France are in the medium group. Austria and Denmark are highest on uncertainty avoidance.", "src": "L2 s71", "lec": 2}, {"q": "In Hall's proxemics zones, which space reaches up to 3.6 m (12 ft)?", "options": ["Social space", "Intimate space", "Personal space", "Public space"], "answer": 0, "why": "Social space reaches 3.6 m. Personal space reaches 1.2 m, intimate space 0.45 m and public space 7.6 m (s30).", "src": "L2 s30", "lec": 2}, {"q": "Which group is ranked as the most high-context on the slide?", "options": ["Japanese", "Arabic", "English", "German"], "answer": 0, "why": "The ranking from most high-context starts with Japanese, then Arabic (s32). English and German come further down.", "src": "L2 s32", "lec": 2}, {"q": "People change plans often and easily, borrow and lend things often, and build lifetime relationships. Which kind of people is this?", "options": ["Monochronic", "Low-context", "Polychronic", "Linear-active"], "answer": 2, "why": "These are the polychronic traits (s33). Monochronic people adhere religiously to plans and seldom borrow or lend.", "src": "L2 s33", "lec": 2}, {"q": "In Kluckhohn and Strodtbeck's model, which answer belongs to the question about the temporal focus of human activity?", "options": ["Doing", "Past", "Dominant", "Collateral"], "answer": 1, "why": "Temporal focus has future, present and past (s36). Doing belongs to modality of activity and Dominant to relationship to nature.", "src": "L2 s35-36", "lec": 2}, {"q": "A culture listens most of the time, never confronts, must not lose face and treats statements as promises. Which Lewis category is this?", "options": ["Linear-active", "Multi-active", "Polychronic", "Reactive"], "answer": 3, "why": "These are Lewis' reactive traits (s38). Linear-active talks half the time and confronts with logic.", "src": "L2 s38", "lec": 2}, {"q": "On Lewis' triangle, which pair of countries sits at the linear-active corner?", "options": ["Vietnam and Japan", "Hispanic America and Italy", "Germany and Switzerland", "U.S.A. and the Netherlands"], "answer": 2, "why": "Germany and Switzerland are at the linear-active corner (s39). U.S.A. and the Netherlands lie on the side between linear-active and multi-active.", "src": "L2 s39", "lec": 2}, {"q": "Which Schwartz value type did English speaking countries value highly?", "options": ["Mastery", "Harmony", "Embeddedness", "Intellectual autonomy"], "answer": 0, "why": "English speaking countries highly valued Mastery and had higher values on Hierarchy than on Egalitarianism (s42). Embeddedness dominated the Middle East and most of Asia.", "src": "L2 s42", "lec": 2}, {"q": "Which pair is one of the four features Gesteland uses for his cultural groups?", "options": ["Specific and diffuse", "Achievement and ascription", "Sequential and synchronic", "Reserved and expressive"], "answer": 3, "why": "Gesteland uses deal or relationship focus, formal or unformal, polychronic or monochronic, and reserved or expressive (s40). The other pairs are Trompenaars' (s59).", "src": "L2 s40, s59", "lec": 2}, {"q": "Hofstede's research is based on how many people in how many countries?", "options": ["116,000 people in 25 countries", "116,000 people in 50 countries", "50,000 people in 116 countries", "25,000 people in 50 countries"], "answer": 1, "why": "The slide says 116,000 people in 50 countries, all in one firm, IBM (s45).", "src": "L2 s45", "lec": 2}, {"q": "Formal authority and hierarchy are very respected, and leadership tends to be autocratic and centralized. Which Hofstede result is this?", "options": ["High uncertainty avoidance", "High power distance", "High individualism", "High masculinity"], "answer": 1, "why": "This is the slide's description of high power distance cultures (s47). High uncertainty avoidance is about strict laws and low-risk decisions.", "src": "L2 s47", "lec": 2}, {"q": "Which description matches collectivism in Hofstede's model?", "options": ["Looking after yourself and your immediate family only", "Weak control of desires and impulses", "Acceptance of unequal power distribution", "Tight social frameworks and strong belief in group decisions"], "answer": 3, "why": "Collectivism entails tight social frameworks, emotional dependence on the organization and strong belief in group decisions (s51). The first distractor is individualism.", "src": "L2 s51", "lec": 2}, {"q": "According to the slide, what tends to be found in more feminine cultures?", "options": ["Less work-family conflict", "More job stress", "Fewer women in high-level jobs", "A greater need for assertiveness"], "answer": 0, "why": "More feminine cultures have less work-family conflict, less job stress, more women in high-level jobs and a reduced need for assertiveness (s51).", "src": "L2 s51", "lec": 2}, {"q": "Which approach do societies that score high on long-term orientation take?", "options": ["Normative: they prefer time-honoured traditions and view change with suspicion", "Restrained: they control desires and impulses strongly", "Pragmatic: they encourage modern education to prepare for the future", "Hierarchical: they accept unequal power distribution"], "answer": 2, "why": "High scorers are pragmatic (s55). The normative approach describes low scorers on long-term orientation.", "src": "L2 s55", "lec": 2}, {"q": "In Hofstede's wording, what is relatively weak control of desires and impulses called?", "options": ["Restraint", "Femininity", "Collectivism", "Indulgence"], "answer": 3, "why": "Relatively weak control is Indulgence and relatively strong control is Restraint (s55).", "src": "L2 s55", "lec": 2}, {"q": "On the Hofstede Insights chart (slide 58), which of the four countries has the lowest masculinity score?", "options": ["China", "Lithuania", "Japan", "US"], "answer": 1, "why": "Lithuania scores 19 on masculinity. China is 66, Japan 95 and US 62 (s58).", "src": "L2 s58", "lec": 2}, {"q": "Which cultures apply rules and systems objectively, without consideration of individual circumstances?", "options": ["Particularistic cultures", "Diffuse cultures", "Universalistic cultures", "Affective cultures"], "answer": 2, "why": "Universalistic cultures apply rules objectively (s60). Particularistic cultures stress relationships and apply rules more subjectively.", "src": "L2 s60", "lec": 2}, {"q": "In which kind of culture do status and influence come from class, age and gender?", "options": ["Ascription-oriented culture", "Achievement-oriented culture", "Specific culture", "Neutral culture"], "answer": 0, "why": "In ascription-oriented cultures status comes from society: class, age, gender (s62). In achievement-oriented cultures it comes from personal achievement.", "src": "L2 s62", "lec": 2}, {"q": "In which kind of culture do people compartmentalize their work and private lives, and tend to be more open and direct?", "options": ["Specific culture", "Diffuse culture", "Particularistic culture", "Affective culture"], "answer": 0, "why": "The slide says people in specific cultures compartmentalize work and private life (s62). In diffuse cultures work spills over into personal relationships.", "src": "L2 s62", "lec": 2}, {"q": "Who founded the GLOBE project in 1991?", "options": ["Geert Hofstede", "Shalom H. Schwartz", "Robert J. House", "Fons Trompenaars"], "answer": 2, "why": "GLOBE was founded in 1991 by Robert J. House of Wharton (s64). Hofstede's research was done at IBM.", "src": "L2 s64", "lec": 2}, {"q": "Which two countries are low on GLOBE performance orientation?", "options": ["Sweden and New Zealand", "Russia and Argentina", "Hong Kong and Singapore", "Germany and Spain"], "answer": 1, "why": "Russia and Argentina are low on performance orientation on both country slides (s69, s71). Sweden and New Zealand are low on assertiveness, and Germany and Spain are low on humane orientation.", "src": "L2 s69, s71", "lec": 2}, {"q": "Which of these is one of the ten GLOBE geographic culture clusters?", "options": ["Baltic Europe", "Central Asia", "Pacific Islands", "Nordic Europe"], "answer": 3, "why": "Nordic Europe is one of the ten clusters (s73). The other three names are not on the slide.", "src": "L2 s73", "lec": 2}, {"q": "Which concept stands for peace and harmony in the Japanese workplace on the comparative management slide?", "options": ["Guanxi", "Theory Y", "Wa", "Nepotism"], "answer": 2, "why": "The slide gives Japan as wa, peace and harmony (s78). Guanxi belongs to the Chinese family business slide (s81).", "src": "L2 s78, s81", "lec": 2}, {"q": "On the Saudi Arabia slide, what do honor and shame lead to?", "options": ["Conflict avoidance and positive reinforcement", "Person-orientation and Theory Y", "Paternalism and nepotism", "A preference for rules and order"], "answer": 0, "why": "Honor and shame lead to conflict avoidance and positive reinforcement (s80). Close friendships lead to person-orientation and Theory Y, and tribalism to paternalism and nepotism.", "src": "L2 s80", "lec": 2}, {"q": "On the Trompenaars obligation row (universalistic to particularistic), which country stands at the particularistic end?", "options": ["US", "Germany", "Sweden", "Singapore"], "answer": 3, "why": "The row runs US, GER, SWE, UK, IT, FRA, JPN, SPA, SIN, so SIN is at the particularistic end (s61). US, GER and SWE are at the universalistic end.", "src": "L2 s61", "lec": 2}, {"q": "Which authors wrote Variations in Value Orientations (1961)?", "options": ["Trompenaars and Hampden-Turner", "Kluckhohn and Strodtbeck", "Hofstede, Hofstede and Minkov", "Gupta, Hanges and Dorfman"], "answer": 1, "why": "Variations in Value Orientations (1961) is by Kluckhohn and Strodtbeck (s27, s34). Trompenaars and Hampden-Turner wrote Riding the Waves of Culture.", "src": "L2 s27, s34", "lec": 2}, {"q": "In the communication process (Exhibit 4-1), who encodes the meaning?", "options": ["The receiver", "The sender", "The medium", "The feedback"], "answer": 1, "why": "The sender encodes meaning and the receiver decodes it (s5). The medium only carries the message.", "src": "L3 s5", "lec": 3}, {"q": "In the communication process exhibit, what is the source that feeds the noise?", "options": ["The medium itself", "The feedback loop", "The speed of delivery", "Culture"], "answer": 3, "why": "Exhibit 4-1 (s5) shows culture as the source that feeds the noise. Feedback only runs from the receiver back to the sender.", "src": "L3 s5", "lec": 3}, {"q": "Which definition fits attribution?", "options": ["Looking for an explanation of another person's behavior", "Assuming every member of a society has the same characteristics", "Communicating through material artifacts", "Communicating without using words"], "answer": 0, "why": "Attribution is the process of looking for an explanation of another person's behavior (s7). The second option is stereotyping (s15).", "src": "L3 s7, s15", "lec": 3}, {"q": "A Greek employee answers 'I don't know. How long should it take?' What does the American conclude (s6)?", "options": ["I asked for an order.", "He is the boss. Why doesn't he tell me?", "He refuses to take responsibility.", "I asked him to participate."], "answer": 2, "why": "On s6 the American attributes the Greek answer to refusing to take responsibility. 'I asked for an order' is the Greek's own attribution.", "src": "L3 s6", "lec": 3}, {"q": "A manager assumes that every member of a subculture has the same characteristics. Which concept is this?", "options": ["Attribution", "Stereotyping", "Paralanguage", "Polychronism"], "answer": 1, "why": "Stereotyping is assuming that every member of a society or subculture has the same characteristics (s15). Attribution is looking for an explanation of behavior (s7).", "src": "L3 s15", "lec": 3}, {"q": "What did the World Values Survey study on trust (s9)?", "options": ["90,000 people in 45 societies", "45,000 people in 90 societies", "9,000 people in 45 societies", "90,000 people in 54 societies"], "answer": 0, "why": "The WVS studied 90,000 people in 45 societies (s9). The other options swap or change the numbers.", "src": "L3 s9", "lec": 3}, {"q": "Which group rated highest on believing that most people can be trusted (WVS, s9)?", "options": ["Brazil and Turkey", "Romania and Slovenia", "Russia and Greece", "Nordic countries"], "answer": 3, "why": "Nordic countries rated highest (s9). Brazil, Turkey, Romania, Slovenia and Latvia had the lowest trust.", "src": "L3 s9-10", "lec": 3}, {"q": "The Japanese ningensei style of communication emphasizes what (s39)?", "options": ["Quick, explicit, task-oriented messages", "Public disagreement to reach the truth", "Saving and giving face, and reciprocity", "Written letters that build up to the point"], "answer": 2, "why": "Ningensei emphasizes saving and giving face, reciprocity and distrust of words (s39). Public disagreement is avoided, and written letters are the French style.", "src": "L3 s39", "lec": 3}, {"q": "How does the GLOBE slide advise communicating with people high on performance orientation (US, Switzerland, Germany)?", "options": ["Use a more indirect approach", "Present objective information directly and explicitly", "Avoid conflict and be supportive", "Use a friendly, two-way approach"], "answer": 1, "why": "High performance orientation calls for direct, explicit, objective information (s11-12). Indirect is for low performance orientation (Russia, Greece, Portugal).", "src": "L3 s11-12", "lec": 3}, {"q": "In South America decision-making tends to be centralized. Which way does information flow (s38)?", "options": ["From the manager downward", "From staff up to the manager", "Sideways between departments", "Equally in all directions"], "answer": 0, "why": "Centralized decision-making means information flows from the manager downward (s38). The US is the one where staff information flows to the manager, because managers delegate.", "src": "L3 s38", "lec": 3}, {"q": "Which is NOT one of the cultural variables listed on s13?", "options": ["Attitudes", "Roles", "Leadership style", "Time"], "answer": 2, "why": "The s13 list: attitudes, social organization, thought patterns, roles, language, non verbal communication, time. Leadership style is not on it.", "src": "L3 s13", "lec": 3}, {"q": "A Canadian in Thailand thought double lines on the road meant 'no passing'. Which cultural variable is this?", "options": ["Attitudes", "Social organization", "Roles", "Thought patterns"], "answer": 3, "why": "The slide uses this case for thought patterns: the logical progression of reasoning varies across cultures (s15). It is not about attitudes or social organization.", "src": "L3 s15", "lec": 3}, {"q": "Which step of managing cross-cultural communication says to avoid slang, idioms and regional sayings?", "options": ["Careful decoding of feedback", "Careful encoding", "Selective transmission", "Follow-up actions"], "answer": 1, "why": "Careful encoding (s41) says to use words, pictures and gestures and avoid slang, idioms and regional sayings. Decoding is about feedback.", "src": "L3 s41", "lec": 3}, {"q": "When many Asians say 'yes', what does it often mean (s17)?", "options": ["They have heard you and are too polite to disagree", "They agree with the plan", "They want a written contract", "They need more time to decide"], "answer": 0, "why": "The slide says 'yes' often means only that they have heard you and are too polite to disagree (s17). It does not mean agreement.", "src": "L3 s17", "lec": 3}, {"q": "Which countries does s19 give as examples of expressive communicators?", "options": ["Slovenia, Lithuania, Czech Republic", "Sweden, Ireland, Germany", "Russia, Hungary, Poland", "Switzerland, Germany, United States"], "answer": 2, "why": "Expressive communicators: Russia, Hungary, Poland (s19). Slovenia, Lithuania and the Czech Republic are the instrumental examples.", "src": "L3 s19", "lec": 3}, {"q": "Which item does s44 list under resilience?", "options": ["Open-mindedness", "Extrovertedness", "Interaction management", "An internal locus of control"], "answer": 3, "why": "Resilience: internal locus of control, persistence, tolerance for ambiguity, resourcefulness (s44). Open-mindedness and extrovertedness belong to openness.", "src": "L3 s44", "lec": 3}, {"q": "Which term means communication through body movements?", "options": ["Kinesic behavior", "Proxemics", "Paralanguage", "Object language"], "answer": 0, "why": "Kinesic behavior is communication through body movements, for example oculesics (s21). Proxemics is about proximity and space.", "src": "L3 s21", "lec": 3}, {"q": "Which is an example of paralanguage given on s26?", "options": ["Office layout", "Tone and inflection of voice", "Personal space", "Choice of clothing"], "answer": 1, "why": "Paralanguage is how something is said, such as tone and inflection of voice, laughing, yawning and silence (s26). Office layout and personal space are proxemics.", "src": "L3 s21, s26", "lec": 3}, {"q": "How long do the Chinese tend to spend thinking before they speak (s26)?", "options": ["10 to 15 seconds", "About 20 seconds", "About 30 seconds", "About 60 seconds"], "answer": 2, "why": "The Chinese tend to spend about 30 seconds thinking (s26). Ten to fifteen seconds is what Americans are comfortable with.", "src": "L3 s26", "lec": 3}, {"q": "Which group does s25 give as high-contact cultures?", "options": ["South America, Arabs, South Europe", "North America, Asia, North Europe", "Germany, Switzerland, United States", "Scandinavia, England, France"], "answer": 0, "why": "High-contact: South America, Arabs, South Europe (s25). North America, Asia and North Europe are low-contact.", "src": "L3 s25", "lec": 3}, {"q": "English is used on about 50% of websites. What share of internet users speaks it (s40)?", "options": ["About half", "About 3 in 4", "About 9 in 10", "About 1 in 4"], "answer": 3, "why": "Only about 1 in 4 internet users speaks English (s40), so local languages drive growth. The 50% figure is for websites, not for users.", "src": "L3 s40", "lec": 3}, {"q": "Which countries does s27 name as monochronic?", "options": ["Latin Americans and Arabs", "Switzerland, Germany, United States", "Sweden, Ireland, Indonesia", "Russia, Hungary, Poland"], "answer": 1, "why": "Monochronic: Switzerland, Germany, United States (s27). Latin Americans and Arabs are the polychronic examples.", "src": "L3 s27", "lec": 3}, {"q": "In one culture people tolerate many things at once, change plans often and put relationships above material things. Which type is this?", "options": ["Monochronic", "Low-contact", "Polychronic", "Low-context"], "answer": 2, "why": "These are polychronic traits (s28). Monochronic cultures do one thing at a time and see time as linear.", "src": "L3 s28", "lec": 3}, {"q": "In which type of culture does one have to read between the lines (s30)?", "options": ["High-context", "Low-context", "Monochronic", "Low-contact"], "answer": 0, "why": "In high-context cultures feelings and thoughts are not explicit, so you read between the lines (s30). Low-context cultures put thoughts in words.", "src": "L3 s30", "lec": 3}, {"q": "Germans expect detailed information before a business decision. What do Arabs base decisions on more (s30)?", "options": ["Detailed written reports", "The size of the company", "Official contracts", "Knowledge of the people involved"], "answer": 3, "why": "Arabs base decisions more on knowledge of the people involved (s30). Detailed information is the German expectation.", "src": "L3 s30", "lec": 3}, {"q": "On the context chart (Exhibit 4-4, s31), which culture sits at the high-context (implicit) end?", "options": ["Switzerland", "Japan", "Germany", "Scandinavia"], "answer": 1, "why": "The chart runs from Japan (high context) to Switzerland (low context). Germany, Scandinavia and Switzerland are at the explicit end.", "src": "L3 s31", "lec": 3}, {"q": "Why does the slide say it is inappropriate to place deadlines on activities with Arabs (s35)?", "options": ["They treat time as linear and scarce", "They distrust written agreements", "They are polychronic and believe things happen if Allah wills", "They avoid business talk in meetings"], "answer": 2, "why": "Arabs are polychronic and believe something will happen only if Allah wills it (s35). Linear time is the monochronic view.", "src": "L3 s35", "lec": 3}, {"q": "Which is a suggestion for doing business with Arabs (s36)?", "options": ["Set firm deadlines at the first meeting", "Voice doubts and criticism in front of the group", "Keep meetings short and on schedule", "Avoid expressing doubts and criticism when others are present"], "answer": 3, "why": "The slide says to avoid expressing doubts and criticism when others are present (s36). Firm deadlines and tight schedules go against the polychronic style.", "src": "L3 s36", "lec": 3}], "questions": [{"q": "Define CSR and explain how it differs from ethics.", "who": "exam", "answer": "CSR is a company regulating itself voluntarily, going beyond the legal minimum. It means actively monitoring your own compliance with laws, ethics and social norms. Ethics, in this lecture, is the decisions and interactions of individuals. CSR decisions are bigger: they are made at a higher level and affect far more people. CSR weighs the benefit against the harm MNCs create, especially in developing countries. The big question is how much a firm should care about the social effects of its decisions. In 2003 the UN drafted its first CSR guidelines for multinational corporations.", "src": "L1 s6-8"}, {"q": "A company must choose a code of ethics for a subsidiary abroad where local practice differs from home. Explain the three approaches and say which one the lecture prefers.", "who": "exam", "answer": "The lecture gives three approaches for a code of morality and ethics. Moral universalism addresses the need for a moral standard accepted by all cultures, and the slide marks it preferable. The ethnocentric approach applies the morality of the home country, regardless of the host country's system of ethics. Ethical relativism adopts the local moral code of whatever country the firm operates in, and the slide marks it conflict. For the subsidiary, the company should aim for a standard accepted by all cultures, not just copy home or local rules.", "src": "L1 s13"}, {"q": "What is the UN Global Compact? Explain its aims and its areas of principles.", "who": "exam", "answer": "The UN Global Compact aims to mobilize a global movement of sustainable companies and stakeholders to create a sustainable world. It supports companies to do business responsibly by aligning their strategies and operations with 10 Principles on four areas: human rights, labour, environment and anti-corruption. It also asks companies to take strategic actions to advance the SDGs, with an emphasis on collaboration and innovation. The bullets cover human rights, collective bargaining, the elimination of forced labour, the abolition of child labour, non-discrimination in employment, environmental responsibility and work against corruption. In 2025 it had 23,000+ business participants in 160+ countries.", "src": "L1 s15-16"}, {"q": "A manager works in a country where small payments to officials are normal. Use the lecture to explain the dilemma and what the company can do.", "who": "exam", "answer": "Questionable payments are political payments, extortion, bribes or grease money to speed up routine transactions. In some cultures bribery is normal and gift-giving is common. The key difference is that gift-giving is open, while bribery is secret and transactional. Bribery of officials is illegal everywhere, so the manager must choose between sticking to their own standard and risking lost business, or matching local practice and risking the law. The US FCPA bans bribing foreign officials. The company can develop a worldwide code of ethics, build ethical policies into strategy, assess its ethical posture regularly, and withdraw from the market if problems cannot be resolved.", "src": "L1 s31-34"}, {"q": "List and explain the common criticisms of MNC subsidiary activities.", "who": "exam", "answer": "There are nine common criticisms. One: MNCs raise capital locally, which can push up interest rates for domestic firms. Two: subsidiaries are mostly owned by the parent, so host-country people have little control. Three: senior managerial and technical roles go to expatriates, slowing local talent development. Four: technology is not always adapted to local conditions. Five: R&D stays at headquarters, limiting technology transfer. Six: they can fuel demand for luxury goods over essential goods. Seven: they often enter by buying an existing firm. Eight: they can dominate whole industries, raising demand for scarce resources and inflation. Nine: they answer only to home-country shareholders and government.", "src": "L1 s35-37"}, {"q": "Explain sustainability, sustainable development and the 2030 Agenda.", "who": "exam", "answer": "Sustainability means meeting today's needs without compromising tomorrow's resources. Its three pillars, the Triple Bottom Line, are economic, social and environmental. It also includes future generations, biodiversity, human rights, transparency and education. Sustainable development became the main guiding principle after the Rio conference of 1992. It meets the needs of the current generation without compromising future generations, and respects the limited capacity of an ecosystem to absorb human impact. In September 2015, 193 countries adopted the 2030 Agenda, with 17 SDGs and measurable targets, aiming at balanced development that leaves no one behind.", "src": "L1 s43-46"}, {"q": "What does the lecture recommend for MNCs operating in developing countries?", "who": "exam", "answer": "The lecture gives seven recommendations. MNCs should do no intentional harm, including respect for the ecosystem and consumer safety. They should produce more good than harm for the host country. They should contribute through their activity to the host country's development. They should respect the human rights of their employees. As long as local culture does not violate ethical norms, they should respect it and work with it, not against it. They should pay their fair share of taxes. They should cooperate with the local government in developing and enforcing just background institutions.", "src": "L1 s47"}, {"q": "Define culture and explain Schein's three levels.", "who": "exam", "answer": "Culture is acquired knowledge that people use to interpret experience and generate social behavior. It forms values, creates attitudes and influences behavior, and it is learned, shared, transgenerational, symbolic, patterned and adaptive. Edgar Schein's model, also called the onion model, has three levels. Artefacts and symbols are the visible surface, such as logos, architecture, structure, processes and corporate clothing. Espoused values are the standards, values and rules of conduct an organization makes public. Basic underlying assumptions are deeply embedded, self-evident and unconscious, and hard to recognize from within. The outer layer is easy to change, and the deeper the layer, the harder it is to adjust.", "src": "L2 s9-10, s13-16"}, {"q": "List and explain the seven cultural subsystems that influence people and their behaviour.", "who": "exam", "answer": "Cultural subsystems are the parts of a society through which values are communicated and passed down. Kinship guides family relationships: the nuclear family in the US, the extended family in some other countries. Education influences expectations of workers and managers' choices on recruitment, staffing, training and leadership. The economic system influences sourcing, distribution, incentives and reparation of capital. The political system imposes constraints on organizations and their freedom to do business. Religion commonly underlies moral and economic norms. The health system affects productivity, expectations and attitudes toward fitness. Recreation affects work behavior and the perception of the role of work in life.", "src": "L2 s23-26"}, {"q": "Explain Hall's main differences between cultures: context, proxemics and time.", "who": "exam", "answer": "Edward T. Hall named three important differences. Proxemics is the amount of space people feel they must set between themselves and others, with zones from intimate (0.45 m) to public (7.6 m). In low-context cultures messages are explicit and people are task oriented. In high-context cultures not just the message matters, and people are relation oriented. Japanese are the most high-context on the slide and Swiss-German the least. Monochronic people do one thing at a time and adhere to plans. Polychronic people do many things at once, change plans easily and are committed to people and human relationships.", "src": "L2 s29-33"}, {"q": "Describe Lewis' three cultural categories and give a country for each.", "who": "exam", "answer": "Richard D. Lewis (When Cultures Collide) sorts cultures into linear-active, multi-active and reactive. Linear-active people talk half the time, do one thing at a time, plan step by step, stick to facts and put truth before diplomacy. Multi-active people talk most of the time, do several things at once, are emotional and people-oriented, and put feelings before facts. Reactive people listen most of the time, never confront, must not lose face and put diplomacy over truth. On Lewis' triangle the corners are Germany and Switzerland for linear-active, Hispanic America for multi-active and Vietnam for reactive.", "src": "L2 s37-39"}, {"q": "Name Hofstede's six dimensions and explain how his research was done.", "who": "exam", "answer": "Geert Hofstede defined culture in six dimensions: power distance, individualism, uncertainty avoidance, masculinity, long-term orientation and indulgence. Power distance is acceptance of unequal power. Individualism is looking after yourself and your close family, against collectivism. Uncertainty avoidance is feeling threatened by ambiguity. Masculinity is assertiveness and materialism, against femininity's concern for others. Long-term orientation separates normative from pragmatic societies. Indulgence is weak control of desires, against restraint. The research was based on 116,000 people in 50 countries, but all in one firm, IBM, so the results should be interpreted with caution. Example: Lithuania scores 19 on masculinity and 60 on individualism.", "src": "L2 s44-45, s47, s51, s55, s58"}, {"q": "Compare Trompenaars' dimensions with the GLOBE project.", "who": "exam", "answer": "Trompenaars and Hampden-Turner give seven dimensions: universalism vs particularism, neutral vs emotional, specific vs diffuse, achievement vs ascription, sequential vs synchronic, internal vs external control, and individualism vs collectivism. GLOBE, founded in 1991 by Robert J. House, has nine dimensions: uncertainty avoidance, power distance, social collectivism, in-group collectivism, gender egalitarianism, assertiveness, future orientation, performance orientation and humane orientation. GLOBE results correspond generally with Hofstede and Trompenaars. It differs from Hofstede because many researchers studied many companies, while Hofstede worked alone at IBM. GLOBE also groups countries into ten clusters, such as Nordic Europe.", "src": "L2 s59, s64-66
