:root[data-theme="dark"]{

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--t-body);-webkit-font-smoothing:antialiased}
button{margin:0;font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nw{white-space:nowrap}
.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor;stroke:none}
svg circle.trk,svg circle.arc{fill:none}
.ring-svg{transform:rotate(-90deg)}
.arc.is-zero{visibility:hidden}

/* shell */
.app{max-width:var(--col);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(112px + env(safe-area-inset-bottom,0px))}
.screen{display:none}
.screen.is-on{display:block;animation:screenIn var(--dur-quick) var(--ease-quick) both}
@keyframes screenIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.hdr{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;margin-left:calc(-1*var(--gl));margin-right:calc(-1*var(--gr));padding:calc(6px + env(safe-area-inset-top,0px)) var(--gr) 8px var(--gl);background:var(--bg);transition:box-shadow .2s ease}
.hdr.is-scrolled{box-shadow:0 2px 0 var(--border)}
.hdr-title{flex:1;min-width:0;margin:0;font:var(--t-large);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .icon-btn{position:relative;z-index:1}

/* round icon button (LangOS ChunkyIconStyle) */
.icon-btn{--face:var(--surface);--edge:var(--border);--line:var(--border);--ico:var(--muted);flex:none;display:grid;place-items:center;width:44px;height:44px;margin-bottom:var(--lip-sm);padding:0;border:2px solid var(--line);border-radius:50%;background:var(--face);color:var(--ico);box-shadow:0 var(--lip-sm) 0 var(--edge);transition:transform var(--dur-press) var(--ease-press),box-shadow var(--dur-press) var(--ease-press)}
.icon-btn .ic{width:22px;height:22px}
.icon-btn:active{transform:translateY(var(--lip-sm));box-shadow:0 0 0 var(--edge)}
.icon-btn.is-on{--face:var(--green);--edge:var(--green-lip);--line:var(--green);--ico:var(--on-color)}
.icon-btn.sm{position:relative;width:36px;height:36px}.icon-btn.sm .ic{width:18px;height:18px}
.icon-btn.sm::after{content:"";position:absolute;inset:-6px;border-radius:50%}
.slot44{flex:none;width:44px;height:47px}

/* streak badge */
.streak{position:relative;z-index:0;flex:none;display:grid;place-items:center;width:44px;height:44px;margin-bottom:var(--lip-sm);padding:0;border:0;border-radius:50%;background:var(--orange);color:var(--on-color);box-shadow:0 var(--lip-sm) 0 var(--orange-lip)}
.streak .ring-svg{position:absolute;inset:0;width:44px;height:44px}
.streak .trk{stroke:var(--on-color-track);stroke-width:2.5}
.streak .arc{stroke:var(--on-color);stroke-width:2.5;stroke-linecap:round;transition:stroke-dashoffset var(--dur-gentle) var(--ease-gentle)}
.streak .flame{width:22px;height:22px}
.streak::before{content:"";position:absolute;inset:0;z-index:-1;border:2px solid var(--orange);border-radius:50%;opacity:0;pointer-events:none}
.streak.flare{animation:badgeSwell 1350ms both}
.streak.flare .flame{animation:flameFlare 1400ms both}
.streak.flare::before{animation:ripple 1600ms ease-out both}
.streak.flare .arc{animation:ringWiden 1200ms both}
@keyframes badgeSwell{0%{transform:scale(1)}48.1%{transform:scale(1);animation-timing-function:cubic-bezier(.2,.8,.3,1)}64.4%{transform:scale(1.18);animation-timing-function:ease-in-out}77.8%{transform:scale(.97);animation-timing-function:ease-out}100%{transform:scale(1)}}
@keyframes flameFlare{0%{transform:scale(1)}46.4%{transform:scale(1);animation-timing-function:cubic-bezier(.2,.8,.3,1)}64.3%{transform:scale(1.35);animation-timing-function:ease-in-out}78%{transform:scale(.94);animation-timing-function:ease-in-out}90%{transform:scale(1.03);animation-timing-function:ease-out}100%{transform:scale(1)}}
@keyframes ripple{0%{opacity:0;transform:scale(1)}43.7%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.4)}}
@keyframes ringWiden{0%,54%{stroke-width:2.5px}71%{stroke-width:4.5px}100%{stroke-width:2.5px}}

/* chunky button (LangOS ChunkyButtonStyle) */
.btn{--face:var(--green);--edge:var(--green-lip);--line:var(--green);--label:var(--on-color);--l:var(--lip);display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;margin:0 0 var(--l);padding:12px 18px;border:2px solid var(--line);border-radius:var(--r-btn);background:var(--face);color:var(--label);box-shadow:0 var(--l) 0 var(--edge);font:var(--t-button);text-transform:uppercase;letter-spacing:.6px;text-align:center;transition:transform var(--dur-press) var(--ease-press),box-shadow var(--dur-press) var(--ease-press)}
.btn:active{transform:translateY(var(--l));box-shadow:0 0 0 var(--edge)}
.btn .ic{width:20px;height:20px;stroke-width:3}
.btn.plain{--face:var(--surface);--edge:var(--border);--line:var(--border);--label:var(--ink)}
.btn.red{--face:var(--red);--edge:var(--red-lip);--line:var(--red)}
.btn.done-soft{--face:var(--green-soft);--edge:var(--green-line);--line:var(--green-line);--label:var(--accent-text)}
.btn.compact{--l:var(--lip-sm);width:auto;min-height:38px;padding:7px 12px;font:var(--t-button-sm);letter-spacing:.6px}
.btn:disabled{--face:var(--border);--edge:var(--border);--line:var(--border);--label:var(--muted);cursor:default}
.btn:disabled:active{transform:none;box-shadow:0 var(--l) 0 var(--edge)}
.btn-stack{display:flex;flex-direction:column;gap:var(--sp-stack);margin-top:var(--sp-buttons)}

/* card, pill */
.card{background:var(--surface);border:2px solid var(--border);border-radius:var(--r-card);box-shadow:0 var(--lip-sm) 0 var(--border);padding:var(--sp-card);margin-bottom:var(--lip-sm)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1.5px solid var(--border);border-radius:var(--r-pill);background:var(--sunken);color:var(--muted);font:var(--t-caption)}
.pill.go{background:var(--green);border-color:var(--green);color:var(--on-color);font-weight:800;text-transform:uppercase;letter-spacing:.6px}
.pill.soft{background:var(--green-soft);border-color:var(--green-soft);color:var(--accent-text);font-weight:800}

/* pressable rows share this */
.row-press{transition:transform var(--dur-press) var(--ease-press),box-shadow var(--dur-press) var(--ease-press)}
.row-press:active{transform:translateY(var(--lip-sm));box-shadow:0 0 0 var(--border)}

/* gliding picker (LangOS GlidingPicker). Set --n and --i on .seg inline. */
.seg{--g:8px;position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:var(--g);margin:var(--sp-heading) 0 20px}
.seg button{min-height:44px;padding:0 8px;border:2px solid var(--border);border-radius:var(--r-seg);background:var(--sunken);color:var(--muted);font:800 17px/1 var(--font-ui)}
.seg button span{position:relative;z-index:1}
.seg button.is-on{color:var(--accent-text)}
.seg .hl{position:absolute;top:0;left:0;height:100%;width:calc((100% - (var(--n) - 1) * var(--g)) / var(--n));border:2px solid var(--green);border-radius:var(--r-seg);background:var(--green-soft);pointer-events:none;transform:translateX(calc(var(--i) * (100% + var(--g))));transition:transform var(--dur-quick) var(--ease-quick)}
.seg.sm{--g:6px;margin:8px 0 0}
.seg.sm button{min-height:44px;border-radius:12px;font:800 14px/1 var(--font-ui)}
.seg.sm .hl{border-radius:12px}

/* home: pack switcher */
.pack{display:flex;align-items:center;gap:12px;width:100%;margin:var(--sp-heading) 0 19px;padding:12px 14px;text-align:left;background:var(--surface);border:2px solid var(--border);border-radius:var(--r-card);box-shadow:0 var(--lip-sm) 0 var(--border)}
.pack-icon{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--green-soft);color:var(--accent-text)}
.pack-text{flex:1;min-width:0}
.pack-course{display:block;font:var(--t-detail);color:var(--muted)}
.pack-title{display:block;font:var(--t-row)}
.pack .chev{width:20px;height:20px;color:var(--muted)}

/* home: hero */
.hero{padding:var(--sp-hero)}
.hero-top{display:flex;align-items:center;gap:18px;margin-bottom:22px}
.meter{position:relative;flex:none;width:112px;height:112px;padding:0;border:0;background:none;transition:transform var(--dur-quick) var(--ease-quick)}
.meter:active{transform:scale(.97)}
.meter .ring-svg{width:112px;height:112px}
.meter .trk{stroke:var(--border);stroke-width:12}
.meter .arc{stroke:var(--green);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset var(--dur-gentle) var(--ease-gentle)}
.meter-val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.meter-num{font:var(--t-meter);font-variant-numeric:tabular-nums;color:var(--ink)}
.meter-num small{margin-left:1px;font-size:18px;font-weight:800}
.meter-cap{margin-top:3px;font:var(--t-detail);color:var(--muted)}
.count{min-width:0}
.count-label{font:var(--t-detail);color:var(--muted)}
.count-value{margin-top:2px;font:var(--t-count);font-variant-numeric:tabular-nums}
.count-line{display:flex;align-items:center;gap:6px;margin-top:6px;font:600 14px/1.3 var(--font-ui);color:var(--muted)}
.count-line .ic{width:16px;height:16px}
.hero-next{margin:0 0 8px;font:700 15px/1.35 var(--font-ui);color:var(--muted)}
.hero-next b{font-weight:800;color:var(--ink)}
.save-note{margin:10px 0 0;font:var(--t-detail);color:var(--muted)}

/* section heading (heading close to its line) */
.sec{margin-top:var(--sp-section)}
.sec h2{margin:0;font:var(--t-title2)}
.sec p{margin:var(--sp-heading) 0 0;font:var(--t-sub);color:var(--muted)}

/* path */
.unit{display:flex;align-items:flex-start;gap:10px;margin:var(--sp-unit) 0 4px}
.unit-num{flex:none;display:grid;place-items:center;width:26px;height:26px;border:2px solid var(--border);border-radius:50%;background:var(--sunken);color:var(--muted);font:800 13px/1 var(--font-ui)}
.unit-num .ic{width:14px;height:14px;stroke-width:3.5}
.unit.is-done .unit-num{background:var(--green);border-color:var(--green);color:var(--on-color)}
.unit-text{padding-top:2px;font:var(--t-step)}
.node-row{display:grid;grid-template-columns:176px 1fr;align-items:center;width:100%;min-height:96px;padding:0;border:0;background:none;text-align:left}
.node-lane{position:relative;height:96px}
/* The face (64) plus its lip (6) is centred on the ring (r 43, inner edge 40): 5px clear at rest, about 3px at the breathe peak. */
.node-wrap{position:absolute;top:9px;left:calc(56px + var(--x,0px));width:64px;height:70px}

.node-ring{position:absolute;top:-2px;left:calc(42px + var(--x,0px));width:92px;height:92px}
.node-ring .trk{stroke:var(--border);stroke-width:6}
.node-ring .arc{stroke:var(--green);stroke-width:6;stroke-linecap:round}

/* floating tab bar (LangOS TabBar) */

.tabbar-in{position:relative;pointer-events:auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px;max-width:536px;margin:0 auto var(--lip);padding:6px;border:2px solid var(--border);border-radius:var(--r-bar);background:var(--surface);box-shadow:0 var(--lip) 0 var(--border),var(--shadow-bar)}
.tab-hl{position:absolute;top:6px;left:6px;height:54px;border:2px solid var(--green-line);border-radius:var(--r-tab);background:var(--green-soft);transition:transform var(--dur-quick) var(--ease-quick),width var(--dur-quick) var(--ease-quick)}

/* learn: lesson list */
.lrow{display:flex;align-items:center;gap:14px;width:100%;margin:0 0 var(--sp-list);padding:14px;text-align:left;background:var(--surface);border:2px solid var(--border);border-radius:var(--r-card);box-shadow:0 var(--lip-sm) 0 var(--border)}
.mini{flex:none;display:grid;place-items:center;width:52px;height:52px;margin-bottom:var(--lip);border-radius:50%;background:var(--border);color:var(--muted);box-shadow:0 var(--lip) 0 var(--grey-lip);font:900 22px/1 var(--font-ui)}

.word{margin-bottom:var(--sp-list)}
.word b{display:block;font:var(--t-headline)}
.word p{margin:4px 0 0;font:var(--t-callout)}

/* focus sessions: lesson, quiz round, questions round */
.session{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--bg);padding:calc(8px + env(safe-area-inset-top,0px)) var(--gr) calc(14px + env(safe-area-inset-bottom,0px)) var(--gl);overscroll-behavior:contain}
.session-in{display:flex;flex-direction:column;flex:1;min-height:0;width:100%;max-width:528px;margin:0 auto}
.s-top{display:flex;align-items:center;gap:12px;min-height:52px}
.s-mid{flex:1;min-width:0}
.s-body{flex:1;min-height:0;overflow:auto;margin:0 -2px;padding:4px 2px calc(24px + var(--fb-h))}
.dots{display:flex;justify-content:center;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:5px;background:var(--border);transition:width var(--dur-quick) var(--ease-quick),background-color .2s ease}
.dot.seen{background:var(--green)}
.dot.cur{width:26px;background:var(--green)}
.stack{position:relative;margin:18px 0 24px;touch-action:pan-y}
.stack::before,.stack::after{content:"";position:absolute;bottom:-10px;left:12px;right:12px;z-index:1;height:40px;border:2px solid var(--border);border-radius:var(--r-card);background:var(--surface);box-shadow:0 var(--lip-sm) 0 var(--border)}
.stack::after{bottom:-20px;left:26px;right:26px;z-index:0}
.lcard{position:relative;z-index:2;display:flex;flex-direction:column;min-height:clamp(340px,calc(100dvh - 330px),500px);padding:22px 20px;border:2px solid var(--border);border-radius:var(--r-card);background:var(--surface);box-shadow:0 var(--lip-sm) 0 var(--border)}
.lcard.in{animation:cardIn var(--dur-gentle) var(--ease-gentle) both}
.lcard.in-back{animation:cardInBack var(--dur-gentle) var(--ease-gentle) both}
.lcard.ghost-out{position:absolute;top:0;left:0;right:0;z-index:3;pointer-events:none;animation:cardOut 420ms cubic-bezier(.4,0,.6,1) both}
.lcard.ghost-out.to-right{animation-name:cardOutRight}
@keyframes cardIn{from{opacity:.4;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes cardInBack{from{opacity:0;transform:translateX(-40px) rotate(-3deg)}to{opacity:1;transform:none}}
@keyframes cardOut{to{opacity:0;transform:translateX(-115%) rotate(-6deg)}}
@keyframes cardOutRight{to{opacity:0;transform:translateX(115%) rotate(6deg)}}
.kicker{font:var(--t-detail);color:var(--muted)}
.lcard h2{margin:8px 0 10px;font:var(--t-card-title)}

.example{margin-top:auto;padding:12px 14px;border:2px solid var(--border);border-radius:var(--r-box);background:var(--sunken)}

.actions{display:grid;grid-template-columns:1fr 2fr;gap:12px;padding-top:12px}
.actions.even{grid-template-columns:1fr 1fr}

/* LangOS ProgressBar: grows from a 16px starting dot. Set --p (0..1) inline. */
.pbar{position:relative;height:16px;border:2px solid var(--border);border-radius:var(--r-pill);background:var(--sunken)}
.pbar i{position:absolute;top:-2px;left:-2px;bottom:-2px;width:calc(16px + (100% - 12px) * var(--p));border-radius:var(--r-pill);background:var(--green);transition:width var(--dur-gentle) var(--ease-gentle)}
.pbar i::after{content:"";position:absolute;top:3px;left:8px;right:8px;height:4px;border-radius:var(--r-pill);background:var(--shine)}

/* quiz */
.qwrap.in{animation:qIn var(--dur-quick) var(--ease-quick) both}

.q-text{margin:22px 0 20px;font:var(--t-question)}
.opts{display:flex;flex-direction:column;gap:var(--sp-stack)}
.opt{--face:var(--surface);--edge:var(--border);--line:var(--border);--txt:var(--ink);display:flex;align-items:center;gap:12px;width:100%;min-height:58px;margin:0 0 var(--lip);padding:12px 14px;text-align:left;border:2px solid var(--line);border-radius:var(--r-btn);background:var(--face);color:var(--txt);box-shadow:0 var(--lip) 0 var(--edge);font:var(--t-option);transition:transform var(--dur-press) var(--ease-press),box-shadow var(--dur-press) var(--ease-press),background-color .2s ease,border-color .2s ease,color .2s ease,opacity .2s ease}
.opt:active{transform:translateY(var(--lip));box-shadow:0 0 0 var(--edge)}

.opt.bad{--face:var(--red-soft);--edge:var(--red-lip);--line:var(--red);--txt:var(--red-text);animation:shake 360ms ease-out}

.mark{flex:none;display:grid;place-items:center;width:26px;height:26px;margin-left:auto;border-radius:50%;background:var(--green);color:var(--on-color);animation:pop var(--dur-pop) var(--ease-pop) both}

.fb{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:18px var(--gr) calc(14px + env(safe-area-inset-bottom,0px)) var(--gl);background:var(--green-soft);transform:translateY(100%);transition:transform var(--dur-gentle) var(--ease-gentle)}

/* start faces (quiz, questions) */

.qdisc{flex:none;display:grid;place-items:center;width:28px;height:28px;margin-top:1px;border:2px solid var(--border);border-radius:50%;background:var(--sunken);color:var(--muted)}

/* script */

/* read (the calm screen) */
.rprog{position:absolute;left:0;right:0;bottom:-3px;height:3px;background:var(--border)}

.ask p{margin:3px 0 0;font:var(--t-callout)}
.sub-h{margin:4px 0 10px;font:800 15px/1.3 var(--font-ui);color:var(--muted)}
.prow{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 var(--sp-list);padding:12px 14px;text-align:left;background:var(--surface);border:2px solid var(--border);border-radius:var(--r-card);box-shadow:0 var(--lip-sm) 0 var(--border)}
.prow.is-on{border-color:var(--green);background:var(--green-soft);box-shadow:0 var(--lip-sm) 0 var(--green-lip)}

.mring b{position:absolute;inset:0;display:grid;place-items:center;font:800 11px/1 var(--font-ui);color:var(--muted)}
.prow-text{flex:1;min-width:0}
.prow-text .c{display:block;font:var(--t-detail);color:var(--muted)}
.prow-text .t{display:block;font:var(--t-row)}
.prow-text .w{display:block;margin-top:2px;font:600 13px/1.3 var(--font-ui);color:var(--muted)}
.okdisc{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--green);color:var(--on-color)}
.okdisc .ic{width:16px;height:16px;stroke-width:3.5}
.part{margin-top:14px}
.part-row{display:flex;align-items:center;gap:8px;font:700 15px/1.3 var(--font-ui)}
.part-row .v{margin-left:auto;color:var(--muted)}
.part-check{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--green);color:var(--on-color)}
.part-check .ic{width:11px;height:11px;stroke-width:4}
.gbar{height:10px;margin-top:6px;overflow:hidden;border-radius:var(--r-pill);background:var(--sunken)}
.part .gbar{background:var(--border)}
.gbar i{display:block;width:calc(var(--p) * 100%);height:100%;border-radius:var(--r-pill);background:var(--green);transition:width var(--dur-gentle) var(--ease-gentle)}
.gbar.orange i{background:var(--orange)}
.foot{margin:10px 0 0;font:500 13px/1.4 var(--font-ui);color:var(--muted)}

/* streak card (LangOS StreakCard) */
.spop-scrim{position:fixed;inset:0;z-index:70;background:var(--scrim);opacity:0;transition:opacity .2s ease}
.spop-scrim.is-open{opacity:1}
.spop{position:fixed;z-index:71;top:calc(var(--hdr-h) - 2px);left:var(--gl);right:var(--gr);max-width:528px;margin:0 auto;transform-origin:calc(100% - 22px) -10px;transform:scale(.6);opacity:0;transition:transform var(--dur-card) var(--ease-card),opacity .2s ease}
.spop.is-open{transform:none;opacity:1}
.s-head{display:flex;align-items:center;gap:12px}
.flame-disc{flex:none;display:grid;place-items:center;width:54px;height:54px;border-radius:50%;background:var(--orange);color:var(--on-color);box-shadow:0 var(--lip-sm) 0 var(--orange-lip)}
.flame-disc .ic{width:28px;height:28px}
.s-title{font:var(--t-title2)}
.s-sub{font:var(--t-sub);color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);margin-top:18px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px}
.day i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--sunken)}
.day.met i{background:var(--orange);color:var(--on-color)}
.day.today:not(.met) i{border:2.5px solid var(--orange);background:none}
.day i .ic{width:14px;height:14px;stroke-width:3.5}
.day span{font:700 12px/1 var(--font-ui);color:var(--muted)}
.day.today span{color:var(--ink)}
.goal{margin-top:18px;padding-top:14px;border-top:2px solid var(--border)}
.goal .part-check{background:var(--orange)}
.lbl{margin-top:14px;font:var(--t-detail);color:var(--muted)}

/* done screen (LangOS DoneMark) */
.done{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;padding:24px 0;text-align:center}
.dm{position:relative;width:96px;height:96px}
.dm .ring-svg{width:96px;height:96px}
.dm .trk{stroke:var(--border);stroke-width:5}
.dm .arc{stroke:var(--green);stroke-width:5;stroke-linecap:round;stroke-dasharray:285.88;stroke-dashoffset:285.88}
.dm .disc{position:absolute;inset:12px;display:grid;place-items:center;border-radius:50%;background:var(--green);color:var(--bg);transform:scale(0)}
.dm .disc .ic{width:36px;height:36px;stroke-width:3.5}
.done h2{margin:16px 0 var(--sp-heading);font:var(--t-title)}
.done p{margin:0;font:var(--t-body);color:var(--muted)}
.done-text,.done .btn-stack{opacity:0;transform:translateY(8px)}
.done .stats{opacity:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;margin-top:20px}
.stat{padding:12px 6px;text-align:center}
.stat b{display:block;font:var(--t-stat);font-variant-numeric:tabular-nums}
.stat span{font:var(--t-caption);color:var(--muted)}
.stat.g b{color:var(--accent-text)}
.new-best{margin-top:12px;opacity:0}
.done.play .dm .arc{stroke-dashoffset:0;transition:stroke-dashoffset 650ms var(--ease-draw)}
.done.play .dm .disc{transform:scale(1);transition:transform var(--dur-pop) var(--ease-pop) 500ms}
.done.play .done-text{opacity:1;transform:none;transition:opacity .4s ease-out 850ms,transform .4s ease-out 850ms}
.done.play .stats{opacity:1;transition:opacity .3s ease-out 1050ms}
.done.play .new-best{animation:popIn var(--dur-pop) var(--ease-pop) 1400ms both}
.done.play .btn-stack{opacity:1;transform:none;transition:opacity .4s ease-out 1000ms,transform .4s ease-out 1000ms}
.done.shown .dm .arc{stroke-dashoffset:0}.done.shown .dm .disc,.done.shown .done-text,.done.shown .btn-stack{transform:none}.done.shown .done-text,.done.shown .stats,.done.shown .btn-stack,.done.shown .new-best{opacity:1}

/* empty and error states */
.empty{display:flex;flex-direction:column;align-items:center;padding:48px 8px 0;text-align:center}
.empty .ic{width:64px;height:64px;stroke-width:2;color:var(--accent-text)}
.empty h2{margin:16px 0 var(--sp-heading);font:var(--t-title2)}
.empty p{max-width:300px;margin:0;font:var(--t-body);color:var(--muted)}
.empty .btn{max-width:320px;margin-top:var(--sp-buttons)}

/* lock page scroll under overlays */
.is-locked,.is-locked body{overflow:hidden}

/* reduced motion: springs become short eases, sliding becomes fading */
@media (prefers-reduced-motion:reduce){
:root{--ease-press:linear;--ease-quick:ease-in-out;--ease-gentle:ease-in-out;--ease-pop:ease-out;--ease-card:ease-in-out;--dur-press:1ms;--dur-quick:150ms;--dur-gentle:200ms;--dur-pop:150ms;--dur-card:200ms}
.screen.is-on{animation-name:fadeIn}
.node-row.is-current .node-wrap,.node-row.just-done .node .ic,.streak.flare,.streak.flare .flame,.streak.flare::before,.streak.flare .arc,.opt.bad{animation:none!important}
.lcard.in,.lcard.in-back,.qwrap.in{animation:fadeIn 200ms ease both}
.lcard.ghost-out{animation:none;display:none}
.sheet,.fb{transform:none;opacity:0;transition:opacity .2s ease}
.sheet.is-open,.fb.is-open{opacity:1}
.spop{transform:none}
.tabbar.is-hidden{transform:none;opacity:0;pointer-events:none;transition:opacity .2s ease}
}

/* extensions: same tokens and values only */
.node-row.is-finish{pointer-events:none}
#screen-read .hdr.is-scrolled{box-shadow:none}
.icon-btn:disabled{opacity:.5}
.node-label .pill{align-self:flex-start}
.chev{flex:none}
.opt .ot{flex:1;min-width:0}
.fact{display:block;width:100%;margin-top:var(--sp-section);text-align:left}
.fact .fact-b{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fact-k{display:flex;align-items:center;gap:8px;font:var(--t-label);color:var(--accent-text)}
.fact-title{margin-top:4px;font:var(--t-headline)}
.fact-b{margin:6px 0 0;font:var(--t-callout)}
.fact-card{margin-bottom:var(--sp-list)}
.fact-card .scope{margin-top:12px}
.fact-card .scope b{color:var(--accent-text)}
.fact-card .fact-more{margin:12px 0 0}
.fact-card .reveal .blk:first-child{margin-top:12px}
.numbers-mark{margin-top:13px}
.crow{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 var(--sp-list);padding:12px 14px;text-align:left;background:var(--surface);border:2px solid var(--border);border-radius:var(--r-card);box-shadow:0 var(--lip-sm) 0 var(--border)}
.cdisc{flex:none;display:grid;place-items:center;width:32px;height:32px;border:2px solid var(--border);border-radius:50%;background:var(--sunken);color:var(--muted);font:800 14px/1 var(--font-ui)}
.cdisc.isread{border-color:var(--green);background:var(--green);color:var(--on-color)}
.cdisc .ic{width:16px;height:16px;stroke-width:3.5}
.crow-t{flex:1;min-width:0;font:var(--t-row)}
.sec-first{margin-top:var(--sp-section)}
.qa-body{padding-top:4px}
.s-body .qa-card .pill{margin-bottom:0}
#streak-card:focus{outline:none}
.done .btn-stack{width:100%;pointer-events:none}
.done.ready .btn-stack,.done.shown .btn-stack{pointer-events:auto}
.is-practising #script-seg{display:none}
.pointer :focus-visible{outline:none}

/* storage notice on Home */
.notice{display:grid;gap:var(--sp-inline);margin-bottom:calc(var(--sp-stack) + var(--lip-sm))}
.notice.warn{border-color:var(--orange);box-shadow:0 var(--lip-sm) 0 var(--orange-lip)}
.notice p{margin:0}
.notice-title{font:800 17px/1.25 var(--font-ui);color:var(--ink)}
.notice-text{font:600 15px/1.45 var(--font-ui);color:var(--muted)}
.notice .btn{width:auto;justify-self:start;margin-top:4px}

<script type="application/json" id="content">{"packs": [{"id": "marketing-seminar-c", "course": "Marketing", "title": "Seminar C: customers and competitors", "date": "2026-10-20T12:00:00+03:00", "place": "Room V, Kaunas Faculty", "part": "Customers and competitors", "lessons": [{"id": "big-picture", "title": "The big picture", "cards": [{"title": "Two circles around a company", "body": "Picture two circles around a company. The inner one is the micro-environment: the players close to it. The outer one is the macro-environment: big forces in society. Kotler, the textbook author your lecture followed, says both shape how well it wins and keeps customers.", "example": "Seminar B was the outer circle. Seminar C is the inner one."}, {"title": "Macro: the outer circle", "body": "The macro-environment is the big forces in society: population, the economy, nature, technology, politics and culture. Your group covered them in seminar B. You wrote the natural and socio-cultural parts.", "example": "Cold Kaunas winters shorten the battery life. That is a natural force."}, {"title": "Micro: the inner circle", "body": "The micro-environment is the players close to the company. Kotler calls them actors: the company itself, its partners and suppliers, the firms that help it sell, its competitors, its publics and its customers. Publics are groups like the media. Your course calls them contact audiences.", "example": "For your product: the official online seller, rival brands and the buyers."}, {"title": "Micro or macro? A quick test", "body": "Ask: is it a specific player around the product, like a buyer, a seller or a rival? Then it is micro. Is it a large force in society, like a law or the weather? Then it is macro.", "example": "A privacy law is macro. A rival that sells privacy is micro."}, {"title": "Your two elements", "body": "Your group split the micro actors. Your groupmates cover partners, suppliers and contact audiences. You cover customers and competitors: who buys this product, and who else is trying to win those same buyers."}, {"title": "Customers, in Kotler's terms", "body": "Customers are the buyers. Kotler sorts them into five markets: consumer, business, reseller, government and international. For Ray-Ban Meta the consumer market is the main one: ordinary people buying glasses for themselves.", "example": "When your script says “this market is growing very fast”, it means this consumer market."}, {"title": "Competitors, in Kotler's terms", "body": "Kotler says a company must give buyers more value than its competitors do, and hold a strong place in buyers' minds against them. So you ask: who else sells to the same buyers, at what price, and with what promise?", "example": "Even Realities' promise is privacy: “Camera-free. By design.”"}]}, {"id": "customers", "title": "Your customers", "cards": [{"title": "Mostly consumers", "body": "Your customers are mostly consumers, people buying for themselves. Resellers, like opticians, buy to sell again. Internationally, the glasses sell in many countries, but Lithuania is not on Meta's supported list. On business and government buyers, the research found almost nothing.", "example": "Your group counts resellers as partners, so they are your groupmates' part."}, {"title": "A market growing fast", "body": "In 2025 more than 7 million AI glasses from Ray-Ban and Oakley were sold. In the two years before that, it was only about 2 million. That jump is why you say the market is growing very fast.", "example": "“The two years before” means 2023 and 2024 added together. Oakley Meta only came out in 2025."}, {"title": "Keep Oakley next to the 7 million", "body": "The 7 million counts the whole line, Ray-Ban and Oakley together. It is not the Wayfarer alone. Saying “the Wayfarer sold 7 million” would be wrong, and a listener could catch it.", "example": "Asked how many were Wayfarers? The group found no source with that split."}, {"title": "Still early adopters", "body": "Sales grow fast, but owners are still a small share. A US survey found only about 5% of adults own smart glasses with a camera, of any brand. Early adopters are the buyers who try a new kind of product before most people do.", "example": "In the same survey, owning them is most common among men and people aged 30 to 44."}, {"title": "Why US data?", "body": "Someone may ask why you use US data. Your answer: the group found no Lithuanian survey on this, and the US one is recent, from August 2026. You already used the German survey in seminar B.", "example": "That German survey points the same way: about half of people there rule out wearing smart glasses."}, {"title": "What owners use most: audio", "body": "Meta says audio has been the most popular feature since day one. Audio means sound from small speakers in the frame, near your ears, like music and podcasts, with no earbuds. Meta gave this as its reason for a Ray-Ban version with no camera."}, {"title": "What owners worry about", "body": "A tech reviewer wrote that many owners love their glasses but worry about how others see them. Some said they would happily buy a pair without a camera, so they are less likely to be called a “creep”. The worry comes from the camera.", "example": "Backup fact: in a small sample of 103 owners in the same US report, one in five said someone reacted badly while they wore them in public."}]}, {"id": "competitors", "title": "Your competitors", "cards": [{"title": "Meta is the giant", "body": "Meta is the biggest smart glasses brand in the world. In the first half of 2026 it shipped 94% of all AI glasses without a screen. Shipped means sent out to be sold. Research companies say the rest is split among many small brands.", "example": "Keep “without a screen” next to the 94%. It counts Oakley too, not only the Wayfarer."}, {"title": "Three kinds of rivals", "body": "Direct rivals sell the same kind of product: other AI glasses, from cheap no-name ones to Even Realities. Meta's own other glasses compete too. Substitutes are different products that meet the same need, like plain sunglasses plus earbuds.", "example": "At the official seller, a plain Ray-Ban Wayfarer was on sale for about 175 euros. The newest smart one started at about 430."}, {"title": "The price sits in the middle", "body": "On price, Ray-Ban Meta sits in the middle. Cheap no-name AI glasses with a camera sit below it. AI glasses with a screen sit above it. On 16 Oct, the newest Wayfarer cost about 430 to 500 euros in Lithuania.", "example": "Below: under 80 euros on a Lithuanian website. Above: about 700 euros."}, {"title": "Meta competes with itself", "body": "The Wayfarer also competes with Meta's other glasses. The sporty Oakley models made up over 30% of Meta's shipments in the last three months of 2025. They sell in the same market, so a buyer who picks an Oakley pair may skip the Wayfarer.", "example": "Marketers call this cannibalisation."}, {"title": "A rival that sells privacy", "body": "Even Realities is a small brand that tries to win with privacy. Its newest glasses have a small screen but no camera. They come with the slogan “Camera-free. By design.” It turns the camera worry from your customers part into a selling point.", "example": "In Kotler's words, it positions itself against Meta in buyers' minds."}, {"title": "Why you end on privacy", "body": "Meta now sells a camera-free Ray-Ban too. But IDC, a research company, says Meta only added privacy steps after people got angry. It says this leaves room for a rival that builds privacy in from the start. The Wayfarer still has a camera.", "example": "Asked which privacy steps? The source only says they came after the backlash."}, {"title": "What about Apple and Google?", "body": "They are future rivals. Apple's glasses are only a report so far: shown in mid 2027 and on sale by the end of 2027. Samsung's glasses, built with Google, had no price when the group checked. Your part looks at rivals people can buy now.", "example": "A groupmate covered Apple and Google in seminar B, so you can point back to that."}]}, {"id": "lithuania", "title": "The Lithuania angle", "cards": [{"title": "Online only", "body": "In Lithuania, the group found no physical store that sells the glasses. As far as you know, they can only be ordered online. So a buyer here has no shop where they can try a pair on first.", "example": "Your script: “Here in Lithuania we could only find the glasses online.”"}, {"title": "Shipped from Italy", "body": "The official seller the group found has no shop in Lithuania. It sends every pair from its optician in Italy. Free delivery usually takes 9 to 15 days.", "example": "Pairs the seller must order from the maker take longer. If the maker has none, it can take 1 to 1.5 months or longer."}, {"title": "Meta AI is not supported here", "body": "Lithuania is not on Meta's list of supported countries, and Lithuanian is not one of Meta AI's languages. So officially, a buyer here does not get the AI assistant. You already said this in seminar B.", "example": "That is why your script says “As we said before”."}, {"title": "What still works", "body": "The seller here describes photos, video, music and calls. As far as we can tell, none of that is the AI assistant. Meta says audio has been the most popular feature since day one. So the product still makes sense here.", "example": "Meta has not published a Lithuania feature list, so say “as far as we found”."}, {"title": "Why this product at all?", "body": "Someone may ask why your group picked a product whose AI is not supported here. Your answer: it is the most popular smart glasses in the world, it is a very controversial one, and Lithuanians can still order it online.", "example": "“Controversial” points to privacy, which you covered in seminar B."}, {"title": "Camera-free options here?", "body": "Meta's Ray-Ban with no camera is not confirmed on sale in Lithuania. The official seller did not list it on 16 Oct. Even Realities' own online store does have a page for Lithuania with prices in euros.", "example": "Handy if someone asks whether privacy rivals matter in Lithuania."}]}, {"id": "product", "title": "Product basics", "cards": [{"title": "What it is", "body": "Ray-Ban Meta Wayfarer looks like classic Ray-Ban sunglasses. The frame carries a camera, microphones and small speakers near your ears, and it comes with an AI assistant. So it is eyewear and a small wearable computer in one.", "example": "The lenses can be sun, clear, polarised or prescription."}, {"title": "Who makes it", "body": "Two companies make it together. Meta supplies the AI, the software and the app. EssilorLuxottica, the company that owns Ray-Ban, designs, makes and sells the frames through its own stores and through opticians.", "example": "The sporty Oakley Meta glasses come from the same partnership."}, {"title": "What it does", "body": "It takes photos and videos hands-free, plays music and handles calls. Where Meta AI is supported, the wearer can ask it questions. In some countries it also translates speech and answers what they are looking at. Meta says the newest lasts up to 9 hours.", "example": "In Lithuania the seller describes the photos, video, music and calls. The AI part is not supported."}, {"title": "No screen", "body": "The Wayfarer has no screen inside the lens. Glasses with a screen are a separate, pricier kind. Meta's own screen glasses cost 899 euros and are not sold in Lithuania.", "example": "This is what “without a screen” next to your 94% means."}, {"title": "The recording light", "body": "A small light on the frame turns on whenever the glasses record, so people nearby can tell. It is the main privacy safeguard. You covered it in seminar B, including people who found ways to switch it off.", "example": "The light has been there since the first pair in 2021, and the newest model still has it."}, {"title": "The generations", "body": "Ray-Ban Stories came first, in 2021. The first Ray-Ban Meta followed in 2023, then Gen 2 in September 2025 and Gen 3 in September 2026. Some sources call the 2021 pair Gen 1, so always say the year.", "example": "Your script's price is for Gen 3. Still open in your group: Gen 2 or Gen 3 for the project."}, {"title": "Keep the sister models apart", "body": "The same partnership also makes sporty Oakley glasses, a Ray-Ban with no camera and glasses with a screen. Facts about those are not facts about the Wayfarer. Always say which model a number belongs to.", "example": "The 7 million includes Oakley, so never call it Wayfarer sales."}]}], "glossary": [{"term": "Micro-environment", "meaning": "The company and the players close to it: partners, suppliers, the firms that help it sell, competitors, publics and customers. Seminar C is about this layer."}, {"term": "Macro-environment", "meaning": "The big forces in society around a company: demographic, economic, natural, technological, political and cultural. Seminar B was about this layer."}, {"term": "Consumer market", "meaning": "Ordinary people buying for their own use. It is one of Kotler's five customer markets, and the main one for Ray-Ban Meta."}, {"term": "Early adopters", "meaning": "An early group of buyers who try a new kind of product before most people do. Your script says smart glasses buyers are still this group."}, {"term": "Market share", "meaning": "A brand's slice of one market. Always name the market: Meta's 94% covers only AI glasses without a screen."}, {"term": "Shipments", "meaning": "Units a maker sends out into the market. These are units sent to sellers, not always units bought by customers. Research companies count them to measure market share. Your 94% and “over 30%” are shares of shipments."}, {"term": "Substitute", "meaning": "A different kind of product that meets the same need. For some buyers, plain sunglasses plus wireless earbuds replace smart glasses."}, {"term": "Positioning", "meaning": "The clear place a brand wants to hold in buyers' minds against its rivals. Even Realities positions itself on privacy."}, {"term": "Competing with your own products", "meaning": "When a company's own products take buyers from each other. Marketers call it cannibalisation. A buyer who picks an Oakley Meta pair may skip the Wayfarer."}, {"term": "AI glasses without a screen", "meaning": "Smart glasses with AI, microphones and speakers (most have a camera too) but no display in the lens, like the Wayfarer. Camera-free audio glasses also count. Glasses with a screen show information in the lens and cost more."}, {"term": "Direct competitor", "meaning": "A brand that sells the same kind of product to the same buyers. For the Wayfarer, that means other AI glasses."}, {"term": "Contact audiences", "meaning": "Your course's name for Kotler's publics, groups that can affect the company, like the media. Your groupmates cover them."}, {"term": "Reseller", "meaning": "A shop or optician that buys products to sell them again. Kotler counts resellers as a customer market, and your group counts them as partners."}], "numbers": [{"value": "more than 7 million", "say": "more than seven million", "meaning": "AI glasses sold in 2025.", "scope": "The year 2025, worldwide. Ray-Ban and Oakley AI glasses together, never the Wayfarer alone. No Wayfarer-only number was found.", "source": "EssilorLuxottica 2025 results and CNBC, 11 Feb 2026"}, {"value": "about 2 million", "say": "about two million", "meaning": "AI glasses sold in the two years before 2025.", "scope": "2023 and 2024 added together. Oakley Meta did not exist yet, so this is the Ray-Ban Meta line only. The 7 million also includes Oakley.", "source": "CNBC, 11 Feb 2026"}, {"value": "about 5%", "say": "about five percent", "meaning": "US adults who own smart glasses with a camera.", "scope": "US adults only, August 2026. Camera smart glasses of any brand, not only Ray-Ban Meta. It is a share of people, not of the 7 million sales.", "source": "Security.org survey, Aug 2026"}, {"value": "30 to 44", "say": "thirty to forty-four", "meaning": "The age group where owning camera smart glasses is most common.", "scope": "Same US survey, all brands of camera smart glasses. Ownership is also highest among men.", "source": "Security.org survey, Aug 2026"}, {"value": "9 to 15 days", "say": "nine to fifteen days", "meaning": "How long free delivery usually takes from the official seller to Lithuania.", "scope": "Free delivery to a parcel locker on orders over 70 euros, from the official online seller, which ships from Italy. Pairs it must order from the maker take longer, and 1 to 1.5 months or longer if the maker's warehouse has none.", "source": "Estheroptica (official online seller), checked 16 Oct 2026"}, {"value": "94%", "say": "ninety-four percent", "meaning": "Meta's share of all AI glasses without a screen shipped worldwide.", "scope": "First half of 2026, worldwide, AI glasses without a screen only. All of Meta's glasses together, Oakley included, not the Wayfarer alone. For all smart glasses, Meta had 82% in the second half of 2025.", "source": "Counterpoint Research, 21 Sep 2026"}, {"value": "under 80 euros", "say": "under eighty euros", "meaning": "The price of cheap no-name AI glasses with a camera.", "scope": "Listings by other sellers on Varle.lt, a Lithuanian marketplace, on 16 Oct 2026. No-name brands, not Ray-Ban Meta.", "source": "Varle.lt, checked 16 Oct 2026"}, {"value": "about 430 to 500 euros", "say": "about four hundred and thirty to five hundred euros", "meaning": "What the newest Wayfarer cost in Lithuania when the group checked.", "scope": "Gen 3 Wayfarer at the official online seller on 16 Oct 2026: 426.55 euros (matte black) up to 502.55 euros (lenses that darken in the sun).", "source": "Estheroptica (official online seller), checked 16 Oct 2026"}, {"value": "about 700 euros", "say": "about seven hundred euros", "meaning": "An example starting price for AI glasses with a screen.", "scope": "Two rivals start at 699 euros: Even Realities' Even G2 and Rokid's screen glasses (Rokid's price is for Germany). Meta's own screen glasses cost 899 euros and are not sold in Lithuania. Other screen glasses cost more.", "source": "Even Realities' store, checked 16 Oct 2026, and heise online, 29 Apr 2026"}, {"value": "over 30%", "say": "over thirty percent", "meaning": "The share of all glasses Meta shipped that were sporty models like the Oakleys.", "scope": "Last three months of 2025. Sporty AI glasses, including the Oakley Meta HSTN and Vanguard, as a share of Meta's own shipments, not of the whole market.", "source": "Counterpoint Research, 27 Feb 2026"}], "plan": ["Learn the five lessons, one card at a time.", "Read your script aloud twice with the 3-minute timer.", "Do the quiz until every answer feels easy.", "Practise the questions: answer out loud, then reveal.", "Read the calm chapters once, slowly, before sleep.", "Before 12:00: read the Numbers list one last time."], "script": {"customers": [{"sentence": "This market is growing very fast.", "fact": "Sales of these AI glasses, Ray-Ban and Oakley together, jumped from about 2 million across 2023 and 2024 combined to more than 7 million in 2025. Meta also said in April 2026 that the number of people using its AI glasses every day had tripled in a year.", "source": "EssilorLuxottica 2025 results and CNBC, 11 Feb 2026. Meta earnings call, 29 Apr 2026.", "question": "Which market do you mean?", "answer": "The consumer market, so normal people buying the glasses for themselves. Out of Kotler's five customer markets, that's the main one for these glasses.", "slide": {"n": 2, "title": "A fast-growing market"}}, {"sentence": "In 2025 more than 7 million AI glasses from Ray-Ban and Oakley were sold.", "fact": "EssilorLuxottica, Ray-Ban's owner and Meta's partner on these glasses, sold more than 7 million AI glasses in 2025. The number counts Ray-Ban Meta and Oakley Meta together, never the Wayfarer alone.", "source": "EssilorLuxottica 2025 results and CNBC, 11 Feb 2026", "question": "How many of those were Wayfarers?", "answer": "We couldn't find that anywhere. The company only gives one number for Ray-Ban and Oakley together, so there's no figure for the Wayfarer alone."}, {"sentence": "In the two years before that it was only about 2 million.", "fact": "About 2 million of these AI glasses were sold across 2023 and 2024 combined, not per year. That's why the jump to more than 7 million in 2025 is so big.", "source": "CNBC, 11 Feb 2026", "question": "Is that 2 million per year?", "answer": "No, that's both years together, 2023 and 2024. Then 2025 alone was more than 7 million."}, {"sentence": "But the buyers are still a small group of early adopters.", "fact": "Early adopters are the first, small group who buy something new before most people do. Only about 5% of US adults own camera smart glasses, so most people haven't bought them yet.", "source": "Security.org survey, Aug 2026 (US)", "question": "What do you mean by early adopters?", "answer": "The first people who buy a new product, before most people do. In Rogers' model of how new products spread, innovators and early adopters are the first 16% of people to adopt. With about 5% of US adults owning camera glasses, I'd say we're still there."}, {"sentence": "A survey in the US found that only about 5% of adults own smart glasses with a camera.", "fact": "A Security.org report from August 2026 found that about 5% of US adults own smart glasses with a built-in camera. It counts every brand, not only Ray-Ban Meta.", "source": "Security.org, Aug 2026. Bitkom (Germany), 21 Aug 2026.", "question": "Why did you use US data?", "answer": "We couldn't find a survey like that for Lithuania. The US one is recent, from August 2026, and it asks who owns camera glasses. We used the German survey in seminar B, and it points the same way: about half of people there rule out wearing them."}, {"sentence": "Owning them is most common among men and among people aged 30 to 44.", "fact": "In the same US survey, ownership was highest among men and among adults aged 30 to 44. It's about all camera smart glasses in the US, not Ray-Ban Meta buyers only.", "source": "Security.org, Aug 2026", "question": "Is it the same in Lithuania?", "answer": "We don't know. We couldn't find any survey of buyers in Lithuania, so the US survey is the best data we found."}, {"sentence": "When it comes to features, Meta says audio has been the most popular one since day one.", "fact": "Meta wrote that \"Audio has been our most popular feature since day one.\" Audio means sound from small speakers in the frame, near your ears, like music and podcasts, with no earbuds.", "source": "Meta announcement, 23 Sep 2026", "question": "Isn't that just Meta praising its own product?", "answer": "It is Meta's own claim. But they acted on it and launched a Ray-Ban version with no camera, with audio as their reason.", "slide": {"n": 3, "title": "What owners say"}}, {"sentence": "A tech reviewer wrote that a lot of owners love their glasses but worry about how others see them.", "fact": "An Engadget review said many owners \"loved their glasses, but were worried about how others might perceive them\". The reviewer heard this in interviews with Meta glasses users, so it is not a survey. In the same Security.org report, a small sample of 103 owners showed that, one in five had got a negative reaction from someone in public while wearing them. The sample is small.", "source": "Engadget, 13 Oct 2026. Security.org, Aug 2026.", "question": "Is that just one reviewer's opinion?", "answer": "It's one reviewer's report of what owners told her, so it's not a survey. But a small owner sample in the same US report points the same way: of about 100 owners asked, one in five said someone reacted badly while they wore them in public."}, {"sentence": "Some even said they would buy a pair without a camera so they wouldn't get called a ''creep''.", "fact": "The same review says some owners would happily buy a pair without cameras if it made them less likely to be labeled a \"creep\". The review was of Meta's new Ray-Ban glasses that have no camera.", "source": "Engadget, 13 Oct 2026", "question": "Did Meta do anything about that?", "answer": "In a way, yes. Meta now sells a Ray-Ban version with no camera, though Meta's own reason is that audio is the most popular feature."}, {"sentence": "Here in Lithuania we could only find the glasses online.", "fact": "The group's search found no physical store in Lithuania that sells these glasses, though some shop websites were hard to search. The main seller says on its website that it has no physical shop in Lithuania, and that activated glasses cannot be returned.", "source": "Group search, and estheroptica.lt, 16 Oct 2026", "question": "So can people try them on before buying?", "answer": "Not in a shop here, as far as we found. You order online and wait for delivery. And the seller says a pair can't be returned once it's activated.", "slide": {"n": 4, "title": "Buying in Lithuania"}}, {"sentence": "The official seller we found sends every pair from Italy, and free delivery usually takes 9 to 15 days.", "fact": "The seller is Estheroptica, which calls itself an official Ray-Ban Meta seller and ships its pairs from its optician in Avezzano, Italy. Free delivery to a parcel locker, on orders over 70 euros, takes 9 to 15 days. Pairs it must order from the maker take longer, and 1 to 1.5 months or longer if the maker has none.", "source": "estheroptica.lt, 16 Oct 2026", "question": "Which seller is that?", "answer": "Estheroptica, an official Ray-Ban Meta seller. It has no shop in Lithuania and sends its pairs from Italy. Other online shops list the glasses too."}, {"sentence": "As we said before, Meta AI isn't supported here.", "fact": "Lithuania is not on Meta's own list of countries where its AI glasses are supported, and Lithuanian is not one of Meta AI's languages. The group already said this in seminar B, so here it only comes up briefly.", "source": "Meta Help Center, supported countries and languages, checked 16 Oct 2026", "question": "What exactly doesn't work here?", "answer": "The AI assistant, so asking it questions or having it describe what you're looking at. Lithuania isn't on Meta's list of supported countries, and Lithuanian isn't one of its languages."}, {"sentence": "But the camera and the audio work, so a Lithuanian buyer still gets the most popular feature.", "fact": "The seller here describes photos, video, music and calls. As far as we can tell, none of that is the AI assistant. Meta says audio is the most popular feature. No official feature list for Lithuania was found, and the group has not tested a pair here.", "source": "Meta, 23 Sep 2026. estheroptica.lt info page, 9 Dec 2025.", "question": "How do you know the camera and audio work without the AI?", "answer": "The seller here describes the glasses for photos, video, music and calls, and none of that is the AI assistant. To be fair, we didn't find an official feature list for Lithuania."}], "competitors": [{"sentence": "Meta is the biggest smart glasses brand in the whole world.", "fact": "Counterpoint Research tracks how many glasses each brand ships. Meta shipped 82% of all smart glasses worldwide in the second half of 2025. Counting all smart glasses, Meta went from over 60% in 2024 to 73% in the first half of 2025 and 82% in the second half, so its lead grew all through 2025. The 94% is a different count, so it stays out of this line.", "source": "Counterpoint Research, 26 Feb 2025, 12 Aug 2025 and 27 Feb 2026", "question": "Biggest by what, sales or money?", "answer": "By the number of glasses shipped, so how many pairs go out to be sold. Counting all smart glasses, Meta had 82% in the second half of 2025.", "slide": {"n": 5, "title": "Meta is the biggest smart glasses brand"}}, {"sentence": "As a matter of fact they shipped 94% of all AI glasses without a screen in the first half of 2026.", "fact": "Counterpoint Research says that from January to June 2026, Meta shipped 94% of all AI glasses without a display worldwide. Glasses with a screen are not in this number.", "source": "Counterpoint Research, 21 Sep 2026", "question": "94% of what exactly?", "answer": "AI glasses without a screen, worldwide, in the first half of 2026. If you count all smart glasses, Meta had 82% in the second half of 2025."}, {"sentence": "All the other brands have very small shares.", "fact": "Counterpoint says \"Outside Meta, the market remains highly fragmented\", meaning it's split between many small brands. IDC found the next four brands after Meta each had under 4% from April to June 2026, in a different count that also includes headsets. Among glasses with a screen, a smaller group, Counterpoint says Chinese brands such as Rokid lead.", "source": "Counterpoint Research, 21 Sep 2026. IDC, 16 Sep 2026.", "question": "Which brands come after Meta?", "answer": "Brands like Xiaomi and Alibaba. In IDC's count, each of the next brands after Meta had under 4%, so nobody is close to Meta."}, {"sentence": "The price of Ray-Ban Meta is in the middle.", "fact": "This compares the Wayfarer with other AI glasses on price. Cheap no-name camera glasses sit below it, and AI glasses with a screen sit above it. Backup if asked about a rival at the same price: in Germany, Rokid sells AI glasses for 449 euros, and the German tech site heise calls them a Ray-Ban Meta rival on technology and price. Ray-Ban Meta Gen 2 started at 419 euros there.", "source": "varle.lt and estheroptica.lt, 16 Oct 2026. evenrealities.com. heise online, 29 Apr 2026.", "question": "In the middle compared to what?", "answer": "Compared to other AI glasses. No-name ones with a camera cost under 80 euros, the newest Wayfarer about 430 to 500, and AI glasses with a screen cost more, for example about 700.", "slide": {"n": 6, "title": "Ray-Ban Meta is in the middle on price"}}, {"sentence": "You can find no-name AI glasses with a camera for under 80 euros on a Lithuanian website.", "fact": "Varle.lt, a Lithuanian online marketplace, listed AI glasses with a camera from small unknown brands for under 80 euros. Other sellers post their products there, so these are third-party listings.", "source": "varle.lt, 16 Oct 2026", "question": "Which website?", "answer": "Varle.lt. It's a Lithuanian marketplace where other sellers list products, and you can find AI camera glasses from unknown brands there for under 80 euros."}, {"sentence": "When we checked, the newest Wayfarer cost about 430 to 500 euros here.", "fact": "The newest Wayfarer is the Gen 3, out since 23 Sep 2026. On 16 Oct 2026 the official seller listed it from 426.55 to 502.55 euros, depending on the lenses.", "source": "estheroptica.lt, 16 Oct 2026", "question": "Why is there a price range?", "answer": "It depends on the lenses. The basic matte black one was about 427 euros, polarised lenses about 455, and lenses that darken in the sun about 503."}, {"sentence": "AI glasses with a screen cost more, for example about 700 euros.", "fact": "These glasses have a small display you see in the lens. Even Realities' Even G2 starts at 699 euros, and Meta's own glasses with a screen cost 899 euros.", "source": "evenrealities.com, Lithuania store page. Road to VR, 23 Sep 2026.", "question": "Can you buy Meta's own screen glasses here?", "answer": "No. They cost 899 euros, and in the EU they're only sold in France, Italy and Germany."}, {"sentence": "The Wayfarer has to compete with Meta's other glasses too.", "fact": "Meta sells other AI glasses besides the Wayfarer, like the sporty Oakley Meta models and a Ray-Ban version with no camera. A buyer who picks one of those may not buy a Wayfarer. In Lithuania the same seller lists Oakley Meta at 464.55 and 521.55 euros.", "source": "Meta announcement, 23 Sep 2026. Counterpoint Research, 27 Feb 2026. estheroptica.lt, 16 Oct 2026.", "question": "Why is Oakley a competitor if it's the same company?", "answer": "Because our product is the Wayfarer, not the whole company. Oakley Meta sits in the same market, and here the same seller sells it too, at similar prices. So a buyer who picks an Oakley pair may skip the Wayfarer.", "slide": {"n": 7, "title": "Where competitors have a chance"}}, {"sentence": "The sporty Oakley models made up over 30% of the glasses Meta shipped in the last three months of 2025.", "fact": "Counterpoint Research says sporty AI glasses, including the Oakley Meta HSTN and Vanguard, together made up over 30% of everything Meta shipped from October to December 2025. Meta's own launch post says HSTN is pronounced “HOW-stuhn”.", "source": "Counterpoint Research, 27 Feb 2026. Meta Newsroom, 20 Jun 2025.", "question": "Which Oakley models?", "answer": "The Oakley Meta HSTN, which Meta says is pronounced “HOW-stuhn”, and the Oakley Meta Vanguard. Sporty glasses like these were over 30% of Meta's shipments in the last three months of 2025."}, {"sentence": "A small brand called Even Realities tries to win with privacy.", "fact": "Even Realities makes smart glasses with a small screen and no camera, and uses that as its selling point. Its website promises \"No recording and social friction\".", "source": "evenrealities.com, checked 16 Oct 2026", "question": "Can you buy their glasses in Lithuania?", "answer": "Yes, their online store has a page for Lithuania with prices in euros. Their newest glasses, the Even G2, start at 699 euros."}, {"sentence": "Their newest glasses come with the slogan ''Camera-free. By design.''", "fact": "The Even G2, launched in November 2025, is sold with the line \"Camera-free. By design.\" A German tech site says it has no speakers or camera, but it does have a small screen. It still has microphones, so say \"no camera\", not \"no recording\".", "source": "evenrealities.com. heise online, 13 Nov 2025.", "question": "Isn't a camera the whole point of smart glasses?", "answer": "Not for everyone. Meta itself says audio is the most popular feature. Even Realities sells having no camera as a plus, so nobody around you gets filmed."}, {"sentence": "Meta now also sells a Ray-Ban version with no camera.", "fact": "Ray-Ban Meta Audio has no camera, costs from 349 dollars, and has been shipping since 13 Oct 2026. Meta's stated reason is that audio is the most popular feature.", "source": "Meta announcement, 23 Sep 2026", "question": "Can you buy that one in Lithuania?", "answer": "Not that we could confirm. The Lithuanian seller didn't list it when we checked on 16 October."}, {"sentence": "But a research company says Meta only added privacy steps after people got angry.", "fact": "IDC, a market research company, wrote that Meta added its privacy steps only after a public backlash, when people got angry. It says this \"leaves room for a competitor willing to build privacy safeguards in before launch\".", "source": "IDC, 16 Sep 2026", "question": "Which privacy steps?", "answer": "The report doesn't name them, only that they came after the backlash. In seminar B we covered one later fix, Meta's July 2026 update for the recording light."}, {"sentence": "The Wayfarer itself still has a camera, so I think privacy is where competitors have a chance against Meta.", "fact": "This last line is your own opinion, built on two facts. The Wayfarer still has a camera, and IDC says Meta's late privacy steps leave room for a rival that builds privacy in from the start.", "source": "IDC, 16 Sep 2026", "question": "Meta sells a version with no camera now. Isn't that gap closed?", "answer": "Partly, but the Wayfarer we analyse still has a camera, and that's what people worry about. A brand that builds privacy in from the start can still use that against Meta."}]}, "quiz": [{"q": "What is the micro-environment?", "options": ["The big forces in society, like the economy and technology", "The actors close to the company, like its customers and competitors", "Only the departments inside the company", "The laws of the countries where it sells"], "answer": 1, "why": "Kotler calls the actors close to the company the micro-environment. The big forces in society are the macro-environment."}, {"q": "Which of these belongs to the macro-environment, not the micro?", "options": ["Customers", "Competitors", "Suppliers", "New technology, like AI"], "answer": 3, "why": "Technology is a big force in society, so it's macro. Customers, competitors and suppliers are actors close to the company."}, {"q": "Which of these is one of Kotler's five customer markets?", "options": ["Supplier market", "Reseller market", "Media market", "Competitor market"], "answer": 1, "why": "The five are consumer, business, reseller, government and international. Resellers buy to sell again, like opticians. Suppliers, competitors and the media are other micro actors, not customer markets."}, {"q": "What are early adopters?", "options": ["An early group who buy something new, before most people", "People who only buy once the price drops", "Shops that start selling a product first"], "answer": 0, "why": "Only about 5% of US adults own camera glasses, so the buyers are still this first small group."}, {"q": "The more than 7 million AI glasses sold in 2025 count...", "options": ["Only the Ray-Ban Meta Wayfarer", "Every smart glasses brand in the world", "Only glasses sold in Europe", "Ray-Ban Meta and Oakley Meta together"], "answer": 3, "why": "It's one number for Ray-Ban and Oakley together. We found no number for the Wayfarer alone."}, {"q": "In 2023 and 2024, about how many of these AI glasses were sold?", "options": ["About 2 million each year", "About 7 million in total", "About 2 million for both years together"], "answer": 2, "why": "About 2 million across both years combined. Then 2025 alone passed 7 million."}, {"q": "A US survey found that about what share of adults own smart glasses with a camera?", "options": ["About 5%", "About 40%", "About 70%"], "answer": 0, "why": "About 5% of US adults own camera glasses, of any brand. So most people have not bought a pair yet, which is why your script calls the buyers early adopters."}, {"q": "According to Meta, which feature has been the most popular since day one?", "options": ["The camera", "The AI assistant", "Audio", "Live translation"], "answer": 2, "why": "Meta wrote on 23 Sep 2026 that audio has been its most popular feature since day one."}, {"q": "Meta AI isn't supported in Lithuania. What does a buyer here still get?", "options": ["Nothing, the glasses need Meta AI to work", "The camera and the audio", "Live translation into Lithuanian"], "answer": 1, "why": "The seller describes photos, video, music and calls. As far as we can tell, none of that is the AI assistant, though no official feature list for Lithuania was found. So a buyer here gets audio, the most popular feature. Lithuanian isn't in live translation."}, {"q": "A new privacy law, and a rival brand that sells privacy. Which is micro and which is macro?", "options": ["Both are micro", "Both are macro", "The law is macro and the rival is micro", "The law is micro and the rival is macro"], "answer": 2, "why": "A law is a big force in society, so it is macro. A rival brand is a player close to the product, so it is micro."}, {"q": "What does Kotler say a company has to do against its competitors?", "options": ["Always sell at a lower price than every rival does", "Only sell in places where no rival sells yet", "Give more value and hold a stronger place in buyers' minds"], "answer": 2, "why": "Kotler says a company has to give buyers more value than its rivals and hold a stronger place in their minds. A lower price alone is not his answer."}, {"q": "What does market share mean?", "options": ["The part of all sales or shipments in a market that one brand has", "The price of a company's shares on the stock market", "How many countries a brand sells in"], "answer": 0, "why": "For example, Meta shipped 94% of all AI glasses without a screen in the first half of 2026."}, {"q": "What does Meta's 94% cover?", "options": ["All smart glasses, with or without a screen", "Only Ray-Ban Meta Wayfarers", "AI glasses without a screen, worldwide, first half of 2026", "All glasses sold in Europe in 2025"], "answer": 2, "why": "It counts only AI glasses without a screen. For all smart glasses, Meta had 82% in the second half of 2025."}, {"q": "What did the newest Wayfarer cost in Lithuania when the group checked?", "options": ["About 175 to 219 euros", "About 430 to 500 euros", "About 700 euros", "About 899 euros"], "answer": 1, "why": "About 430 to 500 euros, depending on the lenses. 175 to 219 euros was a plain Ray-Ban Wayfarer with no tech, and the higher prices are glasses with a screen."}, {"q": "The sporty Oakley models made up over 30% of Meta's shipments in the last three months of 2025. Why does that matter for the Wayfarer?", "options": ["Oakley is a rival company that beat Meta", "Meta's other glasses can take buyers the Wayfarer could have had", "It means the Wayfarer sold 30% more"], "answer": 1, "why": "That's a company competing with its own products. A buyer who picks an Oakley Meta pair may not buy a Wayfarer."}, {"q": "Which brand sells its glasses with the slogan \"Camera-free. By design.\"?", "options": ["Even Realities", "Meta, for its Ray-Ban with no camera", "Oakley"], "answer": 0, "why": "Even Realities sells its newest glasses as camera-free on purpose. Meta also sells a Ray-Ban with no camera, but the slogan is Even Realities'."}, {"q": "What did the research company IDC say about Meta and privacy?", "options": ["Meta built privacy in from the very start", "Meta's privacy steps closed the gap for good", "Meta added privacy steps only after a public backlash"], "answer": 2, "why": "IDC, 16 Sep 2026. That leaves room for a rival that builds privacy in before launch."}, {"q": "Which of these is the clearest substitute for Ray-Ban Meta, a different kind of product for the same need?", "options": ["Rokid's AI glasses", "Oakley Meta glasses", "No-name AI glasses with a camera", "A plain Ray-Ban Wayfarer plus wireless earbuds"], "answer": 3, "why": "A substitute meets the same need in a different way. Seminar B said many people still prefer normal sunglasses with earbuds."}], "questions": [{"q": "What do customers and competitors mean in Kotler's terms?", "who": "lecturer", "answer": "Both are actors in the micro-environment, close to the company. Customers are the buyers, in five markets: consumer, business, reseller, government and international. Competitors sell to the same buyers. Kotler says you have to give more value than they do and hold a stronger place in buyers' minds."}, {"q": "What's the difference between the micro and the macro environment?", "who": "lecturer", "answer": "The micro-environment is the actors close to the company, like its customers, competitors, suppliers and partners. The macro-environment is the bigger forces in society, like the economy, technology, nature, culture and politics. We did the macro side in seminar B, and now we're doing the micro side."}, {"q": "Who is the Wayfarer's biggest competitor?", "who": "classmate", "answer": "Among smart glasses, I'd say Meta's own. Sporty models like the Oakleys were over 30% of what Meta shipped in the last three months of 2025, and other brands are far behind. Outside smart glasses, it's what a groupmate said in seminar B: normal sunglasses plus earbuds."}, {"q": "Why did you use US data and not Lithuanian?", "who": "lecturer", "answer": "We couldn't find a survey like that for Lithuania. The US one is recent, from August 2026, and it asks who owns camera glasses. We used the German survey in seminar B, and it points the same way: about half of people there rule out wearing them."}, {"q": "How many of the 7 million were Wayfarers?", "who": "classmate", "answer": "We couldn't find that anywhere. Ray-Ban's owner only gives one number for Ray-Ban and Oakley together, so there's no number for the Wayfarer alone."}, {"q": "Why pick a product whose AI doesn't even work in Lithuania?", "who": "lecturer", "answer": "Because it's the most popular smart glasses in the world and a very controversial one, so there's a lot to analyse. Lithuanians can still order it online, and the seller here describes the camera, audio and calls, which don't need the AI. And audio is the most popular feature anyway, according to Meta."}, {"q": "What exactly does the 94% cover?", "who": "classmate", "answer": "It's AI glasses without a screen, worldwide, in the first half of 2026, counted by how many were shipped. It's from Counterpoint Research. If you count all smart glasses, Meta had 82% in the second half of 2025."}, {"q": "Why is Oakley a competitor if it's the same company?", "who": "classmate", "answer": "Because our product is the Wayfarer, not the whole company. Oakley Meta sits in the same market, and here the same seller sells it too, at similar prices. So a buyer who picks an Oakley pair may skip the Wayfarer."}, {"q": "Which brand sells privacy?", "who": "classmate", "answer": "Even Realities. Their Even G2 glasses have no camera at all, and they sell them with the slogan \"Camera-free. By design.\" Meta now sells a Ray-Ban version with no camera too."}, {"q": "What about Apple or Google?", "who": "classmate", "answer": "A groupmate covered them in seminar B as the big companies trying to build the next platform. When we checked, Apple's glasses were only a report, to be shown in mid 2027 and sold by the end of 2027. Samsung's glasses with Google's AI had no price yet. So for now they're a threat for the future."}, {"q": "Why do you think privacy is where competitors have a chance?", "who": "lecturer", "answer": "Because the Wayfarer still has a camera, and a lot of owners worry about how others see them. IDC also says Meta only added privacy steps after the backlash, which leaves room for a brand that builds privacy in from the start."}, {"q": "Do people actually use the glasses, or is it just hype?", "who": "classmate", "answer": "Sales say it's real. More than 7 million Ray-Ban and Oakley AI glasses were sold in 2025, against about 2 million in the two years before. Meta also says daily users tripled in a year, but that's their own claim, with no exact number."}, {"q": "Isn't the real competitor just normal sunglasses and earbuds?", "who": "lecturer", "answer": "That's a substitute, something different that meets the same need. A groupmate covered it in seminar B. At the same seller, a plain Ray-Ban Wayfarer was about 175 euros on sale, and the newest smart one about 430. So the smart one costs more than twice as much."}, {"q": "So what should Meta do about privacy?", "who": "lecturer", "answer": "Meta now sells a Ray-Ban with no camera, and IDC says that avoids the privacy worry. For new camera models, I think they should build privacy in from the start. So far they only added privacy steps after people got angry."}], "read": {"chapters": [{"title": "Micro and macro", "paragraphs": ["In seminar B your group looked at the macro-environment, the big forces in society around a product. Your own parts were the natural one (cold Kaunas winters, rain and the battery) and the socio-cultural one (privacy: how people in Germany and Britain feel about being filmed, Meta AI not working here, and the recording light).", "Seminar C moves in close. Kotler calls this the micro-environment, meaning the people and firms close to the company. They are the company itself, its partners, its suppliers, the middlemen who help it promote, sell and deliver its products, its competitors, its publics and its customers. Publics are any group that cares about the company or can affect whether it reaches its goals, such as the media.", "Your groupmates cover partners, suppliers and contact audiences. Your group’s element called “contact audiences” is probably the same idea as Kotler’s publics. A groupmate, citing a course textbook on Moodle, counts the middlemen as partners. You have customers and competitors. Seminar B named a few big rivals but gave no prices or market shares, so your part adds those for named rivals. If someone asks, say it is the groups outside the company that care about it, such as the media.", "Kotler sorts customers into five markets. They are consumers who buy for themselves, businesses, resellers who buy to sell again, governments, and buyers in other countries. For Ray-Ban Meta the consumer market is the main one, so your customers are mostly ordinary people.", "On competitors, Kotler says a company must give customers more value than its rivals do. It must also hold a stronger place in customers’ minds than they do. That place in the mind is called positioning, and you will see it again in the privacy part."]}, {"title": "The product", "paragraphs": ["The product is the Ray-Ban Meta Wayfarer, which looks like a normal pair of Ray-Ban Wayfarers. Its frame holds a camera, microphones and small open-ear speakers, and it comes with an AI assistant called Meta AI. You can take photos and videos hands-free, listen to music, take calls and ask the assistant questions.", "A recording light turns on when the glasses record. It is their main privacy safeguard, though some wearers found ways around it.", "Two companies make it together. Meta does the software, the AI and the app. EssilorLuxottica, the large eyewear group that owns Ray-Ban, designs and makes the frames and sells them through its own stores and through opticians. The same partnership makes the sporty Oakley Meta glasses.", "The first pair came out in 2021 as Ray-Ban Stories. In 2023 the next pair got the Meta name. Gen 2 came out in September 2025 and the newest, Gen 3, a year later. Meta says Gen 3’s battery lasts up to 9 hours, one hour more than Gen 2.", "When your script says “the newest Wayfarer”, it means Gen 3. On 18 October your group had not yet agreed whether it analyses Gen 2 or Gen 3."]}, {"title": "Your customers", "paragraphs": ["Your customers paragraph starts with the whole world and ends with one buyer in Lithuania. Its first number is sales in 2025, more than 7 million AI glasses.", "That number comes from EssilorLuxottica’s yearly results, published in February 2026. It counts Ray-Ban and Oakley together, so it is not the Wayfarer alone. The comparison, about 2 million in 2023 and 2024 together, comes from a CNBC news report on the same results.", "But the buyers are still a small group. A Security.org survey from August 2026 found that only about 5% of US adults own smart glasses with a camera, of any brand. Owning them was most common among men and among people aged 30 to 44. Marketers call people who buy a new product early, before most others do, early adopters.", "Next comes what buyers like most. In September 2026 Meta said that audio has been its most popular feature since day one. That is why it launched Ray-Ban Meta Audio, a version with no camera.", "Then comes what owners worry about. In October the tech site Engadget reviewed that same camera-free pair. Its reviewer had interviewed Meta glasses users earlier in the year. A lot of them said they loved their glasses but worried about how others might see them. Some said they would happily buy a pair without a camera if it made them less likely to be called a “creep”.", "If someone wants a number, one in five owners in the US survey got a negative reaction while wearing their glasses. That comes from only about 100 owners, with glasses of any brand."]}, {"title": "Lithuania", "paragraphs": ["Your customers paragraph ends here in Lithuania. Your group could only find the glasses online, not in a physical store. The official seller in your script is Estheroptica. It has no shop in Lithuania and sends every pair from its optician in Italy.", "Free delivery usually takes 9 to 15 days. If a model is not in the maker’s stock, it can take a month to a month and a half, or longer. Sellers belong to the partners element, which a groupmate covers, so sa
