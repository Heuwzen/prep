/* round icon button (LangOS ChunkyIconStyle) */
.icon-btn{--face:var(--surface);--edge:var(--border);--line:var(--border);--ico:var(--muted);flex:none;display:grid;place-items:center;width:44px;height:44px;margin-bottom:var(--lip-sm);padding:0;border:2px solid var(--line);border-radius:50%;background:var(--face);color:var(--ico);box-shadow:0 var(--lip-sm) 0 var(--edge);transition:transform var(--dur-press) var(--ease-press),box-shadow var(--dur-press) var(--ease-press)}

/* chunky button (LangOS ChunkyButtonStyle) */
.btn{--face:var(--green);--edge:var(--green-lip);--line:var(--green);--label:var(--on-color);--l:var(--lip);display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;margin:0 0 var(--l);padding:12px 18px;border:2px solid var(--line);border-radius:var(--r-btn);background:var(--face);color:var(--label);box-shadow:0 var(--l) 0 var(--edge);font:var(--t-button);text-transform:uppercase;letter-spacing:.6px;text-align:center;transition:transform var(--dur-press) var(--ease-press),box-shadow var(--dur-press) var(--ease-press)}

.part{margin-top:14px}
.part-row{display:flex;align-items:center;gap:8px;font:700 15px/1.3 var(--font-ui)}
.part-row .v{margin-left:auto;color:var(--muted)}
.part-check{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--green);color:var(--on-color)}
.part-check .ic{width:11px;height:11px;stroke-width:4}
.gbar{height:10px;margin-top:6px;overflow:hidden;border-radius:var(--r-pill);background:var(--sunken)}
.part .gbar{background:var(--border)}
.gbar i{display:block;width:calc(var(--p) * 100%);height:100%;border-radius:var(--r-pill);background:var(--green);transition:width var(--dur-gentle) var(--ease-gentle)}
.gbar.orange i{background:var(--orange)}
.foot{margin:10px 0 0;font:500 13px/1.4 var(--font-ui);color:var(--muted)}

/* streak card (LangOS StreakCard) */
.spop-scrim{position:fixed;inset:0;z-index:70;background:var(--scrim);opacity:0;transition:opacity .2s ease}
.spop-scrim.is-open{opacity:1}
.spop{position:fixed;z-index:71;top:calc(var(--hdr-h) - 2px);left:var(--gl);right:var(--gr);max-width:528px;margin:0 auto;transform-origin:calc(100% - 22px) -10px;transform:scale(.6);opacity:0;transition:transform var(--dur-card) var(--ease-card),opacity .2s ease}
.spop.is-open{transform:none;opacity:1}
.s-head{display:flex;align-items:center;gap:12px}
.flame-disc{flex:none;display:grid;place-items:center;width:54px;height:54px;border-radius:50%;background:var(--orange);color:var(--on-color);box-shadow:0 var(--lip-sm) 0 var(--orange-lip)}
.flame-disc .ic{width:28px;height:28px}
.s-title{font:var(--t-title2)}
.s-sub{font:var(--t-sub);color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);margin-top:18px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px}
.day i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--sunken)}
.day.met i{background:var(--orange);color:var(--on-color)}
.day.today:not(.met) i{border:2.5px solid var(--orange);background:none}
.day i .ic{width:14px;height:14px;stroke-width:3.5}
.day span{font:700 12px/1 var(--font-ui);color:var(--muted)}
.day.today span{color:var(--ink)}
.goal{margin-top:18px;padding-top:14px;border-top:2px solid var(--border)}
.goal .part-check{background:var(--orange)}
.lbl{margin-top:14px;font:var(--t-detail);color:var(--muted)}

/* done screen (LangOS DoneMark) */
.done{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;padding:24px 0;text-align:center}
.dm{position:relative;width:96px;height:96px}
.dm .ring-svg{width:96px;height:96px}
.dm .trk{stroke:var(--border);stroke-width:5}
.dm .arc{stroke:var(--green);stroke-width:5;stroke-linecap:round;stroke-dasharray:285.88;stroke-dashoffset:285.88}
.dm .disc{position:absolute;inset:12px;display:grid;place-items:center;border-radius:50%;background:var(--green);color:var(--bg);transform:scale(0)}
.dm .disc .ic{width:36px;height:36px;stroke-width:3.5}
.done h2{margin:16px 0 var(--sp-heading);font:var(--t-title)}
.done p{margin:0;font:var(--t-body);color:var(--muted)}
.done-text,.done .btn-stack{opacity:0;transform:translateY(8px)}
.done .stats{opacity:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;margin-top:20px}
.stat{padding:12px 6px;text-align:center}
.stat b{display:block;font:var(--t-stat);font-variant-numeric:tabular-nums}
.stat span{font:var(--t-caption);color:var(--muted)}
.stat.g b{color:var(--accent-text)}
.new-best{margin-top:12px;opacity:0}
.done.play .dm .arc{stroke-dashoffset:0;transition:stroke-dashoffset 650ms var(--ease-draw)}
.done.play .dm .disc{transform:scale(1);transition:transform var(--dur-pop) var(--ease-pop) 500ms}
.done.play .done-text{opacity:1;transform:none;transition:opacity .4s ease-out 850ms,transform .4s ease-out 850ms}
.done.play .stats{opacity:1;transition:opacity .3s ease-out 1050ms}
.done.play .new-best{animation:popIn var(--dur-pop) var(--ease-pop) 1400ms both}
.done.play .btn-stack{opacity:1;transform:none;transition:opacity .4s ease-out 1000ms,transform .4s ease-out 1000ms}
.done.shown .dm .arc{stroke-dashoffset:0}.done.shown .dm .disc,.done.shown .done-text,.done.shown .btn-stack{transform:none}.done.shown .done-text,.done.shown .stats,.done.shown .btn-stack,.done.shown .new-best{opacity:1}

/* empty and error states */
.empty{display:flex;flex-direction:column;align-items:center;padding:48px 8px 0;text-align:center}
.empty .ic{width:64px;height:64px;stroke-width:2;color:var(--accent-text)}
.empty h2{margin:16px 0 var(--sp-heading);font:var(--t-title2)}
.empty p{max-width:300px;margin:0;font:var(--t-body);color:var(--muted)}
.empty .btn{max-width:320px;margin-top:var(--sp-buttons)}

/* lock page scroll under overlays */
.is-locked,.is-locked body{overflow:hidden}

/* reduced motion: springs become short eases, sliding becomes fading */
@media (prefers-reduced-motion:reduce){
:root{--ease-press:linear;--ease-quick:ease-in-out;--ease-gentle:ease-in-out;--ease-pop:ease-out;--ease-card:ease-in-out;--dur-press:1ms;--dur-quick:150ms;--dur-gentle:200ms;--dur-pop:150ms;--dur-card:200ms}
.screen.is-on{animation-name:fadeIn}
.node-row.is-current .node-wrap,.node-row.just-done .node .ic,.streak.flare,.streak.flare .flame,.streak.flare::before,.streak.flare .arc,.opt.bad{animation:none!important}
.lcard.in,.lcard.in-back,.qwrap.in{animation:fadeIn 200ms ease both}
.lcard.ghost-out{animation:none;display:none}
.sheet,.fb{transform:none;opacity:0;transition:opacity .2s ease}
.sheet.is-open,.fb.is-open{opacity:1}
.spop{transform:none}
.tabbar.is-hidden{transform:none;opacity:0;pointer-events:none;transition:opacity .2s ease}
}

/* extensions: same tokens and values only */
.node-row.is-finish{pointer-events:none}
#screen-read .hdr.is-scrolled{box-shadow:none}
.icon-btn:disabled{opacity:.5}
.node-label .pill{align-self:flex-start}
.chev{flex:none}
.opt .ot{flex:1;min-width:0}
.fact{display:block;width:100%;margin-top:var(--sp-section);text-align:left}
.fact .fact-b{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fact-k{display:flex;align-items:center;gap:8px;font:var(--t-label);color:var(--accent-text)}
.fact-title{margin-top:4px;font:var(--t-headline)}
.fact-b{margin:6px 0 0;font:var(--t-callout)}
.fact-card{margin-bottom:var(--sp-list)}
.fact-card .scope{margin-top:12px}
.fact-card .scope b{color:var(--accent-text)}
.fact-card .fact-more{margin:12px 0 0}
.fact-card .reveal .blk:first-child{margin-top:12px}
.numbers-mark{margin-top:13px}
.crow{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 var(--sp-list);padding:12px 14px;text-align:left;background:var(--surface);border:2px solid var(--border);border-radius:var(--r-card);box-shadow:0 var(--lip-sm) 0 var(--border)}
.cdisc{flex:none;display:grid;place-items:center;width:32px;height:32px;border:2px solid var(--border);border-radius:50%;background:var(--sunken);color:var(--muted);font:800 14px/1 var(--font-ui)}
.cdisc.isread{border-color:var(--green);background:var(--green);color:var(--on-color)}
.cdisc .ic{width:16px;height:16px;stroke-width:3.5}
.crow-t{flex:1;min-width:0;font:var(--t-row)}
.sec-first{margin-top:var(--sp-section)}
.qa-body{padding-top:4px}
.s-body .qa-card .pill{margin-bottom:0}
#streak-card:focus{outline:none}
.done .btn-stack{width:100%;pointer-events:none}
.done.ready .btn-stack,.done.shown .btn-stack{pointer-events:auto}
.is-practising #script-seg{display:none}
.pointer :focus-visible{outline:none}
</style>
