, s73"}, {"q": "Case: Bill Nugent, a Dallas developer, waits until nearly 3:45 pm for a 2:30 pm meeting in Riyadh and meets small talk. How would you help Bill?", "who": "exam", "answer": "Bill is judging Saudi Arabia with his own cultural reference point, the self-reference criterion (s21). Americans see time as money and keep schedules strictly (s76). Saudi culture works differently. Polychronic people change plans easily and put people and relationships first (s33), so the delay and the other men in the room are normal. Arabic is high-context on Hall's ranking, so communication is relation oriented (s31-32). Close friendships lead to person-orientation (s80), so small talk builds trust before business. I would advise Bill to plan extra time, accept the waiting and the other people present, invest in the relationship, and raise business later.", "src": "L2 s83, s21, s31-33, s76, s80"}, {"q": "Case: Tom Forrest, a US executive, defends a joint venture plan in a meeting in Japan after the retired president criticises it. The firm ends the talks. How would you help Tom understand?", "who": "exam", "answer": "Japan is a reactive culture in Lewis' terms: people must not lose face, never confront and put diplomacy over truth (s38). The slide on Japan adds wa, peace and harmony, consensus and duty, and open expression and conflict are discouraged (s78). The critic was the president's 82-year-old grandfather, who had just retired (s84). Mr. Hayakawa's silence fits this: openly contradicting the elder would break harmony. Tom's strong public defence did exactly that and caused loss of face, so the firm ended the negotiations. Tom should avoid open argument, raise concerns indirectly or in private, and work for consensus.", "src": "L2 s84-85, s38, s78"}, {"q": "Case: Fred Wagner, an American who speaks German, opens his Frankfurt presentation with humorous anecdotes, and the German firm declines his products. What went wrong?", "who": "exam", "answer": "Fred read the situation through his own culture. Germans prefer rules and order, and dislike inefficiency (s78). Germany is among the low-context cultures on Hall's ranking, so messages are explicit and people are task oriented (s31-32). Lewis' linear-active style sticks to facts and puts truth before diplomacy (s38). Jokes at the start of a business presentation read as not serious, so the executives doubted him despite his good German and correct greeting. Fred should have been formal, punctual and fact-based, and opened with the business case.", "src": "L2 s86, s31-32, s38, s78"}, {"q": "Explain the communication process and cultural noise. Use the Greek and American example from the lecture.", "who": "exam", "answer": "In the communication process the sender encodes meaning, the medium carries the message, and the receiver decodes the meaning. Noise acts on all three, culture is the source that feeds the noise, and feedback runs from the receiver back to the sender. Cultural noise arises because the decoder's culture becomes part of the meaning. People then use attribution, looking for an explanation of the other person's behavior, and often blame confusion on the other's 'stupidity or craziness'. Example: an American asks, 'How long will it take to finish this report?' to invite participation. The Greek expects an order from the boss and answers, 'I don't know. How long should it take?' The American concludes that he refuses to take responsibility.", "src": "L3 s5-7"}, {"q": "Why is trust important for effective communication, and how can it be cultivated?", "who": "exam", "answer": "Effective communication depends on informal understandings among the parties, and these are based on trust. When trust exists, there is implicit understanding, cultural differences may be overlooked, and problems are dealt with more easily. The meaning of trust and how it is developed vary across societies, and some cultures have a greater propensity to trust. The World Values Survey studied 90,000 people in 45 societies: Nordic countries rated highest, and Brazil, Turkey, Romania, Slovenia and Latvia lowest. Three guidelines for cultivating trust: create a clear and calculated basis for mutual benefit, improve predictability by resolving conflicts and keeping communication open, and develop mutual bonding through regular socializing and friendly contacts.", "src": "L3 s8-10"}, {"q": "List and explain the cultural variables in communication.", "who": "exam", "answer": "Cultural variables affect communication via a person's perceptions, and their effects are interdependent. The list has seven. Attitudes underlie behavior and interpretation, ethnocentric attitudes are a particular source of noise, and stereotyping assumes every member of a society has the same characteristics. Social organization (nation, tribe, religious sect, profession) shapes perceptions. Thought patterns differ: a Canadian in Thailand assumed double lines meant no passing. Roles differ in who decides and who is responsible. Language, spoken and written, causes problems through idioms, body language and poor translation. Non verbal communication includes kinesic behavior, paralanguage, proxemics and object language. The seventh variable is time.", "src": "L3 s13-19"}, {"q": "Explain the four media of nonverbal communication, with the slide examples.", "who": "exam", "answer": "Nonverbal communication is behavior that communicates without words. Kinesic behavior is communication through body movements, for example oculesics. Proxemics is the influence of proximity and space on communication: high-contact cultures such as South America, Arabs and South Europe stand close, while low-contact cultures such as North America, Asia and North Europe keep distance, and French executives work in the middle of subordinates. Paralanguage is how something is said: the Chinese tend to think about 30 seconds before speaking, while Americans are comfortable with only 10 to 15 seconds of silence. Object language, or material culture, is communication through material artifacts.", "src": "L3 s20-21, s25-27"}, {"q": "Compare high-context and low-context cultures, and monochronic and polychronic cultures.", "who": "exam", "answer": "In high-context cultures (Asia, Middle East, Africa, Mediterranean) feelings and thoughts are not explicit, you read between the lines, and the style is indirect. In low-context cultures (Germany, Switzerland, US, Scandinavia) thoughts are put into words and the style is straight. Germans expect detailed information before a decision, while Arabs base decisions more on knowledge of the people involved. Monochronic cultures (Switzerland, Germany, United States) see time as linear, do one thing at a time and are used to short-term relationships. Polychronic cultures (Latin America, Arabs) tolerate many things at once, change plans often and put relationships over material things.", "src": "L3 s27-28, s30-31"}, {"q": "How should a Western manager communicate with Arabs?", "who": "exam", "answer": "Arabs build communication on friendship, honor and hospitality. They use loud speech for dramatic effect and flowery language, they are high-contact communicators, and time is the key in the process. They tend to do business with people, not organizations, so you should not decline hospitality or criticize in front of others. Arabs are polychronic and believe something happens only if Allah wills it, so deadlines are inappropriate and interruptions should be expected. The suggestions: be patient and build relationship and trust, put relationships before the task, avoid doubts and criticism when others are present, adapt to body language norms, and expect delays and changes in plans.", "src": "L3 s34-36"}, {"q": "How can a manager manage cross-cultural communication successfully?", "who": "exam", "answer": "The slides give five steps. Develop cultural sensitivity by anticipating the meaning the receiver will get. Encode carefully with words, pictures and gestures, and avoid slang, idioms and regional sayings. Use selective transmission: build relationships, face-to-face if possible. Decode feedback carefully by asking multiple parties and improving listening and observation. Follow up through action and inaction and keep lines of communication open. Contract follow through can be hard because cultures differ on what a contract is. Openness (open-mindedness, tolerance for ambiguity, extrovertedness) and resilience (internal locus of control, persistence, tolerance for ambiguity, resourcefulness) also help.", "src": "L3 s41-44"}], "read": {"chapters": [{"title": "From CSR to codes of conduct", "paragraphs": ["This lecture asks what a multinational company owes to the people it affects. The opening profile shows the problem in photos. Garment workers in Bangladesh hold signs that say “I made your clothes”. Protesters outside a Primark store hold signs that say “Primark's shame” and “Never again”. The lecture is called Managing Interdependence because a company cannot serve shareholders, workers, communities and governments one after the other. It has to deal with all of them at once.", "Start with the words. CSR means a company regulating itself, voluntarily, and going beyond the legal minimum. It also means actively monitoring your own compliance with laws, ethics and social norms. Ethics, in this lecture, is the decisions and interactions of individuals. CSR decisions are bigger: they are made at a higher level and affect far more people. In 2003 the UN drafted its first CSR guidelines for multinational corporations.", "The slides call this a dilemma. At one extreme, profit is the MNC's only goal. At the other, MNCs should anticipate and solve social needs. Most real firms sit somewhere in between, and that position shifts under pressure. The core issues are poverty, environment, consumer rights and worker safety, and they are now mapped onto the UN's 17 SDGs.", "International CSR is harder than domestic CSR, because there are more stakeholders and more conflicts of interest. The MNC sits between home-country stakeholders, such as owners, employees, customers and unions, and host-country stakeholders, such as the host government, the community and consumers. Del Monte's pineapple farms in Kenya bring export earnings but take up scarce farmland. Stitching soccer balls in Pakistan forces a choice: pay a living wage and risk hunger for families who lose the work, or keep wages low and risk child labour.", "Firms and regions do not fully agree on what to do. The idea of a “Global Corporate Culture” says business norms are converging. In practice the US and Europe still diverge. The US prefers clear, universal rules and the same standard for everyone. The EU has broader social aims: environment, shared values, relationships. The 2024 Forced Labour Regulation is an example of the EU's tougher, systemic tradition. When the confusion is real, the slides offer three tools: engage stakeholders and sometimes NGOs in a dialog, set principles and procedures for hard issues, and adjust reward systems to reflect the company's commitment to CSR.", "The next question is which moral standard a manager should use. There are three approaches. Moral universalism looks for a standard accepted by all cultures, and the slide marks it preferable. The ethnocentric approach applies home-country morality whatever the host country thinks. Ethical relativism adopts the local moral code wherever the firm operates, and the slide marks it “conflict”.", "Where governments have not agreed on binding global rules, industry has stepped in with voluntary but reputation-critical codes. The Sweatshop Code of Conduct, from the Clinton era in the 1990s, bans forced labour and discrimination and sets minimum wage and safety rules. The Responsible Business Alliance, formerly the Electronic Industry Code of Conduct, covers a whole industry. SA8000 is a certifiable labour standard backed by Avon and Sainsbury's.", "The UN Global Compact is a large UN effort, with 23,000+ business participants in 160+ countries in 2025. Its principles sit in four areas: human rights, labour, environment and anti-corruption. Getz combined five sources into integrated international codes, from the International Chamber of Commerce guidelines to the UN Universal Declaration for Human Rights. These codes cover three areas: MNC and host governments, MNC and public, and MNC and persons. They ask, for example, for reinvesting profits in host countries, no bribes to public servants, accurate advertising and at least basic living wages."]}, {"title": "China, corruption and sustainability", "paragraphs": ["China is the comparative case. The slides list its attractions: a skilled workforce, 1.4B consumers, an EV and green-tech hub and the 2nd-largest economy. They also list the challenges: potentially rampant violation of workers' rights, repression of free speech, and difficulty monitoring and correcting human rights violations. For a manager, China shows the whole tension: huge opportunity next to hard human-rights questions.", "Ethics vary with the cultural value system of each society. Practices that are illegal in some countries are accepted ways of doing business in others. The model by Robertson and Crittenden shows why. Economic ideology and culture lead to a dominant moral philosophy, which leads to ethical or unethical societal norms, which lead to individual behavior. Moderators act on this chain: macro-level, societal and firm-specific ones.", "Bribery is where the clash is sharpest. The slide “To Bribe or NOT to Bribe?” gives three cases: paying mail carriers in Mexico so they do not “lose” mail, paying $100 to get a computer picked up and not left on a rainy dock, and gift-giving to bond social ties. Questionable payments cover political payments, extortion, bribes and grease money. In some cultures bribery is normal and gifts are expected. The key difference is that gift-giving is open, while bribery is secret and transactional. Bribery of officials is illegal everywhere, so the manager must either keep to their own standard and risk losing business, or match local practice and risk the law.", "Laws try to manage the problem. The US Foreign Corrupt Practices Act bans bribing foreign officials to win business, with heavy fines and prison. In 2025 enforcement was paused from February to June, and then the DOJ reopened it, now focused on bribery tied to cartels and organised crime. Even “universal” rules can shift with politics. The OECD Anti-Bribery Convention is hard to enforce without a formal complaint. The Corruption Perceptions Index, which the slide titles Global Corruption Barometer, gives a picture. Denmark scores 89, Finland 88 and Singapore 84, while South Sudan scores 8, Somalia 9 and Venezuela 10. Lithuania scores 65, rank 28.", "To cope, an MNC can develop a worldwide code of ethics, build ethical policies into strategy development, and plan regular assessment of its ethical posture. If problems cannot be resolved, it should withdraw from that market. Questionable behavior can be a slippery slope. A small bribe, a matter of personal ethics, can grow over time into something truly negligent and perhaps criminal.", "Host countries have a list of nine complaints about subsidiaries. MNCs raise capital locally, which can push up interest rates for domestic firms. Subsidiaries are mostly owned by the parent, so locals have little control, and senior roles go to expatriates. R&D stays at headquarters, and MNCs can dominate whole industries and answer only to home-country shareholders and government. Against this, the slide sets benefits such as outside capital, technology, infrastructure and new jobs.", "Hosts can respond in three ways. Under nationalism, public opinion favours national goals and opposes foreign influences. Under protectionism, the host closes borders partly or fully with tariff and nontariff barriers. Under governmentalism, the government uses its policy-setting role to favour national interests rather than market forces. The slides also raise an ecological issue: developed countries export hazardous waste and banned chemicals. Industrial ecology answers with alternative raw materials, new recycling methods and more use of by-products.", "Sustainability means meeting today's needs without compromising tomorrow's resources, and its Triple Bottom Line is economic, social and environmental. After the Rio conference of 1992, sustainable development became the main guiding principle. In September 2015, 193 countries adopted the 2030 Agenda with 17 SDGs. The lecture ends with seven recommendations for MNCs in developing countries, from doing no intentional harm to paying their fair share of taxes. The final remarks add that there is no single global standard."]}, {"title": "What culture is and how it shapes organisations", "paragraphs": ["This lecture asks why culture matters for a manager or a negotiator. It opens with Saudi Arabia, where women outnumber men in universities and now make up about 35 percent of the workforce, up from just 17 percent in 2017. About 77 percent of the total workforce is still foreign-born. It gives a first picture of one culture. Learning goal 5 asks for the same thing: a working cultural profile as an aid to expected attitudes toward work, communication and negotiations.", "Next comes S. P. Huntington. He wrote that the great divisions among humankind will be cultural, not mainly ideological or economic. Nation states stay powerful, but the main conflicts will be between nations and groups of different civilizations. His map labels the Western, Orthodox, Islamic, Sinic, Hindu, Japanese, Latin American and African civilizations, plus smaller areas such as Buddhist. In his words, the fault lines between civilizations will be the battle lines of the future.", "The slides then define culture. Culture is acquired knowledge that people use to interpret experience and generate social behavior, and it forms values, creates attitudes and influences behavior. It is learned, shared, transgenerational, symbolic, patterned and adaptive. Values are basic convictions about right and wrong, good and bad, important and unimportant. People learn them in the culture where they are educated, so different values can lead to different management practices.", "Edgar Schein gives a way to look inside a culture. His model has three levels. Artefacts and symbols are on the surface, such as logos, architecture and corporate clothing.", "Espoused values sit in the middle. Basic underlying assumptions are the deepest level, and they are experienced as self-evident and unconscious, so they are hard to recognize from within. Because the model works like an onion, the outer layer is easy to change and the deeper layers are much harder to adjust.", "Organizational culture lives inside societal culture and must respond to it. KLM extended its travel benefits to any couple who formally registered as living together, which fits Dutch attitudes. McDonald's trains employees in Russia more than in the US, because Russians are less familiar with working within a capitalist system. Some people say convergence is making management styles more alike, through industrialization and worldwide coordination, but how far culture shapes processes is still debated.", "Several habits get in the way of good judgement. The self-reference criterion is the subconscious use of your own cultural values as the reference point. Parochialism is a Frenchman expecting people from another country to behave as people do in France. Ethnocentrism is the attitude that your own ways are best everywhere, as when a Camay soap commercial from P&G backfired in Japan. Cultural sensitivity, or cultural empathy, points the other way: it is awareness of and honest caring about another person's culture.", "Finally, the slides list seven cultural subsystems that shape behaviour: kinship, education, the economic system, the political system, religion, health and recreation. Values reach people through these subsystems and pass down through generations. Contingency management means adapting your style to the local environment. Cultural profiles give only an approximation of national character, because subcultures exist. Canada is one example, and distinct ethnic groups in China have their own customs and dialects."]}, {"title": "Models that measure culture", "paragraphs": ["Slide 27 lists the main attempts to describe and assess cultural differences: Edward Hall, Kluckhohn and Strodtbeck, Richard D. Lewis, Richard Gesteland, Geert Hofstede, Trompenaars and Hampden-Turner, Schwartz, and the GLOBE project. This chapter covers Hall, Kluckhohn and Strodtbeck, Lewis, Gesteland, Schwartz and Hofstede. Trompenaars and GLOBE come in the next chapter. Each author looks at culture from a different side, and later slides show that the models overlap.", "Edward T. Hall names three big differences. The first is proxemics, the amount of space people feel they must set between themselves and others. His zones run from intimate space up to 0.45 m, personal space up to 1.2 m, social space up to 3.6 m and public space up to 7.6 m.", "The second is context. Low-context cultures use explicit messages and are task oriented. High-context cultures care about more than the message and are relation oriented, and the ranking starts with Japanese, Arabic and Latin American and ends with German and Swiss-German.", "The third difference is time. Monochronic people do one thing at a time, concentrate on the job, take time commitments seriously and adhere religiously to plans. Polychronic people do many things at once, are easily interrupted, change plans often and are committed to people and human relationships. Polychronic people also borrow and lend easily and tend to build lifetime relationships, while monochronic people seldom borrow or lend and are used to short-term relationships.", "Kluckhohn and Strodtbeck use six orientations. The first is the nature of people: good, evil or a mixture of good and evil. The second is the relationship to nature: dominant, in harmony or subjugation. The third is the relationship to other people: lineal, collateral or individualist.", "The fourth is the modality of human activity: doing, being or containing. The fifth is the temporal focus: future, present or past. The sixth is the conception of space: private, public or mixed.", "Richard D. Lewis sorts cultures into three categories. Linear-active people talk half the time, do one thing at a time, plan step by step, stick to facts and put truth before diplomacy. Multi-active people talk most of the time, do several things at once, show feelings and put feelings before facts. Reactive people listen most of the time, never confront, must not lose face and put diplomacy over truth. On his triangle, Germany and Switzerland sit at the linear-active corner, Hispanic America at the multi-active corner and Vietnam at the reactive corner.", "Gesteland groups cultures using four features: deal or relationship focus, formal or unformal, polychronic or monochronic, and reserved or expressive. Shalom H. Schwartz uses a circle of seven value types: Harmony, Embeddedness, Hierarchy, Mastery, Affective autonomy, Intellectual autonomy and Egalitarianism. English speaking countries highly valued Mastery, while Embeddedness and Hierarchy dominated in the Middle East and most of Asia.", "Geert Hofstede asked how to quantify culture. His six dimensions are power distance, individualism, uncertainty avoidance, masculinity, long-term orientation and indulgence, and the first four were found first. His research covered 116,000 people in 50 countries, all in one firm, IBM, so the slides ask you to read it with caution. High power distance means respected hierarchy and autocratic leaders.", "High uncertainty avoidance means strict laws and low-risk decisions. Collectivism means tight social frameworks, and femininity means concern for others and quality of life. Low long-term orientation means normative societies, and weak control of desires is called Indulgence.", "The slides show older score tables and a newer chart. For China, Japan, Lithuania and the US, use the chart on slide 58. Lithuania scores 42 on power distance, 60 on individualism, 19 on masculinity, 65 on uncertainty avoidance, 82 on long-term orientation and 16 on indulgence. The US scores 91 on individualism but only 26 on long-term orientation."]}, {"title": "Trompenaars, GLOBE and culture in practice", "paragraphs": ["Trompenaars and Hampden-Turner give seven dimensions, or dilemmas, of intercultural communication. Universalistic cultures apply rules objectively, while particularistic cultures stress relationships and apply rules more subjectively. Affective cultures show emotions openly, while neutral cultures do not.", "People in specific cultures keep work and private life apart, while in diffuse cultures work spills over into personal relationships. In achievement-oriented cultures status comes from personal achievement, and in ascription-oriented cultures it comes from class, age and gender. The other three are sequential versus synchronic, internal versus external control, and individualism versus collectivism.", "The GLOBE project is the Global Leadership and Organizational Behavior Effectiveness Research Program. Robert J. House of Wharton founded it in 1991. It uses questionnaires to assess average values per country, focuses on leadership behavior, and separates desired from as-is preferences. Its nine dimensions are uncertainty avoidance, power distance, social collectivism, in-group collectivism, gender egalitarianism, assertiveness, future orientation, performance orientation and humane orientation.", "GLOBE results correspond generally with those of Hofstede and Trompenaars. The difference is that many researchers with varied perspectives took part, while Hofstede worked alone, and GLOBE studied many companies where Hofstede studied IBM. On the country slides, Sweden and New Zealand are low on assertiveness, Russia and Argentina are low on performance orientation and on future orientation, and Germany and Spain are low on humane orientation. GLOBE also groups countries into ten clusters, from Anglo and Latin America to Nordic Europe, Arab and Confucian Asia. Slide 74 then shows that the models overlap, with time appearing in five of the six.", "The last part of the lecture moves from models to practice. Four critical value differences matter: time, change, material factors and individualism. To Americans time is money, while in Latin America the word for tomorrow means sometime in the future. Western people believe they can control the future, while many non-Western societies believe in destiny and may be passive or hostile toward change. Americans value physical goods and status symbols, and in the US the focus is on I, while in China there is more emphasis on conformity and cooperation.", "The slides also look at countries. Japan is about wa, peace and harmony, with consensus and duty and with open conflict discouraged. Germany prefers rules and order and dislikes inefficiency and tardiness.", "In South Korea honest criticism is rare, and in Latin America it is very important to maintain harmony and save face. In Saudi Arabia, tribalism leads to paternalism and nepotism, close friendships to person-orientation and Theory Y, and honor and shame to conflict avoidance. Chinese family businesses put people ahead of business and rely on guanxi connections.", "Culture also meets the Internet. In Korea, 98 percent of homes have high-speed Internet. In Sweden and many other European countries the government closely monitors the use and sharing of consumer data, while the US collects a great deal of information. This suggests that e-commerce must take local approaches to markets, customs, languages and currencies.", "Three cases close the lecture. Bill Nugent is kept waiting in Riyadh and meets small talk, which fits polychronic time and a relationship-first culture. Tom Forrest defends a plan in a Japanese meeting and breaks harmony, which fits a reactive culture and wa. Fred Wagner opens in Frankfurt with jokes, which a rule-minded, fact-based German audience reads as not serious. In each case, name the culture, apply the slide concept, and then say what the manager should do."]}, {"title": "How a message travels, and where trust fits in", "paragraphs": ["This lecture is about how people send and receive meaning across cultures. It starts with a case. Google Street View was frozen in Germany for 12 years, from 2011 to 2023, after about 244,000 households asked for their homes to be blurred. Meta was fined 1.2 billion euros in 2023 and TikTok 530 million euros in 2025. The slide says there is a big difference in the culture of privacy between the US and Europe.", "The slide then says what the case shows. Communication is a critical factor in cross-cultural management issues, most of all in interpersonal ones: motivation, leadership, group interactions and negotiation. So a manager or negotiator needs to understand how a message moves from one person to another.", "The communication process has three parts. The sender encodes meaning, the medium carries the message, and the receiver decodes the meaning. Noise acts on all three parts. The exhibit shows culture as the source that feeds the noise, and feedback runs from the receiver back to the sender.", "Cultural noise appears when a member of one culture sends a message to a member of another. The message holds the meaning the encoder intended. But the decoder's culture becomes part of the meaning when he or she interprets it. Attribution is the process in which people look for an explanation of another person's behavior. When someone does not understand another, he or she usually blames the confusion on the other's 'stupidity or craziness'.", "The Greek example makes this concrete. An American asks, 'How long will it take to finish this report?' He thinks he has asked the Greek to participate. The Greek thinks: He is the boss, so why doesn't he tell me? The Greek answers, 'I don't know. How long should it take?' and the American concludes that he refuses to take responsibility.", "Effective communication depends on informal understandings among the parties, and these rest on trust. When trust exists, there is implicit understanding, cultural differences may be overlooked, and problems are dealt with more easily. The meaning of trust and how it is developed vary across societies, and some cultures are more trusting than others. The World Values Survey studied 90,000 people in 45 societies. Nordic countries rated highest, while Brazil, Turkey, Romania, Slovenia and Latvia had the lowest trust.", "The slide gives three guidelines for cultivating trust. Create a clear and calculated basis for mutual benefit. Improve predictability by resolving conflicts and keeping communication open. Develop mutual bonding through regular socializing and friendly contacts.", "The GLOBE project shows which style fits which culture. High performance orientation, as in the US, Switzerland and Germany, calls for direct and explicit information. Low performance orientation, as in Russia, Greece and Portugal, calls for a more indirect approach. Low assertiveness, as in Sweden, calls for a friendly, two-way approach, and high humane orientation, as in Ireland, calls for avoiding conflict and being supportive."]}, {"title": "Variables, nonverbal signals, Arabs and good practice", "paragraphs": ["Cultural variables affect communication through a person's perceptions: attitudes, social organization, thought patterns, roles, language, non verbal communication and time. Their effects are interdependent. Ethnocentric attitudes are a particular source of noise, and stereotyping means assuming that every member of a society has the same characteristics. A Canadian in Thailand assumed double lines meant no passing, just as in Canada. Language adds more noise: when many Asians say yes, it often means only that they have heard you and are too polite to disagree.", "The lecture also separates expressive from instrumental communicators. Expressive ones show emotions openly, as in Russia, Hungary and Poland. Instrumental ones stress content, as in Slovenia, Lithuania and the Czech Republic. Nonverbal cues are often said to carry 65-93% of interpreted meaning, and the slide marks this as a debated estimate. The four media are kinesic behavior, proxemics, paralanguage and object language.", "Proxemics is about space. Space communicates power in the US and Germany, where executives may have large corner offices, while French executives work in the middle of subordinates. High-contact cultures (South America, Arabs, South Europe) stand close and touch a lot, and low-contact cultures (North America, Asia, North Europe) keep more distance. Paralanguage is how something is said. The Chinese tend to think for about 30 seconds before speaking, while Americans are comfortable with only 10 to 15 seconds of silence.", "Time works in two ways. Monochronic cultures such as Germany, Switzerland and the US see time as linear and do one thing at a time, while polychronic cultures such as Latin America and the Arabs tolerate many things at once and put involvement with people first. Context is the other big idea. In high-context cultures you read between the lines, and in low-context cultures thoughts are put into words. The chart runs from Japan at the implicit end to Switzerland at the explicit end.", "Americans find the Asian poker face hard to read, because Americans stress talking and Asians stress listening. To Americans silence is a break in communication, and to Asians it is part of communication. With Arabs, communication is built on friendship, honor and hospitality. Arabs do business with people, not organizations, and they are polychronic, so deadlines are inappropriate. Be patient, put relationships first and avoid criticism in front of others.", "Channels differ too. In the US information flows from staff to manager, in South America from the manager downward, and in Japanese ringi systems decisions are consensual. Japanese ningensei stresses saving and giving face, while Americans are explicit and adversarial. On the web, English is on about 50% of websites, yet only about 1 in 4 users speaks it, so e-commerce must adapt to local cultures.", "To manage all this, the slides give five steps: develop cultural sensitivity, encode carefully, transmit selectively, decode feedback carefully, and follow up. Contract follow through can be hard, because cultures have different ideas about what constitutes a contract. Openness and resilience help in this work. So do the seven behaviors tied to effectiveness: respect, interactive posture, orientation to knowledge, empathy, interaction management, tolerance for ambiguity and other-oriented role behavior."]}], "minutes": 21}, "inspire": [{"title": "A very large business network", "fact": "The UN Global Compact has 23,000+ business participants in 160+ countries (2025, its 25th anniversary).", "why": "A quick number that proves the Global Compact is a major effort, useful in any answer about codes of conduct.", "share": "The UN Global Compact now has more than 23,000 business participants in over 160 countries.", "source": "Lecture 1, slide 15", "url": "", "src": "L1 s15"}, {"title": "Lithuania next to the US", "fact": "In the 2025 CPI, Lithuania scores 65 (rank 28) and the US scored 64 (rank 29, its lowest ever). The global average fell to a record-low 42.", "why": "It ties the lecture to where you study now, and the numbers are easy to recall.", "share": "Lithuania scores 65 on the corruption index, one point above the US, which fell to its lowest ever.", "source": "Lecture 1, slide 33", "url": "", "src": "L1 s33"}, {"title": "Soccer balls in Pakistan", "fact": "Paying a living wage risks hunger for families who lose the work, while keeping wages low risks child labour.", "why": "It shows why international CSR rarely has a clean answer, which is the point of slide 10.", "share": "With soccer balls in Pakistan, both choices carry a risk: hunger for families, or child labour.", "source": "Lecture 1, slide 10", "url": "", "src": "L1 s10"}, {"title": "Gifts are open, bribes are secret", "fact": "Gift-giving is open; bribery is secret and transactional. Bribery of officials is illegal everywhere, whatever the local custom.", "why": "One sentence that separates gift from bribe, a likely exam and class point.", "share": "The difference is simple: a gift is open, a bribe is secret and transactional.", "source": "Lecture 1, slide 31", "url": "", "src": "L1 s31"}, {"title": "KLM and the registered couple", "fact": "KLM extended its travel benefits policy to any couple who formally registered as living together, heterosexual or homosexual, married or not.", "why": "A clear example of organizational culture responding to societal culture (Dutch attitudes). Use it in an open question.", "share": "KLM changed its travel benefits to fit Dutch attitudes, so a company culture follows the society around it.", "source": "Lecture 2, slide 19", "url": "", "src": "L2 s19"}, {"title": "McDonald's trains Russians more", "fact": "McDonald's provides more extensive training to employees in Russia than to those in the US, because Russians are less familiar with working within a capitalist system.", "why": "Shows a company adapting to local culture instead of copying home practice.", "share": "McDonald's gives Russian staff more training than American staff, because the system itself is less familiar to them.", "source": "Lecture 2, slide 19", "url": "", "src": "L2 s19"}, {"title": "Tomorrow means someday", "fact": "In Latin America the word for tomorrow is used to mean sometime in the future, while to Americans time is money and schedules are strictly kept.", "why": "A one-line picture of the time difference. It also helps with the Bill Nugent case.", "share": "In Latin America tomorrow can mean sometime in the future, but for Americans time is money.", "source": "Lecture 2, slide 76", "url": "", "src": "L2 s76"}, {"title": "Power machinery and the father's way", "fact": "To a Chinese worker, the change to power machinery might suggest dissatisfaction with his father's way of life.", "why": "Memorable example of how attitudes to change differ in non-Western societies.", "share": "A Chinese worker may read new machines as a criticism of his father's way of life.", "source": "Lecture 2, slide 76", "url": "", "src": "L2 s76"}, {"title": "Lithuania against the US", "fact": "On the Hofstede Insights chart, Lithuania scores 82 on long-term orientation and the US 26. On individualism Lithuania scores 60 and the US 91.", "why": "A Lithuanian class will notice Lithuania in the chart. It gives you a concrete comparison to quote.", "share": "In Hofstede's chart Lithuania scores 82 on long-term orientation, while the US scores only 26.", "source": "Lecture 2, slide 58", "url": "", "src": "L2 s58"}, {"title": "Street View frozen for 12 years", "fact": "Google Street View was frozen in Germany for 12 years (2011 to 2023) after about 244,000 households asked for their homes to be blurred.", "why": "It is the opening case of the lecture and shows a communication clash between two privacy cultures. You can use it as an example in an open answer.", "share": "Germany kept Google Street View frozen for 12 years because about 244,000 households asked to be blurred.", "source": "Lecture 3, slide 4", "url": "", "src": "L3 s4"}, {"title": "Thirty seconds of silence", "fact": "The Chinese tend to spend about 30 seconds thinking before they speak, while Americans are only comfortable with 10 to 15 seconds of silence.", "why": "It gives you two numbers for paralanguage and a clear example of how silence causes offense.", "share": "Americans break a silence after 10 to 15 seconds, but the Chinese may be thinking for 30, so the American ends up interrupting.", "source": "Lecture 3, slide 26", "url": "", "src": "L3 s26"}, {"title": "Double lines in Thailand", "fact": "A Canadian in Thailand assumed that double lines on the road meant no passing, just as they do in Canada.", "why": "It is the slide's example for thought patterns. It shows that we cannot assume others use the same reasoning.", "share": "A Canadian in Thailand read double road lines as no passing, which shows how thought patterns differ.", "source": "Lecture 3, slide 15", "url": "", "src": "L3 s15"}, {"title": "Offices that show power", "fact": "US executives may have large, private corner offices, while French executives communicate their central position by working in the middle of subordinates.", "why": "It is an easy example for proxemics: the same idea of power uses space in opposite ways.", "share": "A US executive shows power with a private corner office, but a French executive works in the middle of the team.", "source": "Lecture 3, slide 25", "url": "", "src": "L3 s25"}]}]}</script>

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function cap(s){s=String(s||'');return s.charAt(0).toUpperCase()+s.slice(1)}
function ic(n,c){return '<svg class="ic'+(c?' '+c:'')+'" aria-hidden="true"><use href="#i-'+n+'"/></svg>'}

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}

function rd(k){if(!store)return null;try{var v=store.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}

var G=obj(rd('prep.v1.global'));
G.days=obj(G.days);G.best=+G.best||0;G.goal=[5,10,15,20].indexOf(G.goal)>=0?G.goal:10;
if(G.sound===undefined)G.sound=true;

var PSm={};
function PS(p){

    var d=obj(rd('prep.v1.pack.'+p.id));

    d.quiz=obj(d.quiz);d.quiz.best=+d.quiz.best||0;d.quiz.lecBest=obj(d.quiz.lecBest);d.quiz.history=Array.isArray(d.quiz.history)?d.quiz.history:[];

  p.lessons=(p.lessons||[]).filter(function(l){return l&&Array.isArray(l.cards)&&l.cards.length}).map(function(l,i){l.id=l.id||'lesson-'+i;return l});

}

/* ---------- path ---------- */
function inferDo(t){

  for(var i=0;i<m.length;i++)if(t.indexOf(m[i][0])>=0)return m[i][1];
  return '';

function buildPath(p){
  var ps=PS(p),plan=(p.plan||[]).map(function(x){return typeof x==='string'?{text:x,do:inferDo(x)}:{text:x.text,do:typeof x.do==='string'?x.do:inferDo(x.text)}});
  var seenDo={};
  plan.forEach(function(s){if(s.do&&seenDo[s.do])s.do='';else if(s.do)seenDo[s.do]=true});
  /* every kind of content the pack has gets a place on the path, in a fixed order, even if the plan text misses it */
  var ORDER=['lessons','read','script','quiz','questions','numbers'],
    HAVE={lessons:L_(p).length,read:chaptersOf(p).length,script:sentsOf(p).length,quiz:quizOf(p).length,questions:qaOf(p).length,numbers:numsOf(p).length},
    DEF={lessons:'Learn the lessons, one card at a time.',read:'Read the chapters at your own pace.',script:'Read your script aloud with the timer.',quiz:'Do the quiz.',questions:'Practise the questions out loud.',numbers:'Go over the numbers.'};
  ORDER.forEach(function(k,oi){
    if(!HAVE[k]||plan.some(function(s){return s.do===k}))return;
    var at=plan.length;
    for(var j=0;j<plan.length;j++)if(ORDER.indexOf(plan[j].do)>oi){at=j;break}
    plan.splice(at,0,{text:DEF[k],do:k});
  });
  var units=[],flat=[];
  plan.forEach(function(s,si){
    var nodes=[];
    if(s.do==='lessons'){
      L_(p).forEach(function(l,i){
        var st=ps.lessons[l.id]||{},n=l.cards.length,seen=Math.min(st.seen||0,n);
        nodes.push({id:'node-lesson-'+i,kind:'lessons',idx:i,num:i+1,title:l.title,
          detail:'Lesson '+(i+1)+' · '+(st.done?'Done':seen>0?seen+' of '+n+' cards':n+' cards'),
          done:!!st.done,frac:st.done?1:seen/n,aria:'Lesson '+(i+1)+', '+l.title});
      });
    }else if(s.do==='read'&&chaptersOf(p).length){
      var c=chaptersOf(p).length,r=chaptersRead(p);
      nodes.push({id:'node-read-0',kind:'read',idx:0,icon:'read',title:'Read the chapters',
        detail:r>=c?'All read':r>0?r+' of '+c+' read':c+' chapters',done:r>=c,frac:r/c,aria:'Read the chapters'});
    }else if(s.do==='script'&&sentsOf(p).length){
      for(var k=0;k<2;k++){
        var run=ps.runs[k];
        nodes.push({id:'node-script-'+k,kind:'script',idx:k,icon:'mic',title:'Practice run '+(k+1),
          detail:run?'Done in '+mmss(run.secs):'3-minute timer',done:!!run,frac:run?1:0,aria:'Practice run '+(k+1)});
      }
    }else if(s.do==='quiz'&&quizOf(p).length){
      var qn=quizOf(p).length,b=quizScore(p);
      nodes.push({id:'node-quiz-0',kind:'quiz',idx:0,icon:'quiz',title:'Quiz',
        detail:b>0?'Best: '+b+' of '+qn:qn+' questions',done:b>=Math.ceil(qn*0.8),frac:b/qn,aria:'Quiz'});
    }else if(s.do==='questions'&&qaOf(p).length){
      var an=qaOf(p).length,g=qaGot(p);
      nodes.push({id:'node-questions-0',kind:'questions',idx:0,icon:'qa',title:'Questions',
        detail:g>=an?'All got it':g>0?g+' of '+an+' got it':an+' questions',done:g>=an,frac:g/an,aria:'Questions'});
    }else if(s.do==='numbers'&&numsOf(p).length){
      var nn=numsOf(p).length,nd=!!ps.numbersDone;
      nodes.push({id:'node-numbers-0',kind:'numbers',idx:0,icon:'hash',title:'The numbers',
        detail:nd?'Done':nn+' numbers',done:nd,frac:nd?1:0,aria:'The numbers'});
    }
    units.push({n:si+1,text:s.text,nodes:nodes,done:nodes.length>0&&nodes.every(function(x){return x.done})});
    nodes.forEach(function(x){flat.push(x)});
  });
  var curNode=null;
  for(var i=0;i<flat.length;i++){if(!flat[i].done){curNode=flat[i];break}}
  flat.forEach(function(x,i){x.pos=i;x.cur=(x===curNode)});
  return {units:units,nodes:flat,cur:curNode,allDone:flat.length>0&&!curNode,finishPos:flat.length};
}

var AC=null;

function note(freq,start,dur,peak,type,freq2){
  if(!AC)return;
  try{
    var t=AC.currentTime+start,o=AC.createOscillator(),g=AC.createGain();

    if(freq2)o.frequency.exponentialRampToValueAtTime(freq2,t+dur*0.78);
    g.gain.setValueAtTime(0.0001,t);

    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);

  }catch(e){}
}

  if(!SYN)return;

  if(!vs.length)return;
  var en=vs.filter(function(v){return /^en/i.test(v.lang)});
  var f=null;
  function find(fn){return en.filter(fn)[0]}
  f=find(function(v){return /enhanced|premium/i.test(v.name)});
  if(!f){var names=['Samantha','Daniel','Karen','Moira','Serena','Google UK English Female','Google US English'];
    for(var i=0;i<names.length&&!f;i++)f=find(function(v){return v.name.indexOf(names[i])>=0})}
  if(!f)f=find(function(v){return v.lang==='en-GB'||v.lang==='en-US'});

}

    var u=new SpeechSynthesisUtterance(speechText(txt));
    if(voice){u.voice=voice;u.lang=voice.lang}else u.lang='en-GB';
    u.rate=0.95;u.pitch=1;

      if(onItem)onItem(i);
    };
    var fin=function(){
      if(tok!==speakToken)return;
      if(i===list.length-1){speaking=false;speakKey=null;clearSpeaking();updateListenUI();if(onEnd)onEnd()}

/* ---------- overlay manager ---------- */

}

}

var doneTimers=[];
function playDone(id){
  var d=$(id);if(!d)return;
  doneTimers.forEach(clearTimeout);doneTimers=[];
  var bs=qsa('.stat b',d);
  if(rm()){
    d.classList.add('shown');
    bs.forEach(function(b){b.textContent=b.getAttribute('data-to')+b.getAttribute('data-suf')});
    return;
  }
  requestAnimationFrame(function(){requestAnimationFrame(function(){d.classList.add('play')})});
  doneTimers.push(later(function(){d.classList.add('ready')},1000));
  doneTimers.push(later(function(){playSound('success')},600));
  bs.forEach(function(b,i){
    doneTimers.push(later(function(){playSound('tick');countUp(b,0,+b.getAttribute('data-to'),700,b.getAttribute('data-suf'))},1100+i*100));
  });
}

window.addEventListener('scroll',function(){

      var m=/^ch-(\d+)-p-(\d+)$/.exec(ps[i].id);

/* ---------- lesson session ---------- */
var LS=null,sw=null;
function lessonCardHTML(i){

  return '<div class="kicker">'+T(l.title)+' · '+(i+1)+' of '+l.cards.length+'</div><h2>'+T(c.title)+'</h2><p>'+T(c.body)+'</p>'+

function lessonDots(){
  var n=L_(cur)[LS.i].cards.length,h='';
  for(var k=0;k<n;k++)h+='<span class="dot"></span>';
  $('lesson-dots').innerHTML=h;
}
function lessonSync(){
  var l=L_(cur)[LS.i],n=l.cards.length;
  qsa('.dot',$('lesson-dots')).forEach(function(d,k){d.className='dot'+(k<LS.card?' seen':k===LS.card?' cur':'')});
  $('lesson-back').disabled=LS.card===0;
  $('lesson-next').textContent=LS.card===n-1?'Finish':'Next';
}
function lessonListenBtn(){
  var w=$('lesson-listen-wrap');
  w.innerHTML=SYN?'<button class="icon-btn" id="lesson-listen" type="button" data-lk="lesson" aria-label="Listen to this lesson" aria-pressed="false">'+ic('vol')+'</button>':'<span class="slot44"></span>';
}
function openLesson(i){
  var p=cur,ls=L_(p);
  if(!ls[i])return;
  stopSpeech();
  var st=PS(p).lessons[ls[i].id]||{};
  var n=ls[i].cards.length;
  LS={i:i,card:st.done?0:clamp(st.card||0,0,n-1),t0:Date.now(),done:false,cardAt:performance.now(),quick:0};
  $('lesson-top').hidden=false;$('lesson-body').hidden=false;$('lesson-actions').hidden=false;$('lesson-donebox').hidden=true;
  lessonDots();lessonListenBtn();
  var c=$('lesson-card');c.className='lcard';c.innerHTML=lessonCardHTML(LS.card);
  lessonSync();
  $('lesson-body').scrollTop=0;
  $('lesson').hidden=false;
  lessonSave();
  pushLayer($('lesson'),closeLesson,$('lesson-close'),true);
  announce('Card '+(LS.card+1)+' of '+n+'.');
}
function lessonSave(){
  var p=cur,l=L_(p)[LS.i],ps=PS(p),st=ps.lessons[l.id]||(ps.lessons[l.id]={});
  st.card=LS.card;st.seen=Math.max(st.seen||0,LS.card+1);
  saveP(p);
}
function closeLesson(){
  var el=$('lesson');if(el.hidden)return;
  stopSpeech();
  el.hidden=true;LS&&(LS.open=false);
  popLayer(el);
  doneTimers.forEach(clearTimeout);
  refresh();
}
function lessonGo(n,dir,ghostRight){
  var l=L_(cur)[LS.i],card=$('lesson-card'),stack=$('lesson-stack');
  if(performance.now()-LS.cardAt<2000&&!speaking)LS.quick++;
  LS.cardAt=performance.now();
  var gf=LS.ghostFrom||'';LS.ghostFrom=null;
  if((dir>0||ghostRight)&&!rm()){
    var g=card.cloneNode(true);g.removeAttribute('id');g.className='lcard ghost-out'+(dir<0?' to-right':'');
    g.style.transform=gf;stack.appendChild(g);later(function(){if(g.parentNode)g.parentNode.removeChild(g)},440);
  }
  LS.card=n;
  card.innerHTML=lessonCardHTML(n);
  card.classList.remove('in','in-back');reflow(card);card.classList.add(dir>0?'in':'in-back');
  card.style.transform='';
  $('lesson-body').scrollTop=0;
  lessonSync();lessonSave();
  announce('Card '+(n+1)+' of '+l.cards.length+'.');
}
function lessonNext(){
  var l=L_(cur)[LS.i],was=speaking&&speakKey==='lesson';
  if(LS.card>=l.cards.length-1){lessonFinish();return}
  lessonGo(LS.card+1,1);playSound('tick');
  if(was)lessonListen();
}
function lessonBack(sw_){
  if(LS.card<=0)return;
  var was=speaking&&speakKey==='lesson';
  lessonGo(LS.card-1,-1,sw_===true);
  if(was)lessonListen();
}
function lessonListen(){
  var l=L_(cur)[LS.i],list=[];
  for(var k=LS.card;k<l.cards.length;k++){var c=l.cards[k];list.push(c.title+'. '+c.body+(c.example?' For example: '+c.example:''))}
  var base=LS.card;
  speakList(list,'lesson',function(i){if(base+i!==LS.card)lessonGo(base+i,1)});
}
function lessonFinish(){
  var p=cur,l=L_(p)[LS.i],ps=PS(p),st=ps.lessons[l.id]||(ps.lessons[l.id]={});
  LS.ghostFrom=null;
  if(performance.now()-LS.cardAt<2000&&!speaking)LS.quick++;
  stopSpeech();
  var quick=LS.quick>Math.floor(l.cards.length/2)&&!st.done;
  if(quick){st.seen=Math.min(st.seen||0,l.cards.length-1);st.card=0}
  else{st.done=true;st.seen=l.cards.length;st.card=0;if(!st.doneAt)st.doneAt=new Date().toISOString()}
  saveP(p);
  var mins=Math.max(1,Math.round((Date.now()-LS.t0)/60000)),rd_=readiness(p),ls=L_(p),nextI=-1;
  for(var k=1;k<ls.length;k++){var j=(LS.i+k)%ls.length;if(!(ps.lessons[ls[j].id]||{}).done){nextI=j;break}}
  LS.done=true;
  var btns=[];
  if(nextI>=0){btns.push({id:'lesson-done-next',t:'Next lesson'});btns.push({id:'lesson-done-home',t:'Back to Home',plain:true})}
  else btns.push({id:'lesson-done-home',t:'Back to Home'});
  $('lesson-top').hidden=true;$('lesson-body').hidden=true;$('lesson-actions').hidden=true;
  var db=$('lesson-donebox');
  db.innerHTML=doneHTML({id:'lesson-done',title:'Lesson done!',line:quick?'That was quick. Go through it once more to count it.':'Lesson '+(LS.i+1)+' of '+ls.length+': '+l.title,
    stats:[{v:l.cards.length,l:l.cards.length===1?'card':'cards'},{v:mins,l:mins===1?'minute':'minutes'},{v:rd_,l:'ready',suf:'%',g:true}],buttons:btns});
  db.hidden=false;
  LS.nextI=nextI;
  playDone('lesson-done');
  announce('Lesson done.');
  var f=$('lesson-done-next')||$('lesson-done-home');if(f)f.focus({preventScroll:true});
}
$('lesson-close').addEventListener('click',closeLesson);
$('lesson-next').addEventListener('click',lessonNext);
$('lesson-back').addEventListener('click',function(){lessonBack()});
$('lesson-top').addEventListener('click',function(e){
  if(e.target.closest('#lesson-listen')){if(speaking&&speakKey==='lesson')stopSpeech();else lessonListen()}
});
$('lesson-donebox').addEventListener('click',function(e){
  if(e.target.closest('#lesson-done-next')){var n=LS.nextI;closeLesson();openLesson(n);return}

});
document.addEventListener('keydown',function(e){
  var t=topLayer();if(!t||t.el.id!=='lesson'||!LS||LS.done)return;
  if(e.key==='ArrowRight'){e.preventDefault();lessonNext()}
  else if(e.key==='ArrowLeft'){e.preventDefault();lessonBack()}
});
/* swipe */
(function(){
  var st=$('lesson-stack');
  st.addEventListener('pointerdown',function(e){
    if(!LS||LS.done||e.button>0)return;
    sw={x:e.clientX,y:e.clientY,t:performance.now(),drag:false,id:e.pointerId,dx:0};
  });
  st.addEventListener('pointermove',function(e){
    if(!sw||e.pointerId!==sw.id)return;
    var dx=e.clientX-sw.x,dy=e.clientY-sw.y,card=$('lesson-card');
    if(!sw.drag){
      if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)){sw.drag=true;try{card.setPointerCapture(e.pointerId)}catch(er){}card.style.animation='none';card.style.transition='none'}
      else return;
    }
    sw.dx=dx;
    if(!rm())card.style.transform='translateX('+dx+'px) rotate('+clamp(dx/20,-6,6)+'deg)';
  });
  function end(e){
    if(!sw||e.pointerId!==sw.id)return;
    var s=sw;sw=null;
    if(!s.drag)return;
    var card=$('lesson-card'),dx=s.dx,v=dx/Math.max(1,performance.now()-s.t);
    card.style.animation='';
    if(e.type!=='pointercancel'&&(Math.abs(dx)>80||(Math.abs(dx)>30&&Math.abs(v)>0.5))){
      var next=dx<0,tf=card.style.transform;
      if(next){card.style.transition='';LS.ghostFrom=tf;lessonNextSwipe()}
      else if(LS.card>0){card.style.transition='';LS.ghostFrom=tf;lessonBack(true)}
      else springBack(card);
    }else springBack(card);
  }
  function springBack(card){
    card.style.transition='transform var(--dur-quick) var(--ease-quick)';card.style.transform='';
    later(function(){card.style.transition=''},420);
  }
  function lessonNextSwipe(){lessonNext()}
  st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);
})();

  if(TM.state==='running'){
    var el=elapsedMs();

    if(el>600000){TM.acc+=performance.now()-TM.seg0;TM.state='paused';syncRunning();var b=$('timer-btns');if(b)b.removeAttribute('data-st')}
  }

}
function timerAction(id){
  if(id==='timer-start'){

  }else if(id==='timer-pause'){TM.acc+=performance.now()-TM.seg0;TM.state='paused'}
  else if(id==='timer-resume'){TM.seg0=performance.now();TM.state='running'}
  else if(id==='timer-reset'){resetTimer()}

  if(!n)return emptyHTML('qa','No questions in this pack.','');
  var got=qaGot(p),left=n-got;
  var h='<div class="card start"><div class="start-icon">'+ic('qa')+'</div><h2>'+plural(n,'question')+'</h2>'+
    '<div class="prog-line"><b>Got it</b><span>'+got+' of '+n+'</span></div><div class="pbar" style="--p:'+(got/n)+'"><i></i></div>'+
    '<p>'+(isExam(p)?'Answer out loud or on paper, then reveal and compare. A strong exam answer gives a definition, the points, and one example from the slides.':'Think of your answer and say it out loud. Then reveal and compare. If a question goes past what you know, say you didn\'t find it, then give the closest fact you do know.')+'</p><div class="btn-stack">';
  if(got===0)h+='<button class="btn" id="qa-start" type="button">Start questions</button>';
  else if(left>0)h+='<button class="btn" id="qa-start" type="button">Practise the '+left+' left</button><button class="btn plain" id="qa-all" type="button">All '+n+' questions</button>';
  else h+='<button class="btn" id="qa-start" type="button">Practise all '+n+' again</button>';
  h+='</div></div><div class="sec"><h2>All questions</h2><p>Tap one to practise it.</p></div><div style="height:15px"></div>';
  qs_.forEach(function(q,i){
    h+='<button class="qrow row-press" id="qa-row-'+i+'" type="button" data-i="'+i+'">'+qaStatusIcon(ps.qa.status[i])+'<span class="qrow-text"><b>'+T(q.q)+'</b><span>'+(q.who==='lecturer'?'Lecturer':q.who==='exam'?'Exam':'Classmate')+'</span></span></button>';
  });
  return h;
}
function renderQA(){$('qa-body').innerHTML=qaStartHTML();syncSoundBtns()}
R.qa=renderQA;
$('qa-body').addEventListener('click',function(e){
  var r=e.target.closest('.qa-row,.qrow');
  if(r){openQaRound(+r.getAttribute('data-i'));return}
  if(e.target.closest('#qa-all')){openQaRound('all');return}
  if(e.target.closest('#qa-start')){
    var n=qaOf(cur).length,got=qaGot(cur);
    openQaRound(got>0&&got<n?'left':'all');
  }
});
function openQaRound(mode){
  var p=cur,ps=PS(p),qs_=qaOf(p);if(!qs_.length)return;
  stopSpeech();
  var idx=qs_.map(function(_,i){return i}),queue;
  if(typeof mode==='number')queue=[mode];
  else if(mode==='left'){queue=idx.filter(function(i){return ps.qa.status[i]!=='got'});if(!queue.length)queue=idx}
  else queue=idx;
  QA={all:queue.slice(),queue:queue.slice(),total:queue.length,done:0,retried:{},single:typeof mode==='number',revealed:false,t0:Date.now(),fin:false,from:curScreen,revealAt:0};
  $('qa-top').hidden=false;
  $('qa-run').hidden=false;
  syncSoundBtns();
  showQaQ(false);
  pushLayer($('qa-run'),closeQa,$('qa-close'),true);
}
function qaBar(){$('qa-bar').style.setProperty('--p',QA.done/QA.total)}
function showQaQ(anim){
  var q=qaOf(cur)[QA.queue[0]];QA.revealed=false;
  var h='<div class="qwrap'+(anim?' in':'')+'"><div class="card qa-card"><span class="pill">'+(q.who==='lecturer'?'Lecturer asks':q.who==='exam'?'Exam question':'Classmate asks')+'</span><div class="qa-q">'+T(q.q)+'</div><p class="qa-think" id="qa-think">'+(q.who==='exam'?'Think first. Say or jot down your answer.':'Think first. Say your answer out loud.')+'</p>'+
    '<div class="reveal" id="qa-reveal-box" inert><div><div class="qa-ans"><div class="qa-ans-h"><span>'+(q.who==='exam'?'A strong answer':'You could say')+'</span>'+(SYN?'<button class="icon-btn sm" id="qa-listen" type="button" data-lk="qa" aria-label="Listen to the answer" aria-pressed="false">'+ic('vol')+'</button>':'')+'</div><p>'+T(q.answer)+'</p></div></div></div></div></div>';
  var body=$('qa-round');body.innerHTML=h;body.scrollTop=0;
  $('qa-actions').innerHTML='<div class="actions" style="grid-template-columns:1fr"><button class="btn" id="qa-reveal" type="button">Show answer</button></div>';
  qaBar();
  var rv=$('qa-reveal');try{rv.focus({preventScroll:true})}catch(e){}
  announce('Question '+(QA.done+1)+' of '+QA.total+'.');
}
function qaReveal(){
  if(!QA||QA.revealed)return;
  QA.revealed=true;QA.revealAt=performance.now();
  var rb=$('qa-reveal-box');rb.classList.add('is-open');rb.removeAttribute('inert');
  var th=$('qa-think');if(th)th.hidden=true;
  $('qa-actions').innerHTML='<div class="actions even"><button class="btn plain" id="qa-again" type="button">Again</button><button class="btn" id="qa-gotit" type="button">Got it</button></div>';
  playSound('tick');updateListenUI();
  var g=$('qa-gotit');try{g.focus({preventScroll:true})}catch(e){}
  later(function(){var a=qs('#qa-round .qa-ans');if(a)a.scrollIntoView({block:'nearest',behavior:rm()?'auto':'smooth'})},120);
}
function qaMark(got){
  if(!QA||!QA.revealed||QA.fin||performance.now()-(QA.revealAt||0)<400)return;
  stopSpeech();
  var ps=PS(cur),i=QA.queue.shift();
  ps.qa.status[i]=got?'got':'again';saveP(cur);
  playSound('tick');
  if(!got&&!QA.retried[i]&&!QA.single){QA.retried[i]=true;QA.queue.splice(Math.min(2,QA.queue.length),0,i)}
  else QA.done++;
  qaBar();
  if(!QA.queue.length){qaFinish();return}
  showQaQ(true);
}
function closeQa(){
  var el=$('qa-run');if(el.hidden)return;
  stopSpeech();el.hidden=true;popLayer(el);
  doneTimers.forEach(clearTimeout);
  refresh();
}
function qaFinish(){
  QA.fin=true;
  var p=cur,ps=PS(p),qs_=qaOf(p),n=QA.total;
  var gotRound=0,againRound=0;
  QA.all.forEach(function(i){if(ps.qa.status[i]==='got')gotRound++;else againRound++});
  if(QA.single){closeQa();announce(gotRound?'Marked as got it.':'Marked for another go.');return}
  var left=qs_.filter(function(_,i){return ps.qa.status[i]!=='got'}).length;
  var line=QA.single?(gotRound?'Marked as got it.':'Marked for another go.'):gotRound+' of '+n+' marked got it.';
  var btns=[];
  if(left>0){btns.push({id:'qa-done-again',t:'Practise the '+left+' left'});btns.push({id:'qa-done-home',t:QA.from==='home'?'Back to Home':'Done',plain:true})}
  else btns.push({id:'qa-done-home',t:QA.from==='home'?'Back to Home':'Done'});
  $('qa-top').hidden=true;$('qa-actions').innerHTML='';
  $('qa-round').innerHTML=doneHTML({id:'qa-done',title:'Questions done!',line:line,
    stats:[{v:gotRound,l:'got it'},{v:againRound,l:'again'},{v:readiness(p),l:'ready',suf:'%',g:true}],buttons:btns});
  playDone('qa-done');
  announce('Questions done.');
  var f=$('qa-done-again')||$('qa-done-home');if(f)f.focus({preventScroll:true});
}
$('qa-close').addEventListener('click',closeQa);
$('qa-run').addEventListener('click',function(e){
  if(e.target.closest('#qa-reveal'))qaReveal();
  else if(e.target.closest('#qa-gotit'))qaMark(true);
  else if(e.target.closest('#qa-again'))qaMark(false);
  else if(e.target.closest('#qa-listen')){
    if(speaking&&speakKey==='qa'){stopSpeech();return}
    speakList([qaOf(cur)[QA.queue[0]].answer],'qa');
  }
  else if(e.target.closest('#qa-done-again')){var qaf=QA&&QA.from;closeQa();openQaRound('left');if(QA)QA.from=qaf}
  else if(e.target.closest('#qa-done-home')){var qh=QA&&QA.from==='home';closeQa();if(qh)goTab('home')}
});
document.addEventListener('keydown',function(e){
  var t=topLayer();if(!t||t.el.id!=='qa-run'||!QA||QA.fin)return;
  if(e.key==='Enter'&&!QA.revealed&&document.activeElement.id!=='qa-reveal'){e.preventDefault();qaReveal()}
  else if(QA.revealed&&e.key==='1')qaMark(false);
  else if(QA.revealed&&e.key==='2')qaMark(true);
});
['quiz-sound','qa-sound','quiz-run-sound','qa-run-sound'].forEach(function(id){$(id).addEventListener('click',toggleSound)});

/* ---------- init ---------- */
document.addEventListener('touchstart',function(){},{passive:true});
function showError(){
  $('app').innerHTML=emptyHTML('pres','Nothing to study yet','The study content could not be read.');
  $('tabbar').hidden=true;
}
/* focus ring only for keyboard users: scripted focus after a tap should not draw it */
document.documentElement.classList.add('pointer');
document.addEventListener('pointerdown',function(){document.documentElement.classList.add('pointer')},true);
document.addEventListener('keydown',function(e){if(e.key==='Tab'||e.key==='Enter'||e.key===' '||(e.key&&e.key.indexOf('Arrow')===0))document.documentElement.classList.remove('pointer')},true);
function init(){
  if(bad){showError();return}
  setSelected(pickInitialPack());
  syncSoundBtns();
  updateBadges();
  route();
  setInterval(studyTick,5000);
  setInterval(updateCountdown,20000);
  if(window.matchMedia){
    var mq=window.matchMedia('(prefers-reduced-motion: reduce)');
    if(mq.addEventListener)mq.addEventListener('change',function(){});
  }
  window.addEventListener('load',function(){placeHl(true);watchHeader()});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){placeHl(true)});
}
init();

})();
</script>

<script>if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {})); }</script>
