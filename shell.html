*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}

body{margin:0;background:var(--bg);color:var(--ink);font:var(--t-body);-webkit-font-smoothing:antialiased}

:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

/* shell */
.app{max-width:var(--col);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(112px + env(safe-area-inset-bottom,0px))}
.screen{display:none}

.hdr{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;margin-left:calc(-1*var(--gl));margin-right:calc(-1*var(--gr));padding:calc(6px + env(safe-area-inset-top,0px)) var(--gr) 8px var(--gl);background:var(--bg);transition:box-shadow .2s ease}

.hdr .icon-btn{position:relative;z-index:1}

/* round icon button (LangOS ChunkyIconStyle) */
.icon-btn{--face:var(--surface);--edge:var(--border);--line:var(--border);--ico:var(--muted);flex:none;display:grid;place-items:center;width:44px;height:44px;margin-bottom:var(--lip-sm);padding:0;border:2px solid var(--line);border-radius:50%;background:var(--face);color:var(--ico);box-shadow:0 var(--lip-sm) 0 var(--edge);transition:transform var(--dur-press) var(--ease-press),box-shadow var(--dur-press) var(--ease-press)}

.slot44{flex:none;width:44px;height:47px}

.streak.flare{animation:badgeSwell 1350ms both}

/* chunky button (LangOS ChunkyButtonStyle) */
.btn{--face:var(--green);--edge:var(--green-lip);--line:var(--green);--label:var(--on-color);--l:var(--lip);display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;margin:0 0 var(--l);padding:12px 18px;border:2px solid var(--line);border-radius:var(--r-btn);background:var(--face);color:var(--label);box-shadow:0 var(--l) 0 var(--edge);font:var(--t-button);text-transform:uppercase;letter-spacing:.6px;text-align:center;transition:transform var(--dur-press) var(--ease-press),box-shadow var(--dur-press) var(--ease-press)}

.gbar i{display:block;width:calc(var(--p) * 100%);height:100%;border-radius:var(--r-pill);background:var(--green);transition:width var(--dur-gentle) var(--ease-gentle)}
.gbar.orange i{background:var(--orange)}
.foot{margin:10px 0 0;font:500 13px/1.4 var(--font-ui);color:var(--muted)}

/* streak card (LangOS StreakCard) */
.spop-scrim{position:fixed;inset:0;z-index:70;background:var(--scrim);opacity:0;transition:opacity .2s ease}
.spop-scrim.is-open{opacity:1}
.spop{position:fixed;z-index:71;top:calc(var(--hdr-h) - 2px);left:var(--gl);right:var(--gr);max-width:528px;margin:0 auto;transform-origin:calc(100% - 22px) -10px;transform:scale(.6);opacity:0;transition:transform var(--dur-card) var(--ease-card),opacity .2s ease}
.spop.is-open{transform:none;opacity:1}
.s-head{display:flex;align-items:center;gap:12px}
.flame-disc{flex:none;display:grid;place-items:center;width:54px;height:54px;border-radius:50%;background:var(--orange);color:var(--on-color);box-shadow:0 var(--lip-sm) 0 var(--orange-lip)}
.flame-disc .ic{width:28px;height:28px}
.s-title{font:var(--t-title2)}
.s-sub{font:var(--t-sub);color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);margin-top:18px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px}
.day i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--sunken)}
.day.met i{background:var(--orange);color:var(--on-color)}
.day.today:not(.met) i{border:2.5px solid var(--orange);background:none}
.day i .ic{width:14px;height:14px;stroke-width:3.5}
.day span{font:700 12px/1 var(--font-ui);color:var(--muted)}
.day.today span{color:var(--ink)}
.goal{margin-top:18px;padding-top:14px;border-top:2px solid var(--border)}
.goal .part-check{background:var(--orange)}
.lbl{margin-top:14px;font:var(--t-detail);color:var(--muted)}

/* done screen (LangOS DoneMark) */
.done{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;padding:24px 0;text-align:center}
.dm{position:relative;width:96px;height:96px}
.dm .ring-svg{width:96px;height:96px}
.dm .trk{stroke:var(--border);stroke-width:5}
.dm .arc{stroke:var(--green);stroke-width:5;stroke-linecap:round;stroke-dasharray:285.88;stroke-dashoffset:285.88}
.dm .disc{position:absolute;inset:12px;display:grid;place-items:center;border-radius:50%;background:var(--green);color:var(--bg);transform:scale(0)}
.dm .disc .ic{width:36px;height:36px;stroke-width:3.5}
.done h2{margin:16px 0 var(--sp-heading);font:var(--t-title)}
.done p{margin:0;font:var(--t-body);color:var(--muted)}
.done-text,.done .btn-stack{opacity:0;transform:translateY(8px)}
.done .stats{opacity:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;margin-top:20px}
.stat{padding:12px 6px;text-align:center}
.stat b{display:block;font:var(--t-stat);font-variant-numeric:tabular-nums}
.stat span{font:var(--t-caption);color:var(--muted)}
.stat.g b{color:var(--accent-text)}
.new-best{margin-top:12px;opacity:0}
.done.play .dm .arc{stroke-dashoffset:0;transition:stroke-dashoffset 650ms var(--ease-draw)}
.done.play .dm .disc{transform:scale(1);transition:transform var(--dur-pop) var(--ease-pop) 500ms}
.done.play .done-text{opacity:1;transform:none;transition:opacity .4s ease-out 850ms,transform .4s ease-out 850ms}
.done.play .stats{opacity:1;transition:opacity .3s ease-out 1050ms}
.done.play .new-best{animation:popIn var(--dur-pop) var(--ease-pop) 1400ms both}
.done.play .btn-stack{opacity:1;transform:none;transition:opacity .4s ease-out 1000ms,transform .4s ease-out 1000ms}
.done.shown .dm .arc{stroke-dashoffset:0}.done.shown .dm .disc,.done.shown .done-text,.done.shown .btn-stack{transform:none}.done.shown .done-text,.done.shown .stats,.done.shown .btn-stack,.done.shown .new-best{opacity:1}

/* empty and error states */
.empty{display:flex;flex-direction:column;align-items:center;padding:48px 8px 0;text-align:center}
.empty .ic{width:64px;height:64px;stroke-width:2;color:var(--accent-text)}
.empty h2{margin:16px 0 var(--sp-heading);font:var(--t-title2)}
.empty p{max-width:300px;margin:0;font:var(--t-body);color:var(--muted)}
.empty .btn{max-width:320px;margin-top:var(--sp-buttons)}

/* lock page scroll under overlays */
.is-locked,.is-locked body{overflow:hidden}

/* reduced motion: springs become short eases, sliding becomes fading */
@media (prefers-reduced-motion:reduce){
:root{--ease-press:linear;--ease-quick:ease-in-out;--ease-gentle:ease-in-out;--ease-pop:ease-out;--ease-card:ease-in-out;--dur-press:1ms;--dur-quick:150ms;--dur-gentle:200ms;--dur-pop:150ms;--dur-card:200ms}
.screen.is-on{animation-name:fadeIn}
.node-row.is-current .node-wrap,.node-row.just-done .node .ic,.streak.flare,.streak.flare .flame,.streak.flare::before,.streak.flare .arc,.opt.bad{animation:none!important}
.lcard.in,.lcard.in-back,.qwrap.in{animation:fadeIn 200ms ease both}
.lcard.ghost-out{animation:none;display:none}
.sheet,.fb{transform:none;opacity:0;transition:opacity .2s ease}
.sheet.is-open,.fb.is-open{opacity:1}
.spop{transform:none}
.tabbar.is-hidden{transform:none;opacity:0;pointer-events:none;transition:opacity .2s ease}
}

/* extensions: same tokens and values only */
.node-row.is-finish{pointer-events:none}
#screen-read .hdr.is-scrolled{box-shadow:none}
.icon-btn:disabled{opacity:.5}
.node-label .pill{align-self:flex-start}
.chev{flex:none}
.opt .ot{flex:1;min-width:0}
.fact{display:block;width:100%;margin-top:var(--sp-section);text-align:left}
.fact .fact-b{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fact-k{display:flex;align-items:center;gap:8px;font:var(--t-label);color:var(--accent-text)}
.fact-title{margin-top:4px;font:var(--t-headline)}
.fact-b{margin:6px 0 0;font:var(--t-callout)}
.fact-card{margin-bottom:var(--sp-list)}
.fact-card .scope{margin-top:12px}
.fact-card .scope b{color:var(--accent-text)}
.fact-card .fact-more{margin:12px 0 0}
.fact-card .reveal .blk:first-child{margin-top:12px}
.numbers-mark{margin-top:13px}
.crow{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 var(--sp-list);padding:12px 14px;text-align:left;background:var(--surface);border:2px solid var(--border);border-radius:var(--r-card);box-shadow:0 var(--lip-sm) 0 var(--border)}
.cdisc{flex:none;display:grid;place-items:center;width:32px;height:32px;border:2px solid var(--border);border-radius:50%;background:var(--sunken);color:var(--muted);font:800 14px/1 var(--font-ui)}
.cdisc.isread{border-color:var(--green);background:var(--green);color:var(--on-color)}
.cdisc .ic{width:16px;height:16px;stroke-width:3.5}
.crow-t{flex:1;min-width:0;font:var(--t-row)}
.sec-first{margin-top:var(--sp-section)}
.qa-body{padding-top:4px}
.s-body .qa-card .pill{margin-bottom:0}
#streak-card:focus{outline:none}
.done .btn-stack{width:100%;pointer-events:none}
.done.ready .btn-stack,.done.shown .btn-stack{pointer-events:auto}
.is-practising #script-seg{display:none}
.pointer :focus-visible{outline:none}

/* storage notice on Home */
.notice{display:grid;gap:var(--sp-inline);margin-bottom:calc(var(--sp-stack) + var(--lip-sm))}
.notice.warn{border-color:var(--orange);box-shadow:0 var(--lip-sm) 0 var(--orange-lip)}
.notice p{margin:0}
.notice-title{font:800 17px/1.25 var(--font-ui);color:var(--ink)}
.notice-text{font:600 15px/1.45 var(--font-ui);color:var(--muted)}
.notice .btn{width:auto;justify-self:start;margin-top:4px}

<script>
(function(){
'use strict';
/* ---------- core: helpers, storage, content ---------- */
var $=function(id){return document.getElementById(id)};
var qs=function(s,r){return (r||document).querySelector(s)};
var qsa=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function T(s){return esc(s).replace(/\b(Ray-Ban|\d+-[A-Za-z]+)\b/g,'<span class="nw">$1</span>')}
function cap(s){s=String(s||'');return s.charAt(0).toUpperCase()+s.slice(1)}
function ic(n,c){return '<svg class="ic'+(c?' '+c:'')+'" aria-hidden="true"><use href="#i-'+n+'"/></svg>'}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function pad(n){return (n<10?'0':'')+n}
function plural(n,w,ws){return n+' '+(n===1?w:(ws||w+'s'))}
function mmss(sec){sec=Math.max(0,Math.round(sec));return Math.floor(sec/60)+':'+pad(sec%60)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function rm(){return !!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)}
function later(fn,ms){return setTimeout(fn,ms)}
function reflow(el){void el.offsetHeight}

/* ---------- storage (always in memory, localStorage optional) ---------- */
var store=null,storeOK=true;
try{store=window.localStorage;store.setItem('prep.v1.t','1');store.removeItem('prep.v1.t')}catch(e){store=null;storeOK=false}
/* Home Screen app or plain browser tab; ask the browser to keep this site's storage (Safari 17+, Chrome). */
var standalone=!!(window.navigator.standalone||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches));
try{if(storeOK&&navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){})}catch(e){}
function rd(k){if(!store)return null;try{var v=store.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function wr(k,v){if(!store)return;try{store.setItem(k,JSON.stringify(v))}catch(e){storeOK=false}}

function obj(v){return v&&typeof v==='object'&&!Array.isArray(v)?v:{}}
var G=obj(rd('prep.v1.global'));
G.days=obj(G.days);G.best=+G.best||0;G.goal=[5,10,15,20].indexOf(G.goal)>=0?G.goal:10;
if(G.sound===undefined)G.sound=true;
G.hints=obj(G.hints);
function saveG(){wr('prep.v1.global',G)}
var PSm={};
function PS(p){
  if(!PSm[p.id]){
    var d=obj(rd('prep.v1.pack.'+p.id));
    d.lessons=obj(d.lessons);d.chapters=obj(d.chapters);d.runs=Array.isArray(d.runs)?d.runs:[];d.why=obj(d.why);
    d.quiz=obj(d.quiz);d.quiz.best=+d.quiz.best||0;d.quiz.lecBest=obj(d.quiz.lecBest);d.quiz.history=Array.isArray(d.quiz.history)?d.quiz.history:[];
    d.qa=obj(d.qa);d.qa.status=obj(d.qa.status);d.shown=+d.shown||0;
    PSm[p.id]=d;
  }
  return PSm[p.id];
}
function saveP(p){wr('prep.v1.pack.'+p.id,PSm[p.id])}

/* ---------- content ---------- */
var packs=[],bad=false;
try{
  var cj=JSON.parse($('content').textContent);
  packs=((cj&&cj.packs)||[]).filter(function(p){return p&&p.id}).map(normPack);
  if(!packs.length)bad=true;
}catch(e){bad=true}
/* Render only from normalised content: bad or missing parts are dropped, never thrown on. */
function normPack(p){
  p.lessons=(p.lessons||[]).filter(function(l){return l&&Array.isArray(l.cards)&&l.cards.length}).map(function(l,i){l.id=l.id||'lesson-'+i;return l});
  var s=p.script&&typeof p.script==='object'?p.script:{};
  Object.keys(s).forEach(function(k){
    var v=s[k];
    if(typeof v==='string')v=v.match(/[^.!?]+[.!?]+\S*\s*/g)||[v];
    s[k]=(Array.isArray(v)?v:[]).map(function(x){return typeof x==='string'?{sentence:x.trim()}:x}).filter(function(x){return x&&x.sentence});
  });
  p.script=s;
  p.quiz=(p.quiz||[]).filter(function(q){return q&&Array.isArray(q.options)&&q.options.length>1&&q.options[q.answer]!=null});
  p.questions=(p.questions||[]).filter(function(q){return q&&q.q&&q.answer});
  p.inspire=Array.isArray(p.inspire)?p.inspire.filter(function(f){return f&&f.fact}):[];
  p.glossary=(p.glossary||[]).filter(function(w){return w&&w.term});
  p.numbers=(p.numbers||[]).filter(function(n){return n&&n.value});
  return p;
}
function L_(p){return p.lessons||[]}
function chaptersOf(p){var r=p.read;if(!r)return[];if(Array.isArray(r))return r;return r.chapters||[]}
function quizOf(p){return p.quiz||[]}
/* Quiz items may carry a lecture number (exam packs); a round can then cover one lecture. */
function lecsOf(p){var c={};quizOf(p).forEach(function(q){if(q.lec)c[q.lec]=(c[q.lec]||0)+1});return Object.keys(c).map(Number).sort(function(a,b){return a-b}).map(function(k){return {lec:k,n:c[k]}})}
function isExam(p){return !!p&&p.kind==='exam'}
function qaOf(p){return p.questions||[]}
function numsOf(p){return p.numbers||[]}
function wordsOf(p){return p.glossary||[]}
function scriptParts(p){var s=p.script||{},o=[];Object.keys(s).forEach(function(k){if(s[k]&&s[k].length)o.push({key:k,list:s[k]})});return o}
function sentsOf(p){var o=[];scriptParts(p).forEach(function(pt){pt.list.forEach(function(s,i){o.push({part:pt.key,i:i,n:pt.list.length,s:s})})});return o}
function factsOf(p){var l=p.inspire;return Array.isArray(l)?l:[]}

/* ---------- time ---------- */
var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dayKey(ts){return fmtKey(new Date(ts-4*3600000))}
function shiftKey(k,n){var a=k.split('-');return fmtKey(new Date(+a[0],+a[1]-1,+a[2]+n))}
function keyDow(k){var a=k.split('-');return (new Date(+a[0],+a[1]-1,+a[2]).getDay()+6)%7}
function offMin(p){var m=/([+-])(\d\d):(\d\d)$/.exec(p.date||'');return m?(m[1]==='-'?-1:1)*(+m[2]*60+ +m[3]):0}
function startOf(p){return new Date(p.date).getTime()}
function wall(p,ts){return new Date(ts+offMin(p)*60000)}
function fmtWhen(p){var d=wall(p,startOf(p));return DAYS[d.getUTCDay()]+' '+d.getUTCDate()+' '+MONTHS[d.getUTCMonth()]+', '+pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())}
function fmtDate(p){var d=wall(p,startOf(p));return DAYS[d.getUTCDay()]+' '+d.getUTCDate()+' '+MONTHS[d.getUTCMonth()]}
function isUpcoming(p){return Date.now()<startOf(p)+2*3600000}
function shortTitle(p){var t=String(p.title||'');var i=t.indexOf(':');return i>0?t.slice(0,i):t}
function sinceStart(ts){var d=new Date(ts);return d}
function fmtRound(ts){
  var d=new Date(ts),n=new Date(),hm=pad(d.getHours())+':'+pad(d.getMinutes());
  if(fmtKey(d)===fmtKey(n))return 'Today, '+hm;
  return DAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()]+', '+hm;
}

/* ---------- selected pack ---------- */
var cur=null;
function pickInitialPack(){
  var sel=rd('prep.v1.selected'),saved=null;
  packs.forEach(function(p){if(p.id===sel)saved=p});
  var up=packs.filter(isUpcoming).sort(function(a,b){return startOf(a)-startOf(b)});
  var past=packs.filter(function(p){return !isUpcoming(p)}).sort(function(a,b){return startOf(b)-startOf(a)});
  if(saved&&isUpcoming(saved))return saved;
  if(up.length)return up[0];
  return saved||past[0]||packs[0];
}
function setSelected(p){cur=p;wr('prep.v1.selected',p.id)}

/* ---------- readiness ---------- */
function lessonsDone(p){var ps=PS(p);return L_(p).filter(function(l){return ps.lessons[l.id]&&ps.lessons[l.id].done}).length}
function chaptersRead(p){var ps=PS(p);return chaptersOf(p).filter(function(c,i){return ps.chapters[i]}).length}
function qaGot(p){var ps=PS(p);return qaOf(p).filter(function(q,i){return ps.qa.status[i]==='got'}).length}
function readyParts(p){
  var ps=PS(p),a=[];
  if(L_(p).length)a.push({k:'lessons',label:'Lessons',w:3,n:lessonsDone(p),d:L_(p).length});
  if(chaptersOf(p).length)a.push({k:'chapters',label:'Chapters',w:1,n:chaptersRead(p),d:chaptersOf(p).length});
  if(sentsOf(p).length)a.push({k:'runs',label:'Practice runs',w:2,n:Math.min(2,ps.runs.length),d:2});
  if(sentsOf(p).length)a.push({k:'why',label:'Sentences you checked',w:2,n:Math.min(Object.keys(ps.why||{}).length,sentsOf(p).length),d:sentsOf(p).length});
  if(numsOf(p).length)a.push({k:'numbers',label:'Numbers gone over',w:1,n:ps.numbersDone?1:0,d:1});
  if(quizOf(p).length)a.push({k:'quiz',label:'Quiz, best round',w:2,n:quizScore(p),d:quizOf(p).length});
  if(qaOf(p).length)a.push({k:'qa',label:'Questions you got',w:2,n:qaGot(p),d:qaOf(p).length});
  return a;
}
/* Best full round, or the best lecture rounds added up, whichever is higher. */
function quizScore(p){var q=PS(p).quiz,s=0;Object.keys(q.lecBest||{}).forEach(function(k){s+=+q.lecBest[k]||0});return Math.min(Math.max(q.best,s),quizOf(p).length)}
function readiness(p){
  var a=readyParts(p),s=0,w=0;
  a.forEach(function(x){s+=x.w*x.n/x.d;w+=x.w});
  return w?Math.round(100*s/w):0;
}

/* ---------- study time, goal, streak ---------- */
var lastInput=Date.now(),speaking=false,goalWait=false;
['pointerdown','keydown','scroll','touchstart'].forEach(function(ev){window.addEventListener(ev,function(){lastInput=Date.now()},{passive:true,capture:true})});
function today(){return dayKey(Date.now())}
function dayRec(k){if(!G.days[k])G.days[k]={s:0,met:false};return G.days[k]}
function isMet(k){var d=G.days[k];return !!(d&&d.met)}
function streakNow(){
  var k=today();
  if(!isMet(k))k=shiftKey(k,-1);
  var n=0;while(isMet(k)){n++;k=shiftKey(k,-1)}
  return n;
}
function bestStreak(){return Math.max(G.best||0,streakNow())}
function todaySecs(){var d=G.days[today()];return d?d.s:0}
function goalPct(){return G.days[today()]&&G.days[today()].met?1:clamp(todaySecs()/(G.goal*60),0,1)}
var RING={streak:113.10,mini:128.81,node:270.18,done:285.88,meter:314.16};
function ringOff(C,p){return p<=0?C:C*(1-Math.max(p,0.02))}
function setArc(el,C,p){el.setAttribute('stroke-dasharray',C);el.setAttribute('stroke-dashoffset',ringOff(C,p));el.classList.toggle('is-zero',p<=0)}
function badgeLabel(){
  var mins=Math.floor(todaySecs()/60),n=streakNow();
  return n+' day streak. Today '+Math.min(mins,G.goal)+' of '+G.goal+' minutes.'+(isMet(today())?' Goal done.':'');
}
function updateBadges(){
  var p=goalPct(),lab=badgeLabel();
  qsa('.streak').forEach(function(b){setArc(qs('.arc',b),RING.streak,p);b.setAttribute('aria-label',lab)});
}
function activeBadge(){var s=qs('.screen.is-on');return s?qs('.streak',s):null}
function studyTick(){
  if(document.hidden)return;
  var running=TM.state==='running',idle=Date.now()-lastInput;
  if(!(idle<90000||speaking||(running&&idle<300000)))return;
  var k=today(),d=dayRec(k);d.s+=5;
  var flipped=false;
  if(!d.met&&d.s>=G.goal*60){d.met=true;flipped=true;G.best=Math.max(G.best||0,streakNow())}
  saveG();updateBadges();
  var sc=$('streak-card');if(sc&&!$('spop').hidden)renderStreakCard();
  if(flipped)goalMoment();
}
function goalMoment(){
  if(sessionOpen()){goalWait=true;return}
  playGoal();
}
function playGoal(){
  if(layers.length){goalWait=true;return}
  goalWait=false;
  announce('Daily goal reached.');
  if(rm())return;
  var b=activeBadge();if(!b)return;
  b.classList.remove('flare');reflow(b);b.classList.add('flare');
  later(function(){playSound('goal')},650);
  later(function(){b.classList.remove('flare')},1700);
}
function setGoal(n){
  G.goal=n;
  var d=dayRec(today());
  if(!d.met&&d.s>=n*60){d.met=true;G.best=Math.max(G.best||0,streakNow())}
  saveG();updateBadges();renderStreakCard();
}

/* ---------- live region ---------- */
var liveFlip=false;
function announce(t){var l=$('live');liveFlip=!liveFlip;l.textContent=t+(liveFlip?'':' ')}

/* ---------- path ---------- */
function inferDo(t){
  t=String(t).toLowerCase();
  var m=[['lesson','lessons'],['chapter','read'],['script','script'],['quiz','quiz'],['question','questions'],['number','numbers']];
  for(var i=0;i<m.length;i++)if(t.indexOf(m[i][0])>=0)return m[i][1];
  return '';
}
function buildPath(p){
  var ps=PS(p),plan=(p.plan||[]).map(function(x){return typeof x==='string'?{text:x,do:inferDo(x)}:{text:x.text,do:typeof x.do==='string'?x.do:inferDo(x.text)}});
  var seenDo={};
  plan.forEach(function(s){if(s.do&&seenDo[s.do])s.do='';else if(s.do)seenDo[s.do]=true});
  /* every kind of content the pack has gets a place on the path, in a fixed order, even if the plan text misses it */
  var ORDER=['lessons','read','script','quiz','questions','numbers'],
    HAVE={lessons:L_(p).length,read:chaptersOf(p).length,script:sentsOf(p).length,quiz:quizOf(p).length,questions:qaOf(p).length,numbers:numsOf(p).length},
    DEF={lessons:'Learn the lessons, one card at a time.',read:'Read the chapters at your own pace.',script:'Read your script aloud with the timer.',quiz:'Do the quiz.',questions:'Practise the questions out loud.',numbers:'Go over the numbers.'};
  ORDER.forEach(function(k,oi){
    if(!HAVE[k]||plan.some(function(s){return s.do===k}))return;
    var at=plan.length;
    for(var j=0;j<plan.length;j++)if(ORDER.indexOf(plan[j].do)>oi){at=j;break}
    plan.splice(at,0,{text:DEF[k],do:k});
  });
  var units=[],flat=[];
  plan.forEach(function(s,si){
    var nodes=[];
    if(s.do==='lessons'){
      L_(p).forEach(function(l,i){
        var st=ps.lessons[l.id]||{},n=l.cards.length,seen=Math.min(st.seen||0,n);
        nodes.push({id:'node-lesson-'+i,kind:'lessons',idx:i,num:i+1,title:l.title,
          detail:'Lesson '+(i+1)+' · '+(st.done?'Done':seen>0?seen+' of '+n+' cards':n+' cards'),
          done:!!st.done,frac:st.done?1:seen/n,aria:'Lesson '+(i+1)+', '+l.title});
      });
    }else if(s.do==='read'&&chaptersOf(p).length){
      var c=chaptersOf(p).length,r=chaptersRead(p);
      nodes.push({id:'node-read-0',kind:'read',idx:0,icon:'read',title:'Read the chapters',
        detail:r>=c?'All read':r>0?r+' of '+c+' read':c+' chapters',done:r>=c,frac:r/c,aria:'Read the chapters'});
    }else if(s.do==='script'&&sentsOf(p).length){
      for(var k=0;k<2;k++){
        var run=ps.runs[k];
        nodes.push({id:'node-script-'+k,kind:'script',idx:k,icon:'mic',title:'Practice run '+(k+1),
          detail:run?'Done in '+mmss(run.secs):'3-minute timer',done:!!run,frac:run?1:0,aria:'Practice run '+(k+1)});
      }
    }else if(s.do==='quiz'&&quizOf(p).length){
      var qn=quizOf(p).length,b=quizScore(p);
      nodes.push({id:'node-quiz-0',kind:'quiz',idx:0,icon:'quiz',title:'Quiz',
        detail:b>0?'Best: '+b+' of '+qn:qn+' questions',done:b>=Math.ceil(qn*0.8),frac:b/qn,aria:'Quiz'});
    }else if(s.do==='questions'&&qaOf(p).length){
      var an=qaOf(p).length,g=qaGot(p);
      nodes.push({id:'node-questions-0',kind:'questions',idx:0,icon:'qa',title:'Questions',
        detail:g>=an?'All got it':g>0?g+' of '+an+' got it':an+' questions',done:g>=an,frac:g/an,aria:'Questions'});
    }else if(s.do==='numbers'&&numsOf(p).length){
      var nn=numsOf(p).length,nd=!!ps.numbersDone;
      nodes.push({id:'node-numbers-0',kind:'numbers',idx:0,icon:'hash',title:'The numbers',
        detail:nd?'Done':nn+' numbers',done:nd,frac:nd?1:0,aria:'The numbers'});
    }
    units.push({n:si+1,text:s.text,nodes:nodes,done:nodes.length>0&&nodes.every(function(x){return x.done})});
    nodes.forEach(function(x){flat.push(x)});
  });
  var curNode=null;
  for(var i=0;i<flat.length;i++){if(!flat[i].done){curNode=flat[i];break}}
  flat.forEach(function(x,i){x.pos=i;x.cur=(x===curNode)});
  return {units:units,nodes:flat,cur:curNode,allDone:flat.length>0&&!curNode,finishPos:flat.length};
}
function heroInfo(p,path){
  var ps=PS(p),n=path.cur;
  if(!n){
    var ak=sentsOf(p).length?'script':quizOf(p).length?'quiz':qaOf(p).length?'questions':'lessons';
    return {line:'Every step is done. Keep it fresh.',label:ak==='script'?'Practise your script':ak==='quiz'?'Do the quiz':ak==='questions'?'Practise the questions':'Go over the lessons',kind:ak,idx:0,bold:null};
  }
  var label='';
  if(n.kind==='lessons'){var st=ps.lessons[L_(p)[n.idx].id]||{};label=((st.seen||0)>0&&!st.done?'Continue lesson ':'Start lesson ')+(n.idx+1)}
  else if(n.kind==='read'){label=ps.place?'Continue reading':'Read chapter '+(firstUnread(p)+1)}
  else if(n.kind==='script')label='Practise your script';
  else if(n.kind==='quiz')label=ps.quiz.best>0?'Beat your best':'Do the quiz';
  else if(n.kind==='questions')label='Practise the questions';
  else label='Go through the numbers';
  return {line:null,bold:n.title,label:label,kind:n.kind,idx:n.idx};
}
function firstUnread(p){var ps=PS(p),c=chaptersOf(p);for(var i=0;i<c.length;i++)if(!ps.chapters[i])return i;return 0}

/* ---------- sound (Web Audio) ---------- */
var AC=null;
function ensureAudio(){
  if(!G.sound||AC)return;
  try{
    var A=window.AudioContext||window.webkitAudioContext;
    if(!A)return;
    if(navigator.audioSession){try{navigator.audioSession.type='ambient'}catch(e){}}
    AC=new A();if(AC.state==='suspended')AC.resume();
  }catch(e){AC=null}
}
document.addEventListener('pointerdown',function(){if(G.sound){ensureAudio();if(AC&&AC.state==='suspended')try{AC.resume()}catch(e){}}},true);
function note(freq,start,dur,peak,type,freq2){
  if(!AC)return;
  try{

  if(!SYN)return;

  if(!vs.length)return;
  var en=vs.filter(function(v){return /^en/i.test(v.lang)});
  var f=null;

  f=find(function(v){return /enhanced|premium/i.test(v.name)});
  if(!f){var names=['Samantha','Daniel','Karen','Moira','Serena','Google UK English Female','Google US English'];
    for(var i=0;i<names.length&&!f;i++)f=find(function(v){return v.name.indexOf(names[i])>=0})}

}

  return was;
}
function speakList(list,key,onItem,onEnd){

  }

function timerTick(){
  if(TM.state==='running'){
    var el=elapsedMs();
    if(!TM.cued&&el>=180000){TM.cued=true;playSound('goal');announce('Three minutes.')}
    if(el>600000){TM.acc+=performance.now()-TM.seg0;TM.state='paused';syncRunning();var b=$('timer-btns');if(b)b.removeAttribute('data-st')}
  }
  updateTimerUI();
}
function timerAction(id){
  if(id==='timer-start'){
    stopSpeech();clearTimeout(TM.msgT);TM.msg=null;
    TM.state='running';TM.acc=0;TM.seg0=performance.now();TM.cued=false;
  }else if(id==='timer-pause'){TM.acc+=performance.now()-TM.seg0;TM.state='paused'}
  else if(id==='timer-resume'){TM.seg0=performance.now();TM.state='running'}
  else if(id==='timer-reset'){resetTimer()}
  else if(id==='timer-done'){timerDone();return}
  syncRunning();
  $('timer-btns').removeAttribute('data-st');

}

}
function resetTimer(silent){

function timerDone(){
  var secs=Math.round(elapsedMs()/1000),ps=PS(cur);

  clearTimeout(TM.msgT);
  if(secs>=RUN_MIN){
    ps.runs.push({at:new Date().toISOString(),secs:secs});saveP(cur);
    var n=ps.runs.length;
    TM.msg={t:'Run '+n+' saved: '+mmss(secs),ok:true};

  var opts=$('quiz-opts');opts.classList.add('is-answered');
  var els=qsa('.opt',opts),right=-1;
  QS.opts.forEach(function(o,i){if(o.orig===q.answer)right=i});
  var cur_=els[k];
  var idx=r.queue[0];
  if(ok){
    cur_.classList.add('ok');cur_.insertAdjacentHTML('beforeend','<span class="mark">'+ic('check')+'</span>');
    els.forEach(function(e,i){if(i!==k)e.classList.add('dim')});
    playSound('correct');
    r.queue.shift();r.solved++;if(!r.missed[idx])r.first++;
  }else{
    cur_.classList.add('bad');cur_.insertAdjacentHTML('beforeend','<span class="mark">'+ic('x')+'</span>');
    els.forEach(function(e,i){if(i!==k&&i!==right)e.classList.add('dim')});
    later(function(){var re=els[right];re.classList.add('ok');re.classList.remove('dim');re.insertAdjacentHTML('beforeend','<span class="mark">'+ic('check')+'</span>')},150);
    playSound('wrong');
    r.missed[idx]=true;r.queue.shift();r.queue.splice(Math.min(2,r.queue.length),0,idx);
  }
  saveP(cur);
  var fb=$('quiz-feedback'),fi=$('quiz-fb-in');
  fb.classList.toggle('bad',!ok);
  fi.innerHTML='<div class="fb-head"><span class="fb-icon">'+ic(ok?'check':'x')+'</span><span>'+(ok?'Correct':'Not quite')+'</span></div>'+
    (ok?'':'<p class="fb-ans"><span>Answer:</span> '+T(q.options[q.answer])+'</p>')+
    '<p class="fb-why">'+T(q.why)+'</p>'+(ok?'':'<p class="fb-note">This one comes back later in the round.</p>')+
    '<button class="btn'+(ok?'':' red')+'" id="quiz-continue" type="button">Continue</button>';
  openEl(fb);
  document.documentElement.style.setProperty('--fb-h',fb.offsetHeight+'px');
  var bt=$('quiz-continue');try{bt.focus({preventScroll:true})}catch(e){}
  later(function(){els[k].scrollIntoView({block:'nearest',behavior:rm()?'auto':'smooth'})},50);
  announce(ok?'Correct.':'Not quite. The answer is '+q.options[q.answer]+'.');
}
function quizContinue(){
  if(!QS||!QS.answered)return;
  var fb=$('quiz-feedback'),r=PS(cur).quiz.round;
  fb.classList.remove('is-open');later(function(){if(!fb.classList.contains('is-open'))fb.hidden=true},300);
  document.documentElement.style.setProperty('--fb-h','0px');
  quizBar();
  if(!r.queue.length){quizFinish();return}
  showQuizQ(true);
  var cl=$('quiz-close');try{cl.focus({preventScroll:true})}catch(e){}
}
function hideFb(){var fb=$('quiz-feedback');fb.classList.remove('is-open');fb.hidden=true;document.documentElement.style.setProperty('--fb-h','0px')}
function closeQuiz(){
  var el=$('quiz-run');if(el.hidden)return;
  hideFb();el.hidden=true;popLayer(el);
  doneTimers.forEach(clearTimeout);
  refresh();
}
function quizFinish(){
  qDone=true;
  var p=cur,ps=PS(p),r=ps.quiz.round,total=r.total,score=r.first,came=Object.keys(r.missed).length,lec=r.lec||0,lb=ps.quiz.lecBest,old=lec?(+lb[lec]||0):ps.quiz.best;
  var nb=score>old;
  if(lec)lb[lec]=Math.max(old,score);else ps.quiz.best=Math.max(old,score);
  ps.quiz.last=score;ps.quiz.lastTotal=total;if(QS)QS.lec=lec;
  ps.quiz.history.unshift({at:new Date().toISOString(),score:score,total:total,lec:lec});
  ps.quiz.history=ps.quiz.history.slice(0,10);
  ps.quiz.round=null;saveP(p);
  $('quiz-top').hidden=true;
  var line=score===total?'Every answer right the first time.':score+' of '+total+' right the first time.';
  $('quiz-round').innerHTML=doneHTML({id:'quiz-done',title:'Quiz done!',line:line,
    stats:[{v:score,l:'first try'},{v:came,l:'came back'},{v:Math.round(100*score/total),l:'score',suf:'%',g:true}],
    newBest:nb,buttons:[{id:'quiz-done-again',t:'New round'},{id:'quiz-done-home',t:QS&&QS.from==='home'?'Back to Home':'Done',plain:true}]});
  playDone('quiz-done');
  var f=$('quiz-done-again');if(f)f.focus({preventScroll:true});
}
$('quiz-close').addEventListener('click',closeQuiz);
$('quiz-round').addEventListener('click',function(e){
  var o=e.target.closest('.opt');if(o){quizAnswer(+o.getAttribute('data-k'));return}
  if(e.target.closest('#quiz-done-again')){var qf=QS&&QS.from,ql=QS&&QS.lec;closeQuiz();PS(cur).quiz.round=null;openQuizRound(true,ql);if(QS)QS.from=qf;return}
  if(e.target.closest('#quiz-done-home')){var home_=QS&&QS.from==='home';closeQuiz();if(home_)goTab('home')}
});
$('quiz-feedback').addEventListener('click',function(e){if(e.target.closest('#quiz-continue'))quizContinue()});
document.addEventListener('keydown',function(e){
  var t=topLayer();if(!t||t.el.id!=='quiz-run'||qDone)return;
  if(e.key>='1'&&e.key<='4'&&QS&&!QS.answered&&QS.opts&&QS.opts[+e.key-1]){quizAnswer(+e.key-1)}
  else if(e.key==='Enter'&&QS&&QS.answered&&document.activeElement.id!=='quiz-continue'){e.preventDefault();quizContinue()}
});

/* ---------- questions ---------- */
var QA=null;
function qaStatusIcon(s){return s==='got'?'<span class="qdisc got">'+ic('check')+'</span>':s==='again'?'<span class="qdisc">'+ic('reset')+'</span>':'<span class="qdisc"></span>'}
function qaStartHTML(){
  var p=cur,ps=PS(p),qs_=qaOf(p),n=qs_.length;
  if(!n)return emptyHTML('qa','No questions in this pack.','');
  var got=qaGot(p),left=n-got;
  var h='<div class="card start"><div class="start-icon">'+ic('qa')+'</div><h2>'+plural(n,'question')+'</h2>'+
    '<div class="prog-line"><b>Got it</b><span>'+got+' of '+n+'</span></div><div class="pbar" style="--p:'+(got/n)+'"><i></i></div>'+
    '<p>'+(isExam(p)?'Answer out loud or on paper, then reveal and compare. A strong exam answer gives a definition, the points, and one example from the slides.':'Think of your answer and say it out loud. Then reveal and compare. If a question goes past what you know, say you didn\'t find it, then give the closest fact you do know.')+'</p><div class="btn-stack">';
  if(got===0)h+='<button class="btn" id="qa-start" type="button">Start questions</button>';
  else if(left>0)h+='<button class="btn" id="qa-start" type="button">Practise the '+left+' left</button><button class="btn plain" id="qa-all" type="button">All '+n+' questions</button>';
  else h+='<button class="btn" id="qa-start" type="button">Practise all '+n+' again</button>';
  h+='</div></div><div class="sec"><h2>All questions</h2><p>Tap one to practise it.</p></div><div style="height:15px"></div>';
  qs_.forEach(function(q,i){
    h+='<button class="qrow row-press" id="qa-row-'+i+'" type="button" data-i="'+i+'">'+qaStatusIcon(ps.qa.status[i])+'<span class="qrow-text"><b>'+T(q.q)+'</b><span>'+(q.who==='lecturer'?'Lecturer':q.who==='exam'?'Exam':'Classmate')+'</span></span></button>';
  });
  return h;
}
function renderQA(){$('qa-body').innerHTML=qaStartHTML();syncSoundBtns()}
R.qa=renderQA;
$('qa-body').addEventListener('click',function(e){
  var r=e.target.closest('.qa-row,.qrow');
  if(r){openQaRound(+r.getAttribute('data-i'));return}
  if(e.target.closest('#qa-all')){openQaRound('all');return}
  if(e.target.closest('#qa-start')){
    var n=qaOf(cur).length,got=qaGot(cur);
    openQaRound(got>0&&got<n?'left':'all');
  }
});
function openQaRound(mode){
  var p=cur,ps=PS(p),qs_=qaOf(p);if(!qs_.length)return;
  stopSpeech();
  var idx=qs_.map(function(_,i){return i}),queue;
  if(typeof mode==='number')queue=[mode];
  else if(mode==='left'){queue=idx.filter(function(i){return ps.qa.status[i]!=='got'});if(!queue.length)queue=idx}
  else queue=idx;
  QA={all:queue.slice(),queue:queue.slice(),total:queue.length,done:0,retried:{},single:typeof mode==='number',revealed:false,t0:Date.now(),fin:false,from:curScreen,revealAt:0};
  $('qa-top').hidden=false;
  $('qa-run').hidden=false;
  syncSoundBtns();
  showQaQ(false);
  pushLayer($('qa-run'),closeQa,$('qa-close'),true);
}
function qaBar(){$('qa-bar').style.setProperty('--p',QA.done/QA.total)}
function showQaQ(anim){
  var q=qaOf(cur)[QA.queue[0]];QA.revealed=false;
  var h='<div class="qwrap'+(anim?' in':'')+'"><div class="card qa-card"><span class="pill">'+(q.who==='lecturer'?'Lecturer asks':q.who==='exam'?'Exam question':'Classmate asks')+'</span><div class="qa-q">'+T(q.q)+'</div><p class="qa-think" id="qa-think">'+(q.who==='exam'?'Think first. Say or jot down your answer.':'Think first. Say your answer out loud.')+'</p>'+
    '<div class="reveal" id="qa-reveal-box" inert><div><div class="qa-ans"><div class="qa-ans-h"><span>'+(q.who==='exam'?'A strong answer':'You could say')+'</span>'+(SYN?'<button class="icon-btn sm" id="qa-listen" type="button" data-lk="qa" aria-label="Listen to the answer" aria-pressed="false">'+ic('vol')+'</button>':'')+'</div><p>'+T(q.answer)+'</p></div></div></div></div></div>';
  var body=$('qa-round');body.innerHTML=h;body.scrollTop=0;
  $('qa-actions').innerHTML='<div class="actions" style="grid-template-columns:1fr"><button class="btn" id="qa-reveal" type="button">Show answer</button></div>';
  qaBar();
  var rv=$('qa-reveal');try{rv.focus({preventScroll:true})}catch(e){}
  announce('Question '+(QA.done+1)+' of '+QA.total+'.');
}
function qaReveal(){
  if(!QA||QA.revealed)return;
  QA.revealed=true;QA.revealAt=performance.now();
  var rb=$('qa-reveal-box');rb.classList.add('is-open');rb.removeAttribute('inert');
  var th=$('qa-think');if(th)th.hidden=true;
  $('qa-actions').innerHTML='<div class="actions even"><button class="btn plain" id="qa-again" type="button">Again</button><button class="btn" id="qa-gotit" type="button">Got it</button></div>';
  playSound('tick');updateListenUI();
  var g=$('qa-gotit');try{g.focus({preventScroll:true})}catch(e){}
  later(function(){var a=qs('#qa-round .qa-ans');if(a)a.scrollIntoView({block:'nearest',behavior:rm()?'auto':'smooth'})},120);
}
function qaMark(got){
  if(!QA||!QA.revealed||QA.fin||performance.now()-(QA.revealAt||0)<400)return;
  stopSpeech();
  var ps=PS(cur),i=QA.queue.shift();
  ps.qa.status[i]=got?'got':'again';saveP(cur);
  playSound('tick');
  if(!got&&!QA.retried[i]&&!QA.single){QA.retried[i]=true;QA.queue.splice(Math.min(2,QA.queue.length),0,i)}
  else QA.done++;
  qaBar();
  if(!QA.queue.length){qaFinish();return}
  showQaQ(true);
}
function closeQa(){
  var el=$('qa-run');if(el.hidden)return;
  stopSpeech();el.hidden=true;popLayer(el);
  doneTimers.forEach(clearTimeout);
  refresh();
}
function qaFinish(){
  QA.fin=true;
  var p=cur,ps=PS(p),qs_=qaOf(p),n=QA.total;
  var gotRound=0,againRound=0;
  QA.all.forEach(function(i){if(ps.qa.status[i]==='got')gotRound++;else againRound++});
  if(QA.single){closeQa();announce(gotRound?'Marked as got it.':'Marked for another go.');return}
  var left=qs_.filter(function(_,i){return ps.qa.status[i]!=='got'}).length;
  var line=QA.single?(gotRound?'Marked as got it.':'Marked for another go.'):gotRound+' of '+n+' marked got it.';
  var btns=[];
  if(left>0){btns.push({id:'qa-done-again',t:'Practise the '+left+' left'});btns.push({id:'qa-done-home',t:QA.from==='home'?'Back to Home':'Done',plain:true})}
  else btns.push({id:'qa-done-home',t:QA.from==='home'?'Back to Home':'Done'});
  $('qa-top').hidden=true;$('qa-actions').innerHTML='';
  $('qa-round').innerHTML=doneHTML({id:'qa-done',title:'Questions done!',line:line,
    stats:[{v:gotRound,l:'got it'},{v:againRound,l:'again'},{v:readiness(p),l:'ready',suf:'%',g:true}],buttons:btns});
  playDone('qa-done');
  announce('Questions done.');
  var f=$('qa-done-again')||$('qa-done-home');if(f)f.focus({preventScroll:true});
}
$('qa-close').addEventListener('click',closeQa);
$('qa-run').addEventListener('click',function(e){
  if(e.target.closest('#qa-reveal'))qaReveal();
  else if(e.target.closest('#qa-gotit'))qaMark(true);
  else if(e.target.closest('#qa-again'))qaMark(false);
  else if(e.target.closest('#qa-listen')){
    if(speaking&&speakKey==='qa'){stopSpeech();return}
    speakList([qaOf(cur)[QA.queue[0]].answer],'qa');
  }
  else if(e.target.closest('#qa-done-again')){var qaf=QA&&QA.from;closeQa();openQaRound('left');if(QA)QA.from=qaf}
  else if(e.target.closest('#qa-done-home')){var qh=QA&&QA.from==='home';closeQa();if(qh)goTab('home')}
});
document.addEventListener('keydown',function(e){
  var t=topLayer();if(!t||t.el.id!=='qa-run'||!QA||QA.fin)return;
  if(e.key==='Enter'&&!QA.revealed&&document.activeElement.id!=='qa-reveal'){e.preventDefault();qaReveal()}
  else if(QA.revealed&&e.key==='1')qaMark(false);
  else if(QA.revealed&&e.key==='2')qaMark(true);
});
['quiz-sound','qa-sound','quiz-run-sound','qa-run-sound'].forEach(function(id){$(id).addEventListener('click',toggleSound)});

/* ---------- init ---------- */
document.addEventListener('touchstart',function(){},{passive:true});
function showError(){
  $('app').innerHTML=emptyHTML('pres','Nothing to study yet','The study content could not be read.');
  $('tabbar').hidden=true;
}
/* focus ring only for keyboard users: scripted focus after a tap should not draw it */
document.documentElement.classList.add('pointer');
document.addEventListener('pointerdown',function(){document.documentElement.classList.add('pointer')},true);
document.addEventListener('keydown',function(e){if(e.key==='Tab'||e.key==='Enter'||e.key===' '||(e.key&&e.key.indexOf('Arrow')===0))document.documentElement.classList.remove('pointer')},true);
function init(){
  if(bad){showError();return}
  setSelected(pickInitialPack());
  syncSoundBtns();
  updateBadges();
  route();
  setInterval(studyTick,5000);
  setInterval(updateCountdown,20000);
  if(window.matchMedia){
    var mq=window.matchMedia('(prefers-reduced-motion: reduce)');
    if(mq.addEventListener)mq.addEventListener('change',function(){});
  }
  window.addEventListener('load',function(){placeHl(true);watchHeader()});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){placeHl(true)});
}
init();

})();
</script>
